 "21.45"}, {"s": 21, "q": "How do the seven HR functions connect in the KeeTa case?", "k": "HR functions connected, integrated HR", "a": "Missing job analysis leads to no SOPs or training, which leads to unsafe work. Unfair pay leads to turnover, which creates recruiting pressure. Automatic discipline without review breaks equitable justice. Fixing one function helps the others.", "id": "21.46"}, {"s": 21, "q": "Is KeeTa practising personnel management or strategic HRM?", "k": "personnel management vs HRM, SHRM, strategic HRM", "a": "For couriers, it's closer to old-style control: rules, monitoring and penalties. Strategic HRM would treat couriers as human capital and link pay, safety and performance to long-term business success, which is what our recommendations aim for.", "id": "21.47"}, {"s": 21, "q": "What is human capital, and how does it apply to couriers?", "k": "human capital, employees as assets", "a": "Seeing workers as a source of value whose skills and knowledge grow with investment, rather than as a cost. Experienced, safe couriers are KeeTa's human capital; losing them through turnover wastes that value.", "id": "21.48"}, {"s": 21, "q": "What is the main point of slide 21?", "k": "summarise slide 21, thank you slide", "a": "It closes the presentation and opens Q&A.", "id": "21.49"}, {"s": 21, "q": "Why did you choose only three recommendations?", "k": "only three recommendations, why three", "a": "One for each issue, so every problem we found has a matching solution. More recommendations would be harder to cover well in 20 minutes; a development path is our suggested next step.", "id": "21.50"}, {"s": 21, "q": "Why is there no separate training recommendation?", "k": "no training recommendation, training separate", "a": "Training is built into recommendation two as the riding-safety module in onboarding, because in our analysis training is part of the safety fix, not a separate problem.", "id": "21.51"}, {"s": 21, "q": "Why is there no recruitment recommendation?", "k": "no recruitment recommendation", "a": "Recruitment is a strength for KeeTa: it signs couriers up quickly. The problem is keeping them, so we focused on pay, safety and fairness, which reduce turnover and so also help recruitment.", "id": "21.52"}, {"s": 21, "q": "Why are there two slides for each issue?", "k": "slide structure, two slides per issue", "a": "The first slide shows what happens at KeeTa, the evidence. The second applies course concepts, the analysis. That keeps facts and theory clear, as the brief asks for findings linked to concepts.", "id": "21.53"}, {"s": 21, "q": "Which part of your analysis is strongest?", "k": "strongest part, best evidence", "a": "The pay analysis, because several sources agree on the cuts, KeeTa's own response confirms the strike, and the Foodpanda comparison shows a realistic alternative.", "id": "21.54"}, {"s": 21, "q": "Which part of your analysis is weakest?", "k": "weakest part, weakest evidence", "a": "The exact delivery-time and pay figures, because they come from couriers' accounts rather than KeeTa data. We label them clearly and propose measuring them in the pilot.", "id": "21.55"}, {"s": 21, "q": "Isn't this outside HR's control, since engineers build the app?", "k": "outside HR control, engineers decide", "a": "That's our point: HR decisions have moved into the app. HR should set the rules for pay, safety and fairness, and engineering builds them. Without HR involvement, the app makes HR decisions by default.", "id": "21.56"}, {"s": 21, "q": "Is KeeTa a bad employer?", "k": "bad employer, bad company", "a": "We don't label it that way. KeeTa offers flexibility, fast pay information and insurance. Our finding is that its HR design for couriers has clear gaps that cause harm and business risk, and they're fixable.", "id": "21.57"}, {"s": 21, "q": "What would happen if KeeTa adopted only one of your recommendations?", "k": "only one implemented, partial adoption", "a": "It would help, but less. A pay floor alone still leaves unsafe dispatch and unfair penalties. Safer dispatch alone still leaves income insecurity. They work best as a package, which is why the pilot tests all three.", "id": "21.58"}, {"s": 21, "q": "Can you explain the whole problem to someone who knows nothing about HR?", "k": "explain simply whole presentation, layman explanation, without HR jargon, no jargon, simple words, explain to a non-expert", "a": "KeeTa's app acts like a boss that sets pay, deadlines and punishments, but nobody checks if it's fair or safe. So couriers' pay fell, they rush dangerously, and they get punished for things that aren't their fault. We suggest a minimum pay, a safer app and real people to hear complaints.", "id": "21.59"}, {"s": 21, "q": "Speaker, can you explain your slide in your own words?", "k": "own words, explain your part, without notes", "a": "Use the slide's main point in one sentence, then one piece of evidence and one course concept. Search \"main point of slide\" plus your slide number in this Finder for a ready summary.", "id": "21.60"}]}</script>
<script>
(() => {
const DATA = JSON.parse(document.getElementById('data').textContent);
const SLIDES = DATA.slides, ITEMS = DATA.items;
const SL = Object.fromEntries(SLIDES.map(s => [s.n, s]));
const TOP10 = ['15.1','15.2','5.4','6.6','7.6','13.1','14.1','11.8','17.1','19.3'];
const FALLBACK = ITEMS.find(it => /didn't prepare for/.test(it.q)) || ITEMS[ITEMS.length-1];
document.getElementById('count').textContent = ITEMS.length + ' questions · 21 slides';

/* ---------- text processing ---------- */
const STOP = new Set(('a an the and or but if of to in on at by for with from into onto about as is are was were be been being am do does did done '+
 'this that these those it its it\'s they them their there here what which who whom whose why how when where can could would should will shall may might must '+
 'i me my we us our you your he she his her not no yes so than then too very just also any some all each more most such own same other '+
 'have has had having get got go goes going make makes made say says said tell explain mean means meaning talk question ask asking about '+
 'slide slides please like really actually think thing things kind sort lot lots isn isnt don dont doesn doesnt didn wasn aren won wouldn couldn shouldn wo ca happen happens happened happening').split(/\s+/));
const NUMWORD = {one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,'twenty-one':21,'twenty one':21,first:1,second:2,third:3,fourth:4,fifth:5,sixth:6,seventh:7,eighth:8,ninth:9,tenth:10,last:21};

function stem(w){
  if (/^\d/.test(w) || w.length <= 3) return w;
  const rules = [['ational','ate'],['ization','ize'],['isation','ize'],['iveness','ive'],['fulness','ful'],['ousness','ous'],
    ['ations','ate'],['ation','ate'],['ments','ment'],['ities','ity'],['ingly',''],['edly',''],['ings',''],['ing',''],
    ['ies','y'],['ied','y'],['ness',''],['ers','er'],['ed',''],['es',''],['ly',''],['s','']];
  for (const [suf, rep] of rules){
    if (w.endsWith(suf) && w.length - suf.length + rep.length >= 3){
      let r = w.slice(0, w.length - suf.length) + rep;
      if (suf==='es' && !/(s|x|z|ch|sh)$/.test(r)) r = w.slice(0,-1);          // "fees" -> "fee"
      if (/([^aeiouls])\1$/.test(r)) r = r.slice(0,-1);                         // "stopp" -> "stop"
      return r;
    }
  }
  return w;
}
function norm(t){
  return t.toLowerCase().replace(/[’‘]/g,"'").replace(/hk\$/g,'hk ').replace(/\$/g,' ')
    .replace(/k go/g,'kgo').replace(/km\/h/g,'kmh').replace(/360-degree|360 degree/g,'360').replace(/e-?mail/g,'email')
    .replace(/pop-?ups?/g,'popup').replace(/piece[- ]?rates?/g,'piecerate').replace(/work[- ]life/g,'worklife').replace(/\bcan[- ]do\b/g,'cando').replace(/\bwill[- ]do\b/g,'willdo').replace(/on[- ]the[- ]job/g,'onthejob').replace(/off[- ]the[- ]job/g,'offthejob').replace(/self-?employed/g,'selfemployed')
    .replace(/'s\b/g,'').replace(/n't\b/g,' not');
}
function tokens(t){
  return (norm(t).match(/[a-z]+|\d+(?:\.\d+)?/g) || []).filter(w => !STOP.has(w)).map(stem);
}

/* ---------- concept groups (synonyms, course terms) ---------- */
const GROUPS = [
 'pay wage wages salary income earn earnings fee fees money compensation remuneration commission rate rates piecerate paid paying payment base floor reward',
 'minimum 43.1 40 44 floor statutory',
 'safe safety accident accidents crash crashes injury injuries hazard hazards danger dangerous osh collision collisions road riding ride',
 'phone popup screen tap tapping notification distraction distracted',
 'performance appraisal appraise rating rate evaluation evaluate review kpi kpis target targets monitor monitoring assess assessment measure',
 'penalty penalties deduction deductions punish punishment fine fines sanction points attendance',
 'appeal appeals grievance complaint complaints dispute challenge',
 'contractor contractors employee employees status gig selfemployed freelance freelancer classification classify reclassify reclassified worker',
 'law laws legal court courts ordinance legislation tribunal ruling rulings case judge lawsuit litigation',
 'training train trainer course onboarding induction learning learn development develop skill skills',
 'recruit recruitment recruiting hire hiring selection select attract aida applicant candidate',
 'turnover quit quitting leave leaving retention retain attrition separation separations leaver leavers',
 'cost costs expensive afford affordable budget price prices margin margins profit profitable cheap spend',
 'qwl quality worklife life',
 'research method methods source sources evidence data reliable reliability bias biased paper papers study studies interview interviews survey primary secondary',
 'foodpanda panda competitor competitors rival rivals deliveroo',
 'strike strikes striker strikers protest protests walkout dispute',
 'demand demands want wanted request requests ask',
 'time eta minute minutes deadline deadlines late lateness punctual punctuality delay delays fast speed slow',
 'weather typhoon typhoons rain rainstorm storm heat',
 'algorithm algorithmic software ai automatic automated system gps tracking track app technology tech',
 'value values mission vision meituan integrity culture',
 'pilot trial test district tsuen wan rollout phase scale',
 'photo photos image images colour colours color colors design chart graph visual',
 'discipline disciplinary progressive warning deactivation deactivate termination fire dismiss ethics ethical justice fair fairness unfair equity equitable procedural',
 'kgo priority dispatch order orders',
 'insurance insured cover claim claims benefit benefits mpf leave perk perks',
 'smart specific measurable achievable relevant goal goals',
 'error errors halo recency leniency bias strictness central tendency',
 'job analysis description specification jd js ksao ksaos workflow sop sops procedure',
 'forecast forecasting demand trend ratio scatter shortage surplus planning',
 'customer customers coupon coupons service',
 'recommend recommendation recommendations fix solution proposal suggest',
 'reference references apa citation cite',
 'choose chose chosen pick picked choice',
 'formula calculate calculation compute example',
];
const SYN = new Map();
GROUPS.forEach((g, gi) => g.split(/\s+/).forEach(w => {
  const s = stem(norm(w).replace(/[^a-z0-9.]/g,''));
  if (!s) return;
  if (!SYN.has(s)) SYN.set(s, new Set());
  SYN.get(s).add(gi);
}));
const GROUPTERMS = GROUPS.map(g => [...new Set(g.split(/\s+/).map(w => stem(norm(w).replace(/[^a-z0-9.]/g,''))))]);

/* ---------- index (BM25 per field) ---------- */
const FIELDS = {q:2.6, k:2.0, t:1.3, a:1.0};
const docs = ITEMS.map(it => {
  const s = SL[it.s];
  const f = {q:tokens(it.q), k:tokens(it.k||''), t:tokens(s.t+' '+s.x), a:tokens(it.a)};
  const tf = {}; for (const k in f){ tf[k] = new Map(); f[k].forEach(w => tf[k].set(w,(tf[k].get(w)||0)+1)); }
  return {it, f, tf, qn:' '+tokens(it.q).join(' ')+' ~ '+(it.k||'').split(',').map(x=>tokens(x).join(' ')).join(' ~ ')+' '};
});
const N = docs.length, df = new Map(), avg = {};
for (const k in FIELDS){ avg[k] = docs.reduce((n,d)=>n+d.f[k].length,0)/N; }
docs.forEach(d => new Set([...d.f.q,...d.f.k,...d.f.t,...d.f.a]).forEach(w => df.set(w,(df.get(w)||0)+1)));
const VOCAB = [...df.keys()];
const idf = w => { const n = df.get(w)||0; return Math.log(1 + (N - n + .5)/(n + .5)); };
function bm25(d, w){
  let s = 0;
  for (const k in FIELDS){
    const f = d.tf[k].get(w); if (!f) continue;
    const len = d.f[k].length, K = 1.2*(1 - .75 + .75*len/(avg[k]||1));
    s += FIELDS[k] * f*(2.2)/(f + K);
  }
  return s * idf(w);
}
function lev(a, b, max){
  if (Math.abs(a.length-b.length) > max) return max+1;
  let prev = Array.from({length:b.length+1},(_,i)=>i);
  for (let i=1;i<=a.length;i++){
    const cur=[i]; let best=i;
    for (let j=1;j<=b.length;j++){
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
      best=Math.min(best,cur[j]);
    }
    if (best>max) return max+1; prev=cur;
  }
  return prev[b.length];
}

/* ---------- query parsing ---------- */
function parseSlide(raw){
  const t = raw.toLowerCase();
  let m = t.match(/\b(?:slide|slides|sl|s|page|p)\s*(?:no\.?|number|#)?\s*(\d{1,2})\b/);
  if (m && +m[1]>=1 && +m[1]<=21) return {n:+m[1], rest:raw.replace(m[0],' ')};
  m = t.match(/\b(?:slide|page)\s+(twenty[\s-]one|[a-z]+)\b/);
  if (m && NUMWORD[m[1]]) return {n:NUMWORD[m[1]], rest:raw.replace(new RegExp(m[0],'i'),' ')};
  m = t.match(/\b(first|second|third|fourth|fifth|sixth|seventh|eighth|ninth|tenth|last)\s+slide\b/);
  if (m) return {n:NUMWORD[m[1]], rest:raw.replace(new RegExp(m[0],'i'),' ')};
  m = t.match(/^\s*(\d{1,2})\s+[a-z]/);                                         // "15 minimum wage"
  if (m && +m[1]>=1 && +m[1]<=21 && !/^\s*\d{1,2}\s*(min|minute|km|order|hour|%)/.test(t)) return {n:+m[1], rest:raw.replace(/^\s*\d{1,2}/,' ')};
  m = t.match(/^\s*(\d{1,2})\s*$/);
  if (m && +m[1]>=1 && +m[1]<=21) return {n:+m[1], rest:''};
  return {n:null, rest:raw};
}
const RECMAP = [[/\brec(?:ommendation)?\s*(?:#|no\.?)?\s*1\b|\bfirst rec/i,15],[/\brec(?:ommendation)?\s*(?:#|no\.?)?\s*2\b|\bsecond rec/i,16],[/\brec(?:ommendation)?\s*(?:#|no\.?)?\s*3\b|\bthird rec/i,17],
  [/\bissue\s*1\b/i,7],[/\bissue\s*2\b/i,10],[/\bissue\s*3\b/i,12]];

function search(raw, chosenSlide){
  const direct = raw.match(/\b(\d{1,2})\.(\d{1,2})\b/);
  if (direct){ const hit = ITEMS.find(it => it.id === direct[1]+'.'+direct[2]); if (hit) return {slide:hit.s, list:[{it:hit, score:99}], direct:true, terms:[]}; }
  let {n, rest} = parseSlide(raw);
  const slide = n || chosenSlide || null;
  const boost = {}; RECMAP.forEach(([re,s]) => { if (re.test(rest)) boost[s] = 1; });
  const qt = tokens(rest);
  if (!qt.length) return {slide, list:[], terms:[], fromText:!!n};
  // one "slot" per query word: the word itself, a typo fix or prefix, and its synonyms.
  // A document scores the best term in each slot, so synonyms help without piling up.
  const slots = qt.map((w, i) => {
    const m = new Map(); const add = (v,x) => m.set(v, Math.max(m.get(v)||0, x));
    if (df.has(w)) add(w, 1);
    else {
      let best=null, bd=9; const max = w.length>=8?2:(w.length>=4?1:0);
      if (max) for (const v of VOCAB){ const d = lev(w,v,max); if (d<bd){bd=d;best=v;} if (bd===1&&max===1) break; }
      if (best && bd<=max) add(best, .8);
      if (i === qt.length-1 && w.length>=3) VOCAB.filter(v => v.startsWith(w) && v!==w).slice(0,6).forEach(v => add(v,.6));
    }
    const base = [...m.keys()].concat(w);
    base.forEach(b => (SYN.get(b)||[]).forEach(g => GROUPTERMS[g].forEach(s => { if (s!==w && df.has(s)) add(s, .4); })));
    return m;
  }).filter(m => m.size);
  const W = new Map(); slots.forEach(m => m.forEach((x,v) => W.set(v, Math.max(W.get(v)||0, x))));
  const bigrams = []; for (let i=0;i<qt.length-1;i++) bigrams.push(' '+qt[i]+' '+qt[i+1]+' ');
  const scoreDoc = d => {
    let s = 0, hits = 0;
    slots.forEach(m => { let best = 0, strong = false;
      m.forEach((wt, v) => { const b = wt*bm25(d, v); if (b > best){ best = b; strong = wt >= .6; } });
      s += best; if (best > 0 && strong) hits++; });
    bigrams.forEach(b => { if (d.qn.includes(b)) s += 2.5; });
    s *= 1 + .3*Math.max(0, hits-1);
    if (boost[d.it.s]) s *= 1.6;
    d._hits = hits;
    return s;
  };
  const pool = slide ? docs.filter(d => d.it.s === slide) : docs;
  const scored = pool.map(d => ({it:d.it, score:scoreDoc(d), hits:d._hits})).filter(x => x.score > 0).sort((a,b) => b.score-a.score);
  let other = [];
  if (slide){
    other = docs.filter(d => d.it.s !== slide).map(d => ({it:d.it, score:scoreDoc(d)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,3);
  }
  return {slide, list:scored, other, terms:[...W.keys()], fromText:!!n, slots:slots.length};
}

/* ---------- rendering ---------- */
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function highlight(text, terms){
  if (!terms || !terms.length) return esc(text);
  const set = new Set(terms);
  return esc(text).replace(/[A-Za-z]+(?:'[a-z]+)?|\d+(?:\.\d+)?/g, w => {
    const s = stem(norm(w).replace(/[^a-z0-9.]/g,''));
    return (s && set.has(s) && !STOP.has(w.toLowerCase())) ? '<mark>'+w+'</mark>' : w;
  });
}
function answerHTML(a, terms){
  return a.split(/\n\s*\n/).map(block => {
    const lines = block.split('\n').filter(Boolean);
    if (lines.length && lines.every(l => /^\d+\.\s/.test(l)))
      return '<ol>'+lines.map(l => '<li>'+highlight(l.replace(/^\d+\.\s/,''),terms)+'</li>').join('')+'</ol>';
    return '<p>'+highlight(block,terms)+'</p>';
  }).join('');
}
function metaHTML(it){
  const s = SL[it.s];
  return `<div class="meta"><span class="qid">${it.id}</span><span class="tag">Slide ${it.s} · ${esc(s.t)}</span><span class="tag sp">${esc(s.sp)} answers</span>${s.bk?`<span class="tag">Backup: ${esc(s.bk)}</span>`:''}</div>`;
}
function bestHTML(it, terms){
  return `<article class="best">${metaHTML(it)}<h2>${highlight(it.q,terms)}</h2><div class="ans">${answerHTML(it.a,terms)}</div></article>`;
}
function altHTML(it, terms, i){
  return `<button class="alt" type="button" aria-expanded="false" data-i="${i}"><div class="row"><span class="qid">${it.id}</span>
    <div style="min-width:0"><div class="qt">${highlight(it.q,terms)}</div><div class="sub">Slide ${it.s} · ${esc(SL[it.s].sp)}</div></div></div>
    <div class="ans" hidden>${answerHTML(it.a,terms)}</div></button>`;
}

let chosen = null;
function renderStrip(active){
  $('strip').innerHTML = `<button type="button" class="chip all" data-s="" aria-pressed="${!active}">All</button>` +
    SLIDES.map(s => `<button type="button" class="chip" data-s="${s.n}" aria-pressed="${active===s.n}" title="${esc(s.t)}">${s.n}</button>`).join('');
  const on = $('strip').querySelector('[aria-pressed="true"]');
  if (on && on.scrollIntoView) on.scrollIntoView({block:'nearest', inline:'center'});
}
function run(){
  const raw = $('q').value;
  $('clear').hidden = !raw;
  const r = search(raw, chosen);
  renderStrip(r.slide);
  const out = $('out'), st = $('status');
  let html = '';
  if (!raw.trim() && !r.slide){
    st.innerHTML = 'Type a slide number and a few words from the question. Or tap a slide.';
    html += `<p class="label">10 most likely questions</p><div class="alts">` +
      TOP10.map(id => ITEMS.find(x=>x.id===id)).map((it,i)=>altHTML(it,[],i)).join('') + '</div>';
    out.innerHTML = html; bind(TOP10.map(id => ITEMS.find(x=>x.id===id)), []); return;
  }
  const s = r.slide ? SL[r.slide] : null;
  const slideItems = s ? ITEMS.filter(it => it.s === r.slide) : [];
  let list;
  if (r.direct){
    st.innerHTML = `Question <b>${r.list[0].it.id}</b>`;
    list = r.list;
  } else if (!r.terms.length){
    st.innerHTML = `<b>Slide ${s.n}</b> · ${esc(s.t)} · ${esc(s.sp)} · ${slideItems.length} questions`;
    out.innerHTML = `<p class="label">All questions on slide ${s.n}</p><div class="alts">` + slideItems.map((it,i)=>altHTML(it,[],i)).join('') + '</div>';
    bind(slideItems, []); return;
  } else {
    list = r.list;
    st.innerHTML = s ? `Searching <b>slide ${s.n}</b> · ${esc(s.t)}${r.fromText?' (from your text)':''}` : `Searching <b>all slides</b> · add "slide 12" to narrow it down`;
  }
  if (!list.length){
    html += `<div class="empty">No close match${s?` on slide ${s.n}`:''}. Try other words, like the course term or a number from the slide.</div>`;
    if (!s){ html += `<p class="label">How to handle an unprepared question</p>` + bestHTML(FALLBACK, []); }
    if (s){ html += `<p class="label">All questions on slide ${s.n}</p><div class="alts">` + slideItems.map((it,i)=>altHTML(it,r.terms,i)).join('') + '</div>'; }
    out.innerHTML = html; bind(s?slideItems:[], r.terms); return;
  }
  const rest = list.slice(1, 6).map(x => x.it);
  html += `<p class="label">Closest match</p>` + bestHTML(list[0].it, r.terms);
  if (!r.direct && r.slots >= 3 && list[0].hits / r.slots < 0.5)
    html += `<div class="empty">Only part of your question matched. Check the options below, try the lecturer's key term, or see <b>${FALLBACK.id}</b> for how to answer an unprepared question.</div>`;
  if (rest.length) html += `<p class="label">Also close</p><div class="alts">` + rest.map((it,i)=>altHTML(it,r.terms,i)).join('') + '</div>';
  const others = (r.other||[]).filter(o => !list.length || o.score > list[0].score*0.9).map(o=>o.it);
  if (others.length) html += `<p class="label">Better fit on another slide?</p><div class="alts">` + others.map((it,i)=>altHTML(it,r.terms,rest.length+i)).join('') + '</div>';
  out.innerHTML = html; bind(rest.concat(others), r.terms);
}
function bind(){
  document.querySelectorAll('.alt').forEach(b => b.addEventListener('click', () => {
    const open = b.getAttribute('aria-expanded') === 'true';
    b.setAttribute('aria-expanded', String(!open));
    b.querySelector('.ans').hidden = open;
  }));
}
$('q').addEventListener('input', run);
$('q').addEventListener('keydown', e => { if (e.key === 'Escape'){ $('q').value=''; chosen=null; run(); } if (e.key==='Enter'){ $('q').blur(); } });
$('clear').addEventListener('click', () => { $('q').value=''; chosen=null; run(); $('q').focus(); });
$('strip').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  const n = b.dataset.s ? +b.dataset.s : null;
  // a chip overrides any slide written in the box
  const p = parseSlide($('q').value); if (p.n) $('q').value = p.rest.replace(/\s+/g,' ').trim();
  chosen = (chosen === n) ? null : n;
  run();
});
document.querySelector('form')?.addEventListener('submit', e => e.preventDefault());
window.__finder = {search, tokens, stem};
run();
})();
</script>

</body>
