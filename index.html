.", "k": "dartboard, reliability consistency, validity accuracy", "a": "Reliability is hitting the same spot every time: consistent scores. Validity is hitting the bullseye: actually predicting job performance. A riding test scored the same way by every assessor is reliable; if high scorers really have fewer accidents, it's valid.", "id": "9.54"}, {"s": 9, "q": "Which selection methods from the course would suit couriers?", "k": "selection methods comparison, which test couriers, cognitive test, personality test", "a": "A job knowledge test on traffic rules and safe app use, which has high validity and low cost, and a short practical riding check. Cognitive ability tests and long structured interviews would be too costly and not needed for this job.", "id": "9.55"}, {"s": 9, "q": "Would a physical fitness test be fair for couriers?", "k": "physical fitness test, adverse impact, fair test", "a": "A basic check that someone can ride safely is job-related, but a demanding fitness test could screen out older or female applicants without good reason, which is adverse impact. Any test must match real job demands.", "id": "9.56"}, {"s": 9, "q": "What is adverse impact?", "k": "adverse impact definition, discriminatory test", "a": "When a selection method screens out a protected group, like women, older people or minorities, at a much higher rate. It's an EEO risk, so tests must be clearly job-related.", "id": "9.57"}, {"s": 9, "q": "Would personality or integrity tests help select couriers?", "k": "personality test, integrity test couriers", "a": "They're cheap and low in adverse impact, but personality tests have low to moderate validity and applicants dislike them. For couriers, a riding check and a safety knowledge quiz predict performance better.", "id": "9.58"}, {"s": 9, "q": "How would you interview candidates for the grievance team?", "k": "interview grievance team, structured interview, panel interview", "a": "A structured panel interview, with HR and an experienced courier on the panel, using the same behavioural questions for everyone. Structured interviews have high validity and low adverse impact.", "id": "9.59"}, {"s": 9, "q": "What is the STAR method, and how would you use it?", "k": "STAR method, behavioural interview, situation task action result", "a": "Situation, Task, Action, Result: candidates describe a real past example. For a grievance-team role, we'd ask: \"Tell us about a time you resolved a dispute fairly.\" Past behaviour predicts future behaviour.", "id": "9.60"}, {"s": 9, "q": "What interview errors should KeeTa avoid when hiring?", "k": "interview errors, first impression interview, halo interview", "a": "First impressions in the first minutes, the halo effect, contrast errors between candidates, leniency or strictness, and recency. A structured scoring sheet reduces all of them.", "id": "9.61"}, {"s": 9, "q": "What does a bad hire cost KeeTa?", "k": "cost of bad hire, wrong selection cost", "a": "An unsafe courier can cause accidents, insurance claims, customer complaints and damage to KeeTa's brand. Then KeeTa pays again to recruit and onboard a replacement. Cheap selection can end up expensive.", "id": "9.62"}, {"s": 9, "q": "What interview formats did the course cover, and which fits KeeTa?", "k": "interview formats, one-on-one, sequential, panel, group, video, stress interview", "a": "One-on-one, sequential, panel, group, technology-based and stress interviews. For mass courier hiring, a short video or app-based check fits. For grievance staff, a panel interview fits best.", "id": "9.63"}, {"s": 9, "q": "Apply ratio analysis to KeeTa with a simple example.", "k": "ratio analysis example, couriers per orders", "a": "If one active courier handles about two orders an hour, and a district expects 1,000 orders at lunch, KeeTa needs about 500 active couriers then. The numbers are illustrative; the method uses KeeTa's real ratios.", "id": "9.64"}, {"s": 9, "q": "Apply trend analysis to KeeTa.", "k": "trend analysis example", "a": "Look at how courier demand has grown month by month and project it forward, for example for next year's lunch peaks. Because KeeTa's growth was very fast, the trend must be adjusted with managerial judgment.", "id": "9.65"}, {"s": 9, "q": "Apply scatter plotting to KeeTa, like the hospital beds example.", "k": "scatter plot example, beds nurses example, average line", "a": "Plot each district's daily orders against active couriers, like beds against nurses, and draw the average line. A district far above the line is short of couriers, which is where pressure, rushing and penalties will be worst.", "id": "9.66"}, {"s": 9, "q": "Why does managerial judgment matter in forecasting for KeeTa?", "k": "managerial judgment forecasting, numbers not enough", "a": "Models use the past, but typhoons, holidays, a rival leaving, new laws or a strike change demand suddenly. Managers must adjust the numbers for those events.", "id": "9.67"}, {"s": 9, "q": "How could KeeTa use a skills inventory?", "k": "skills inventory, qualifications inventory, KSA database", "a": "Record each courier's safety record, training completed, districts known and languages spoken. It helps assign couriers to districts, pick trainers and find grievance-team candidates.", "id": "9.68"}, {"s": 9, "q": "How would a replacement chart work for KeeTa's new roles?", "k": "replacement chart, ready now, needs training, succession", "a": "List roles like courier trainer and grievance officer, then map candidates by performance, outstanding to needs improvement, and readiness, ready now to questionable. It builds a pipeline from experienced couriers.", "id": "9.69"}, {"s": 9, "q": "Which surplus option would cause the least harm if KeeTa really had too many couriers?", "k": "least harmful surplus, best surplus option", "a": "Natural attrition or a hiring freeze: simply pausing new sign-ups in crowded districts. Pay per order stays the same, so existing couriers aren't punished for a surplus they didn't cause.", "id": "9.70"}, {"s": 9, "q": "What is work sharing, and could KeeTa use it?", "k": "work sharing meaning, share hours", "a": "Spreading reduced work across more people instead of cutting some completely. KeeTa could share active slots fairly in quiet hours, so everyone gets some guaranteed time rather than some getting nothing.", "id": "9.71"}, {"s": 9, "q": "Is outsourcing an option for KeeTa's shortage?", "k": "outsourcing couriers, logistics partners", "a": "KeeTa could use logistics partners at peaks, but outsourced riders still face the same app pressures. Fixing retention of its own couriers is cheaper and more reliable in the long run.", "id": "9.72"}, {"s": 9, "q": "Should KeeTa use temporary workers at peak times?", "k": "temporary workers, temps, peak staffing", "a": "Couriers are already flexible, so in effect they're on-demand workers. The problem isn't flexibility; it's unpredictable pay. Scheduling peak slots with a base fills peaks more reliably than temporary fixes.", "id": "9.73"}, {"s": 9, "q": "How does the AIDA model help KeeTa compete with Foodpanda for couriers?", "k": "AIDA competition, recruitment ad Foodpanda", "a": "A strong Attention line like \"A guaranteed base for every active hour\" directly beats a competitor's message, Interest and Desire highlight safety training and insurance, and Action makes sign-up one tap. Recruitment messaging only works if the job really offers those things.", "id": "9.74"}, {"s": 9, "q": "What is the five-step recruitment and selection process?", "k": "five steps recruitment, recruitment process steps", "a": "Personnel planning and forecasting, building a candidate pool, applications and initial screening, selection tools, then the offer decision. KeeTa does steps two, three and five quickly but has a weak step four, with no riding or safety test.", "id": "9.75"}, {"s": 9, "q": "Why does compensation matter so much for recruitment?", "k": "compensation priority, 40 percent candidates, pay attracts", "a": "The course notes that around 40% of candidates rank pay and benefits as their top priority. For couriers, pay is the main reason to choose one app over another, which is why KeeTa's cuts pushed couriers away.", "id": "9.76"}, {"s": 9, "q": "How has compensation changed from administrative payroll to a strategic function?", "k": "strategic compensation, payroll vs strategy", "a": "Pay used to mean simply paying people for turning up. Now it's used to attract, motivate and retain the right people. KeeTa treats courier pay as a cost to cut, the old view, and our hybrid floor treats it strategically.", "id": "9.77"}, {"s": 9, "q": "Do salary ranges or expected salary apply to couriers?", "k": "salary range, expected salary, salary band", "a": "Not in the usual way, because couriers aren't hired into salary bands. But the idea still applies: the base rate could have a range, for example higher for couriers with a strong safety record or senior courier status.", "id": "9.78"}, {"s": 9, "q": "Should KeeTa's pay system reflect its strategy?", "k": "pay and strategy alignment, reward strategy", "a": "Yes. The course says rewards should match strategy. If KeeTa's strategy is reliable, safe service, pay should reward safe and reliable couriers, not just speed or accepting lower fees.", "id": "9.79"}, {"s": 9, "q": "What happens when a company underpays?", "k": "underpaying consequences, below market pay effects", "a": "The course warns it causes dissatisfaction, low morale and higher turnover, which then costs more in recruiting and onboarding. KeeTa's May 2025 cuts led to exactly that, plus a strike.", "id": "9.80"}, {"s": 9, "q": "What non-monetary benefits could KeeTa offer, like the Cathay Pacific flight discount example?", "k": "non-monetary benefits, Cathay example, staff discount", "a": "Cathay's staff flight discount attracts travel lovers. KeeTa could offer an equivalent that fits couriers: discounted meals through the KeeTa app, free phone data, rain gear, or discounted scooter servicing. Cheap for KeeTa, valuable to couriers.", "id": "9.81"}, {"s": 9, "q": "Could KeeTa offer something like the wellbeing days from class?", "k": "wellbeing days, family day, sports day", "a": "Couriers aren't paid days off as contractors, but KeeTa could hold a paid courier appreciation day or safety day with a small attendance payment, meals and health checks. It builds loyalty and connects to safety training.", "id": "9.82"}, {"s": 9, "q": "How do flexible schedules count as a benefit?", "k": "flexible work benefit, flexibility as reward", "a": "Flexibility is valuable, especially for younger workers, and it's KeeTa's strongest selling point. That's the one QWL factor KeeTa meets, and our recommendations keep it.", "id": "9.83"}, {"s": 9, "q": "What statutory entitlements does the Employment Ordinance give employees?", "k": "statutory entitlements, rest days, sickness allowance, severance, long service payment, annual leave", "a": "Rest days, statutory holidays, paid annual leave, sickness allowance, maternity and paternity leave, and severance or long service payments, plus the statutory minimum wage under a related ordinance. Couriers as contractors get none of these from KeeTa.", "id": "9.84"}, {"s": 9, "q": "What does superannuation mean in the course?", "k": "superannuation, retirement scheme", "a": "Retirement savings schemes. In Hong Kong that's mainly the MPF. Couriers must arrange their own as self-employed people, with no employer contribution.", "id": "9.85"}, {"s": 9, "q": "How does EEO apply to pay at KeeTa?", "k": "EEO pay, equal pay, fair access benefits", "a": "EEO means fair access to pay and benefits without discrimination. KeeTa's pay is by order, so it doesn't differ by background, but K GO creates different pay for the same work, which is an equity problem.", "id": "9.86"}, {"s": 9, "q": "How could KeeTa reward innovation or extra effort, as the course suggests aligning pay with strategy?", "k": "reward innovation, incentive for ideas", "a": "A small reward for couriers who report useful safety or building information that improves routes or times. It turns their tacit knowledge into explicit knowledge and rewards what KeeTa wants.", "id": "9.87"}, {"s": 9, "q": "Is the hybrid pay floor salaried pay or piece-rate pay?", "k": "hybrid classification, salary or piece rate", "a": "Both. The hourly base works like salaried pay and gives security, and the per-order commission is piece-rate and keeps productivity. That's why we call it hybrid.", "id": "9.88"}, {"s": 9, "q": "Why is pure piece-rate described as shifting risk onto workers?", "k": "risk shifting, piece rate risk", "a": "Under pure piece-rate, the company pays only for completed orders. Quiet hours, waiting at restaurants and bad weather all cost the courier, not KeeTa. The base layer shares some of that risk back.", "id": "9.89"}, {"s": 9, "q": "What is the main point of slide 9?", "k": "summarise slide 9, compensation concepts point", "a": "Course concepts show why pay failed: KeeTa uses only one compensation layer, chose pay reduction without a surplus, and breaches QWL fair pay. Its strengths are fee transparency and flexible hours.", "id": "9.90"}, {"s": 9, "q": "What is the psychological contract, and how did KeeTa break it?", "k": "psychological contract, broken promise, unwritten expectations", "a": "It's beyond our course list, but it means the unwritten expectations between workers and an organisation. Couriers expected stable fees and fair priority. Cutting pay and introducing K GO without consultation broke that, which explains the anger behind the strike.", "id": "9.91"}, {"s": 9, "q": "How does expectancy theory apply?", "k": "expectancy theory, Vroom, effort reward link", "a": "Beyond our course list, but in short: people work hard when effort leads to performance, and performance leads to rewards they value. At KeeTa, delays outside couriers' control break the effort-performance link, and falling fees weaken the reward link, so motivation drops.", "id": "9.92"}, {"s": 9, "q": "What is employer branding, and how does KeeTa's affect recruitment?", "k": "employer brand, reputation as employer", "a": "How a company is seen as a place to work. Strikes and safety concerns damage KeeTa's courier brand, making recruitment harder. Fair pay and safety improvements rebuild it.", "id": "9.93"}, {"s": 9, "q": "How often should KeeTa review courier pay rates?", "k": "review pay rates, how often update rates", "a": "At least once a year, and before any change, with courier consultation and market comparison. Sudden changes without notice caused the 2025 strike.", "id": "9.94"}, {"id": "10.1", "s": 10, "q": "Where does the 10-minute figure come from? Is it true for every order?", "a": "It comes from couriers' accounts reported in 2025: designated times on some tasks were cut from 20 minutes to 10. It's not every order, which is why the slide says \"riders' accounts\". It still shows which way the pressure is going.", "k": "10 minutes, 20 minutes, delivery time cut, time pressure source"}, {"id": "10.2", "s": 10, "q": "Why are pop-ups so dangerous compared with other app features?", "a": "They need a fast tap, and the reward goes to whoever taps first. That turns every ride into a race against other couriers, with eyes on the screen instead of the road.", "k": "pop-ups danger, order grabbing"}, {"id": "10.3", "s": 10, "q": "What evidence is there that this causes accidents?", "a": "Couriers told the media the order-grabbing pop-ups had caused accidents. Research backs the mechanism: Chen (2023) found job stress leads to distraction and risky riding, and Christie and Ward (2023) found the business model affects rider safety. We don't have KeeTa's own accident data, so we don't quote an accident rate.", "k": "accident evidence, proof accidents"}, {"id": "10.4", "s": 10, "q": "Isn't using a phone while riding the courier's own fault?", "a": "Individuals are responsible, but the system rewards the risky behaviour. With first-come, first-served orders, a courier who waits until he's parked loses the order. HRM looks at how the job is designed, not only at individual behaviour.", "k": "courier fault, personal responsibility, blame courier"}, {"id": "10.5", "s": 10, "q": "What are the customer coupons, and why do they matter?", "a": "KeeTa offers customers coupons when an order is late. That's good for customers, but the cost of lateness then falls on couriers through deductions. So a customer promise becomes time pressure on the road.", "k": "coupons, late order coupons, customer compensation"}, {"id": "10.6", "s": 10, "q": "Does KeeTa stop deliveries during typhoons?", "a": "We didn't find a public KeeTa policy on this, so we don't claim one either way. Our point is that demand and pay are often highest in bad weather, which pulls couriers onto dangerous roads.", "k": "typhoon policy, bad weather policy"}, {"id": "10.7", "s": 10, "q": "What are the health effects beyond accidents?", "a": "Fatigue from long hours, chronic stress from constant time pressure, and exposure to heat and rain. These build up over time and lower Quality of Work Life even without a crash.", "k": "health effects, fatigue, stress, long-term health"}, {"id": "10.8", "s": 10, "q": "Is mental health part of OSH here?", "a": "Yes. Constant time pressure and unexplained penalties cause chronic stress. QWL includes wellbeing, and the grievance team reduces that stress by making penalties fair.", "k": "mental health, stress, wellbeing"}, {"id": "10.9", "s": 10, "q": "Who is legally responsible for couriers' safety?", "a": "For employees, employers have clear legal duties for safety and work-injury compensation. Contractors sit in a grey zone. That gap is exactly why the government plans work-injury protection for delivery platform workers.", "k": "legal responsibility safety, who is responsible"}, {"s": 10, "q": "What does \"designated delivery time\" mean?", "k": "delivery time limit, deadline, time per order", "a": "The time the app gives a courier to complete a task. Riders report it was cut from 20 to 10 minutes on some tasks, so they have less time for the same work.", "id": "10.10"}, {"s": 10, "q": "Why would couriers ride in typhoons?", "k": "bad weather riding, rainstorms, why work in typhoon", "a": "Because demand, and often pay, is highest when people don't want to go out. With no base pay, skipping those hours costs couriers income, so the pay design pulls them onto dangerous roads.", "id": "10.11"}, {"s": 10, "q": "How common are courier accidents in Hong Kong?", "k": "accident statistics, number of accidents, injury rate", "a": "We didn't find reliable public figures for KeeTa couriers, so we don't quote one. We rely on couriers' reports and on research showing how time pressure leads to risky riding.", "id": "10.12"}, {"s": 10, "q": "Does KeeTa provide safety equipment?", "k": "safety gear, helmets, equipment, PPE", "a": "We didn't find evidence that KeeTa provides safety equipment, so we don't claim it does or doesn't. Couriers generally supply their own scooters, phones and gear.", "id": "10.13"}, {"s": 10, "q": "What about heat stress in summer?", "k": "heat, hot weather, heatstroke, summer", "a": "Long hours outdoors in Hong Kong's summer bring a risk of heat stress. The Labour Department's heat-stress guidance mainly targets employers, so contractors fall into a grey area. Rest points with water, one of our suggested perks, would help.", "id": "10.14"}, {"s": 10, "q": "Who else is affected by couriers' risky riding?", "k": "public safety, pedestrians, other road users", "a": "Pedestrians and other road users. Riding on pavements and running lights puts the public at risk too, which is why safety is also a social responsibility issue for KeeTa.", "id": "10.15"}, {"s": 10, "q": "What is the link between penalties and dangerous riding?", "k": "penalty pressure, deductions cause speeding", "a": "If lateness means a deduction, couriers try to avoid being late at any cost. That pushes speeding, riding on pavements and running lights. The penalty system creates the hazard.", "id": "10.16"}, {"s": 10, "q": "What does \"fatigue, chronic stress, collision risk\" on the slide mean?", "k": "outcome hazards, fatigue, chronic stress, collision", "a": "It's what the four hazards add up to. Long hours cause fatigue, constant time pressure causes chronic stress, and both raise the chance of a crash.", "id": "10.17"}, {"s": 10, "q": "Isn't riding a scooter just a risky job anyway?", "k": "inherent risk, job is dangerous anyway, unavoidable risk", "a": "Some risk is part of the job, but good HRM reduces it. The risks we highlight, like tapping phones while moving and racing against short deadlines, are created by how dispatch is designed, so they can be designed out.", "id": "10.18"}, {"s": 10, "q": "Why is OSH considered a core HR function, not just a legal requirement?", "k": "OSH core HR function, strategic OSH, safety strategy", "a": "Because safe, healthy workers are more productive and more likely to stay. Injuries and burnout raise absenteeism, turnover and costs. At KeeTa, accidents also mean claims, lost delivery capacity and reputational damage.", "id": "10.19"}, {"s": 10, "q": "Who is responsible for monitoring couriers' stress?", "k": "line manager stress, monitor stress, responsibility for wellbeing", "a": "The course says line managers are responsible for workers' health and stress. At KeeTa the line manager is the algorithm, which can't notice stress. So KeeTa needs human checks, like the grievance team and courier surveys, to cover that duty.", "id": "10.20"}, {"s": 10, "q": "How does unsafe work affect retention and productivity at KeeTa?", "k": "safety retention, absenteeism, burnout, turnover safety", "a": "Injured or burnt-out couriers stop working or leave. That shrinks the fleet at peak hours and raises recruiting costs. Safer work protects capacity, which is the course's link between OSH and business performance.", "id": "10.21"}, {"s": 10, "q": "Is psychological stress an OSH issue for couriers?", "k": "psychological stress, mental stress, psychological wellbeing", "a": "Yes. The course says job design must consider stress and workload, not just physical hazards. Couriers face constant time pressure, unexplained penalties and income worry, which all cause stress.", "id": "10.22"}, {"s": 10, "q": "What physical demands should a courier job specification mention?", "k": "physical demands, JS safety standards, health requirements", "a": "Riding for long periods, carrying orders up stairs when lifts fail, working outdoors in heat and rain, and staying alert in traffic. Listing them helps select people who can do the job safely, like the AED requirement for lifeguards.", "id": "10.23"}, {"s": 10, "q": "The course used couriers as an example of hazardous working conditions. What were they?", "k": "class example couriers, courier hazards course", "a": "Navigating live traffic, tight delivery deadlines and severe weather like typhoons and rainstorms. Our slide 10 hazards match those, plus order-grabbing pop-ups and penalty pressure, which come from KeeTa's app.", "id": "10.24"}, {"s": 10, "q": "What is the difference between proactive and reactive safety, using KeeTa's insurance?", "k": "proactive reactive table, insurance reactive example", "a": "Reactive safety deals with consequences after an accident, like KeeTa's HK$1 million insurance. Proactive safety prevents accidents through hazard assessment, realistic workloads and training. The course table uses KeeTa's insurance as the reactive example, and our recommendation two is the proactive side.", "id": "10.25"}, {"s": 10, "q": "What is the main point of slide 10?", "k": "summarise slide 10, hazards point", "a": "KeeTa's dispatch design creates hazards: shortened delivery times, order-grabbing pop-ups, penalty pressure and riding in bad weather, leading to fatigue, stress and collision risk.", "id": "10.26"}, {"s": 10, "q": "What is the job demands-resources idea, and does it fit couriers?", "k": "job demands resources, JD-R, burnout model", "a": "Beyond our course list, but it says burnout happens when job demands are high and resources, like support, control and recovery time, are low. Couriers face high demands with few resources, which matches the fatigue and stress on slide 10.", "id": "10.27"}, {"s": 10, "q": "What if a courier is injured during the pilot?", "k": "injury during pilot, accident in pilot", "a": "The existing HK$1 million insurance still applies, and the grievance team would review the case. The pilot's purpose is to reduce such incidents, so every incident is tracked and investigated.", "id": "10.28"}, {"id": "11.1", "s": 11, "q": "How would you apply the six-step job analysis process to couriers?", "a": "1. Purpose: identify safety risks.\n2. Background information: strike reports and accident studies.\n3. Representative position: a scooter courier in a busy district like Tsuen Wan.\n4. Collect data: ride-alongs, app logs and insurance claims.\n5. Verify with couriers.\n6. Produce a job description and job specification that list the hazards and required skills.", "k": "job analysis steps, six step, how to do job analysis"}, {"id": "11.2", "s": 11, "q": "Apply workflow analysis to a delivery.", "a": "Inputs: orders, couriers, scooters and the app. Process: dispatch, pick-up, ride, drop-off. Output: an on-time meal and a satisfied customer. The analysis shows the bottleneck is often restaurant prep time, not the courier.", "k": "workflow, input process output"}, {"id": "11.3", "s": 11, "q": "What's the difference between a job description and a job specification for a courier?", "a": "The job description says what the job involves: picking up, riding, delivering and using the app. The job specification says what the person needs: a valid licence, riding skills, district knowledge and physical stamina.", "k": "JD vs JS, job description, job specification"}, {"id": "11.4", "s": 11, "q": "What KSAOs does a courier need?", "a": "Knowledge of traffic rules and local districts. Skills in defensive riding, navigation and app use. Abilities like stamina and good judgment in bad weather. Other characteristics like a clean licence record and a customer-service attitude.", "k": "KSAO, skills needed, competencies"}, {"id": "11.5", "s": 11, "q": "What would a riding SOP actually say?", "a": "Phone mounted, never tapped while moving. Stop before accepting an order. Rules for heavy rain and typhoon signals. What to do after an accident, and how to report it.", "k": "riding SOP content, what SOP says"}, {"id": "11.6", "s": 11, "q": "How would you identify and control courier hazards?", "a": "List each task, find the hazards, and rate how likely and serious each is. Then control them: remove the hazard first, then redesign the process, then train, then protective gear. The Safe-Riding UI removes the hazard of tapping while moving. That's the strongest kind of control.", "k": "hazard control, risk assessment, manage hazards"}, {"id": "11.7", "s": 11, "q": "What's the difference between reactive and proactive OSH?", "a": "Reactive means responding after accidents, like insurance. Proactive means preventing them, through job analysis, SOPs, training and safer design. KeeTa is mostly reactive. Recommendation 2 makes it proactive.", "k": "reactive vs proactive, prevention"}, {"id": "11.8", "s": 11, "q": "Explain the three levels of training needs analysis for KeeTa.", "a": "Organisation: accident and insurance data show which districts and times are riskiest. Task: the job needs defensive riding, safe app use and bad-weather riding. Person: new couriers and those with past incidents get trained first.", "k": "training needs analysis, TNA, three levels"}, {"id": "11.9", "s": 11, "q": "How would you use the five-step training process, ADDIE, for the riding course?", "a": "1. Needs analysis, as above.\n2. Objectives, for example, no phone use while moving.\n3. Materials: short videos and quizzes in the languages couriers use.\n4. Delivery: in-app modules plus one practical session at onboarding.\n5. Evaluation: compare incident rates before and after.", "k": "ADDIE, training process, design training"}, {"id": "11.10", "s": 11, "q": "Is your recommendation training or development?", "a": "The riding course is training: short-term and job-specific. Development would be a career path, like senior courier, trainer or hub coordinator. We'd add that as a next step to fix the growth factor.", "k": "training or development, recommendation type"}, {"id": "11.11", "s": 11, "q": "Is the courier role training or development focused?", "a": "Right now, neither. KeeTa provides almost no training and no development path. Our riding course adds training, and a career path would add development.", "k": "training focus, development focus"}, {"id": "11.12", "s": 11, "q": "How do the principles of learning apply to courier training?", "a": "Make it meaningful with real Hong Kong road scenarios. Add practice, like handling a simulated pop-up safely. Give immediate feedback in the app. And support transfer with reminders during real rides.", "k": "learning principles, practice feedback transfer"}, {"id": "11.13", "s": 11, "q": "How do explicit and tacit knowledge apply here?", "a": "Experienced couriers have tacit knowledge: safe pick-up spots, which buildings' lifts break, and which roads flood. KeeTa could capture that into explicit knowledge, like SOPs, maps and tips, through peer mentoring and grievance data.", "k": "tacit knowledge, explicit knowledge, knowledge management"}, {"id": "11.14", "s": 11, "q": "What does KeeTa's onboarding look like now, and what would you change?", "a": "It's mainly app sign-up and document checks; we didn't find any safety orientation. We'd add a short onboarding session with the riding SOP, a welcome pack and insurance information.", "k": "onboarding, orientation, induction"}, {"id": "11.15", "s": 11, "q": "What's the difference between the security principle and the health and safety factor?", "a": "Security is one of QWL's four broad principles, covering physical and economic security. Health and safety is one of the eight operational factors under it. KeeTa fails both.", "k": "security principle vs safety factor"}, {"id": "11.16", "s": 11, "q": "What do you mean by \"the algorithm acts as a line manager\"?", "a": "It does what a supervisor does: assigns work, sets deadlines and enforces rules. Parent-Rocheleau and Parker (2022) call algorithms \"work designers\". But unlike a manager, it can't see that a rider is exhausted or a road is flooded.", "k": "line manager algorithm, algorithm as manager"}, {"id": "11.17", "s": 11, "q": "Isn't HK$1 million insurance a safety measure?", "a": "It's protection, not prevention. It helps after an accident. Good OSH management stops the accident happening in the first place.", "k": "insurance as safety, insurance prevention"}, {"id": "11.18", "s": 11, "q": "Which Hong Kong laws cover workplace safety, and do they apply?", "a": "The Occupational Safety and Health Ordinance (Cap. 509) and the Employees' Compensation Ordinance (Cap. 282) protect employees. Contractors are mostly outside them. That's the gap the 2026 work-injury proposals aim to close.", "k": "safety laws, OSHO, Cap 509, Cap 282"}, {"s": 11, "q": "What is an SOP?", "k": "standard operating procedure, define SOP, what is SOP, SOP meaning", "a": "A standard operating procedure: a written, step-by-step way to do a task safely and consistently. For couriers, a riding SOP would cover phone use, defensive riding, bad weather and what to do after an accident.", "id": "11.19"}, {"s": 11, "q": "What is hazard identification?", "k": "hazard assessment, risk assessment, identify hazards", "a": "Finding what in a job could cause harm, then rating how likely and serious each risk is. For couriers: phone use while riding, time pressure, traffic, weather and fatigue.", "id": "11.20"}, {"s": 11, "q": "How would you evaluate whether the safety training works?", "k": "training evaluation, measure training, Kirkpatrick, training results", "a": "Compare incident and insurance-claim rates before and after training in the pilot district, plus a short quiz for learning. Beyond our course, Kirkpatrick's four levels, reaction, learning, behaviour and results, fit this well.", "id": "11.21"}, {"s": 11, "q": "Who should carry out the job analysis for couriers?", "k": "who does job analysis, HR and engineers", "a": "KeeTa's HR or safety staff, working with experienced couriers and the app engineers, because the app shapes the job. Couriers know the real hazards; engineers know what the app can change.", "id": "11.22"}, {"s": 11, "q": "What does OSH cover?", "k": "occupational safety and health meaning, what is OSH", "a": "Keeping workers safe from injury and protecting their physical and mental health at work. For couriers that means road safety, fatigue, weather exposure and stress.", "id": "11.23"}, {"s": 11, "q": "What is a line manager?", "k": "line manager meaning, supervisor role", "a": "The person directly responsible for a worker day to day: assigning tasks, checking work and supporting them. At KeeTa, the algorithm plays this role but can't notice when someone is tired or in danger.", "id": "11.24"}, {"s": 11, "q": "Why do you say KeeTa doesn't do job analysis?", "k": "no job analysis evidence, how do you know no job analysis", "a": "We found no published job description, hazard analysis, riding SOP or safety training for couriers. If KeeTa had analysed the job's hazards, those outputs would normally exist. We present it as \"not found\", not as an inside fact.", "id": "11.25"}, {"s": 11, "q": "What would a preventive wellness programme look like for couriers?", "k": "wellness, preventive health, rest points, mental health support", "a": "Rest points with water, toilets and phone charging, heat and weather alerts, limits on continuous riding hours, and access to support after accidents. These are cheap compared with the cost of injuries.", "id": "11.26"}, {"s": 11, "q": "What does safe app use mean?", "k": "safe app use, phone safety", "a": "Only interacting with the app when stopped, with the phone mounted. Our Safe-Riding interface makes this the default by pausing pop-ups while the courier is moving.", "id": "11.27"}, {"s": 11, "q": "Why should new couriers be trained first?", "k": "person level training, new couriers first", "a": "New couriers have the least experience of Hong Kong roads and the app's pressure, so they carry the highest risk. That's the person level of the training needs analysis.", "id": "11.28"}, {"s": 11, "q": "Why is insurance listed as a strength if it doesn't prevent accidents?", "k": "insurance strength, why strength", "a": "It does protect couriers financially after an injury, which matters a lot, and KeeTa improved it in April 2025. We credit that. Our point is only that it's reactive, so it should come with prevention.", "id": "11.29"}, {"s": 11, "q": "What is the hierarchy of controls?", "k": "hierarchy of controls, hazard control order, eliminate hazard", "a": "The order for controlling hazards: remove the hazard, replace it with something safer, redesign the work, train and set rules, then protective equipment. Our Safe-Riding UI removes the hazard, which is stronger than training alone.", "id": "11.30"}, {"s": 11, "q": "Is the HK$1 million insurance enough?", "k": "insurance enough, insurance amount", "a": "It's a real improvement, but insurance only pays after an injury and doesn't replace income security or prevention. We'd keep it and add prevention through recommendation two.", "id": "11.31"}, {"s": 11, "q": "Why should job analysis be an ongoing process rather than a one-time task?", "k": "job analysis ongoing, dynamic jobs, update job analysis, one-time job analysis", "a": "Jobs change with technology and strategy. The courier job changed a lot when KeeTa shortened delivery times and added order-grabbing pop-ups, but nobody re-analysed its hazards. Ongoing job analysis would have caught those new risks.", "id": "11.32"}, {"s": 11, "q": "How has the courier job changed over time, like the front desk agent example from class?", "k": "front desk example, job evolution, how courier job changed, technology changed job", "a": "Delivery used to mean simply collecting and delivering. Now the job also includes app use while moving, GPS tracking, fast pop-up decisions and ratings. Like the front desk agent who now manages digital systems, the job grew, but KeeTa's job analysis and training didn't keep up.", "id": "11.33"}, {"s": 11, "q": "How does job analysis link to productivity and profit at KeeTa?", "k": "productivity profitability chain, job analysis profit, business value job analysis", "a": "The course chain is good job analysis and design, then better quality and productivity, then more revenue. At KeeTa, a well-designed courier job means fewer accidents, fewer late orders and lower turnover, which protects service and profit.", "id": "11.34"}, {"s": 11, "q": "What are the four components of job analysis, applied to a KeeTa courier?", "k": "four components, job tasks, working conditions, performance criteria, components of job analysis", "a": "Tasks: pick up, ride, deliver, use the app. KSAOs: traffic knowledge, riding skill, stamina, customer attitude. Working conditions: outdoors, live traffic, typhoons, heat, time pressure. Performance criteria: on-time rate, safety record, customer rating. KeeTa only defines the last one, through the algorithm.", "id": "11.35"}, {"s": 11, "q": "What are the working conditions of a courier job?", "k": "working conditions courier, job context, environment", "a": "Outdoor work in live traffic, all weather including typhoons and heat, long or irregular hours, tight time limits, tall estates with lifts, and constant app use. Those conditions are exactly where the hazards come from.", "id": "11.36"}, {"s": 11, "q": "What performance criteria does KeeTa use, and are they the right ones?", "k": "performance criteria, KPIs KeeTa, success measures", "a": "Speed and punctuality, tracked by GPS. They're measurable, but they leave out safety and context. Better criteria would add safe riding, customer service and on-time rate after removing delays the courier didn't cause.", "id": "11.37"}, {"s": 11, "q": "Which job analysis data collection method would you use for couriers?", "k": "data collection methods, interview observation questionnaire diary, how collect job data", "a": "A mix. Ride-along observation to see real hazards, short interviews with experienced couriers, a questionnaire to reach many couriers cheaply, and app data as an objective log. The course recommends combining interviews and observation for accuracy.", "id": "11.38"}, {"s": 11, "q": "What are the pros and cons of interviewing couriers for job analysis?", "k": "interview method job analysis, pros cons interview", "a": "Interviews are quick and pick up details like which estates have unreliable lifts. But they're not standardised and are open to interpretive distortion, so we'd check them against observation and app data.", "id": "11.39"}, {"s": 11, "q": "Would observation work for analysing the courier job?", "k": "observation method, ride-along, observe couriers", "a": "Yes, because the job is mostly physical and visible: riding, waiting, climbing stairs, using the phone. Observation captures what couriers really do without relying on their own description. It's weaker for invisible parts like stress.", "id": "11.40"}, {"s": 11, "q": "Would a questionnaire work for courier job analysis?", "k": "questionnaire method, survey couriers, PAQ", "a": "Yes, for reaching thousands of couriers cheaply and comparing districts. Questions could cover hazards, waiting times and app pressure. The weakness is that fixed questions can miss unusual problems, so we'd pilot it first.", "id": "11.41"}, {"s": 11, "q": "Could couriers keep a diary or log for job analysis?", "k": "diary method, participant log, work log", "a": "KeeTa already has an automatic log: GPS and app data show every task and its timing. A short self-reported diary could add what the app can't see, like near-misses or lift breakdowns, though self-reports can be selective.", "id": "11.42"}, {"s": 11, "q": "What is the Position Analysis Questionnaire, and would it suit couriers?", "k": "PAQ, position analysis questionnaire", "a": "A highly structured questionnaire that scores jobs on standard categories of tasks and demands. It could compare the courier job with similar jobs to support job evaluation and a fair base rate, but it's less useful for spotting KeeTa-specific hazards.", "id": "11.43"}, {"s": 11, "q": "What is interpretive distortion, and how could it affect courier job analysis?", "k": "interpretive distortion, interview bias", "a": "When people describe the same activity differently. A courier might call waiting at a restaurant \"resting\", while an analyst sees it as unpaid working time. Checking interviews against GPS data reduces that distortion.", "id": "11.44"}, {"s": 11, "q": "Write a short job description for a KeeTa courier.", "k": "example job description, JD courier, five elements JD", "a": "Job title: Delivery Courier. Summary: collects and delivers orders safely and on time across a district. Duties: accept orders when stopped, collect, ride safely, deliver, report incidents. Working conditions: outdoors, all weather, own scooter, shift choice. Performance standards: on-time within the buffered time, zero phone use while moving, customer rating.", "id": "11.45"}, {"s": 11, "q": "Write a short job specification for a KeeTa courier.", "k": "example job specification, JS courier, six components JS, job specification for courier, courier JS", "a": "Education: none required. Certification: valid licence for the vehicle. Training: KeeTa riding-safety module. Experience: none, but riding experience preferred. Skills: navigation, app use, basic English or Cantonese for customers. Physical: able to ride for long periods and climb stairs.", "id": "11.46"}, {"s": 11, "q": "How does job analysis connect to all the other HR functions at KeeTa?", "k": "job analysis foundation, link to HR functions, why job analysis matters", "a": "It's the base for everything we discuss. It sets selection criteria for recruiting, finds skill gaps for training, sets fair criteria for performance, supports job evaluation for the pay floor, identifies hazards for SOPs, and keeps decisions job-related for EEO. KeeTa skipped it, so every function inherits the gap.", "id": "11.47"}, {"s": 11, "q": "What is job design, and how is it different from job analysis?", "k": "job design definition, job design vs job analysis", "a": "Job analysis studies what a job is and needs; job design decides how the job should be built. At KeeTa the app designs the job. Our Safe-Riding interface and ETA buffer are job design changes based on what job analysis would find.", "id": "11.48"}, {"s": 11, "q": "What were Google's eight managerial behaviours, and how do they relate to KeeTa?", "k": "Google eight behaviours, Project Oxygen behaviours, good manager behaviours", "a": "They include being a good coach, empowering the team, showing concern for wellbeing, being results-oriented, communicating well and supporting careers. KeeTa's algorithm only does the results part. Our grievance team and career path add the coaching, communication, wellbeing and career parts.", "id": "11.49"}, {"s": 11, "q": "How did Google use job analysis, and what could KeeTa copy?", "k": "Google case lesson, Google redesign selection training", "a": "Google analysed performance data and feedback to find what good managers do, then changed selection, training and 360-degree feedback around it. KeeTa could analyse its safest, most reliable couriers the same way and build training and recognition around those behaviours.", "id": "11.50"}, {"s": 11, "q": "The course says modern job analysis is less prescriptive and focuses on performance criteria. Does KeeTa fit that?", "k": "less prescriptive, outcome based, performance criteria focus", "a": "Partly. KeeTa focuses on outcomes, like delivery time, and lets couriers choose hours. But its time limits are rigid and ignore context, so it's outcome-focused without being fair. Good outcome measures need realistic targets and review.", "id": "11.51"}, {"s": 11, "q": "Who should verify the findings of a courier job analysis?", "k": "verify findings, step five, check with incumbent", "a": "Experienced couriers, the job incumbents, plus KeeTa's operations managers. That catches mistakes and builds courier trust in the result.", "id": "11.52"}, {"s": 11, "q": "What would be the purpose, step one, of a KeeTa courier job analysis?", "k": "step one purpose, define purpose job analysis", "a": "To identify safety risks and the skills needed, so KeeTa can write a riding SOP, design training and set a fair base rate. Defining the purpose first decides what data to collect.", "id": "11.53"}, {"s": 11, "q": "What background information would KeeTa gather in step two?", "k": "background information, step two", "a": "Strike reports, insurance claim records, existing app rules, customer complaint data and research on courier safety, like Chen (2023). It shows where the problems are before collecting new data.", "id": "11.54"}, {"s": 11, "q": "Which position would be representative in step three?", "k": "representative position, step three", "a": "A full-time scooter courier in a busy district such as Tsuen Wan, where pressure and complaints are highest. Large job families like couriers need a representative sample rather than everyone.", "id": "11.55"}, {"s": 11, "q": "Why does learning and development matter for a platform like KeeTa?", "k": "L&D, HRD, learning and development strategy", "a": "Trained couriers are safer, faster and more likely to stay. The course says organisations should develop and retain people, not just keep hiring. For KeeTa, training cuts accidents and recruiting costs.", "id": "11.56"}, {"s": 11, "q": "What is the war for talent, and does it apply to couriers?", "k": "war for talent, talent shortage, retention focus", "a": "It means competing hard to attract and keep good workers when labour is tight. KeeTa competes with Foodpanda for reliable couriers, so retaining trained ones through fair pay and development is cheaper than constantly replacing them.", "id": "11.57"}, {"s": 11, "q": "What makes employees stay besides pay, and how does KeeTa do on those?", "k": "retention drivers, why employees stay, autonomy career path", "a": "The course lists a healthy work environment, challenging tasks, autonomy and career paths. KeeTa offers flexibility, but little autonomy, no career path and a stressful environment. Our recommendations improve the environment and a development path would add the rest.", "id": "11.58"}, {"s": 11, "q": "What is a training gap, and is risky riding a training gap?", "k": "training gap, skill gap, not all problems are training", "a": "A training gap is the difference between required and actual performance caused by missing skills. Risky riding is only partly a skill gap. Much of it comes from time pressure and pop-ups, so training alone won't fix it. That's why recommendation two changes the app as well as training couriers.", "id": "11.59"}, {"s": 11, "q": "Not all performance problems are training problems. How does that apply to KeeTa?", "k": "motivation not training, lack of tools, unclear expectations", "a": "Late deliveries often come from slow kitchens, broken lifts or unrealistic times, not lack of skill. Unclear rules and low pay hurt motivation. So KeeTa needs better job design, clear expectations and fair pay, with training as only one part.", "id": "11.60"}, {"s": 11, "q": "Give learning objectives for the riding-safety course.", "k": "learning objectives, instructional design, step two ADDIE", "a": "By the end, a courier can: mount the phone and accept orders only when stopped; name three defensive riding habits; state what to do under a typhoon signal or rainstorm warning; and report an accident through the app. Each one can be tested.", "id": "11.61"}, {"s": 11, "q": "What training materials would you develop?", "k": "training materials, develop materials, step three ADDIE", "a": "Short videos of real Hong Kong road situations, a one-page SOP card, a quiz, and a simulated pop-up exercise in the app. They should be available in the languages couriers use.", "id": "11.62"}, {"s": 11, "q": "What on-the-job training methods would suit couriers?", "k": "on the job training, OJT, job instruction training", "a": "Job shadowing with an experienced courier for a few deliveries, coaching from a senior courier, and job instruction training on safe app use at a pick-up point. It's practical and transfers straight to the job.", "id": "11.63"}, {"s": 11, "q": "Would mentoring work for KeeTa couriers?", "k": "mentoring, coaching, buddy system", "a": "Yes. Pairing new couriers with experienced senior couriers for their first weeks passes on tacit knowledge like safe routes and tricky buildings. It also creates the senior courier role that improves the growth factor.", "id": "11.64"}, {"s": 11, "q": "What is job shadowing, and how would it help new couriers?", "k": "job shadowing meaning", "a": "Watching an experienced worker do the job. A new courier could ride along or follow an experienced one for a few orders to learn routes, pick-up habits and how to handle the app safely.", "id": "11.65"}, {"s": 11, "q": "What is social learning, and could couriers use it?", "k": "social learning, community learning, courier groups", "a": "Learning from peers through shared spaces and discussion. Couriers often share tips informally. KeeTa could support an official courier forum where safety tips and building information are shared and turned into SOP updates.", "id": "11.66"}, {"s": 11, "q": "Which off-the-job training methods would you use?", "k": "off the job training, simulation, role play, lecture, case study", "a": "A short online module and quiz, plus a simulation of the pop-up situation, like the flight attendant emergency simulations in class. Long lectures don't suit flexible couriers, so modules should be short and mobile.", "id": "11.67"}, {"s": 11, "q": "Could simulation or role play help courier training?", "k": "simulation training, role play couriers", "a": "Yes. A simulated pop-up while \"riding\" teaches the safe response without real danger. Role plays help with difficult customer situations, like a complaint about late food that wasn't the courier's fault.", "id": "11.68"}, {"s": 11, "q": "Should couriers get a professional certification?", "k": "certification, vocational training, professional credential", "a": "A KeeTa riding-safety certificate after the module would work, and it could count towards a senior courier badge. External certificates, like first aid, could be an optional development step.", "id": "11.69"}, {"s": 11, "q": "What does \"meaningful material\" mean in training design?", "k": "meaningful material, big picture, familiar examples, simple terms", "a": "Give the big picture first, use familiar examples, simple words and visuals. For couriers: start with why phone use while moving causes crashes, use real Hong Kong street videos, and avoid jargon.", "id": "11.70"}, {"s": 11, "q": "Why does personal relevance matter in courier training?", "k": "personal relevance, motivation to learn", "a": "Adults learn when they see how it helps them. Show couriers that safe habits protect their income and health, for example fewer accidents means fewer days unable to earn.", "id": "11.71"}, {"s": 11, "q": "What is transfer of learning, and how would you check it?", "k": "transfer of learning, apply on the job", "a": "Whether people actually use what they learned on the job. KeeTa can check it with app data: fewer interactions while moving and fewer incidents after training.", "id": "11.72"}, {"s": 11, "q": "How would onboarding cohorts work for couriers?", "k": "cohort onboarding, monthly orientation, induction group", "a": "New couriers in a district could join a short monthly welcome session, online or at a hub, covering the SOP, insurance and how to appeal. Meeting peers reduces early dropout, as the course notes.", "id": "11.73"}, {"s": 11, "q": "What should a courier welcome pack contain?", "k": "welcome pack, onboarding information", "a": "The riding SOP card, how pay and the base work, insurance details, how to appeal a penalty, weather rules and contact points. It replaces the current app sign-up with real orientation.", "id": "11.74"}, {"s": 11, "q": "Could KeeTa run a management trainee or development programme for couriers?", "k": "management trainee, MT programme, leadership development", "a": "A small version: high-performing couriers could move into trainer, hub coordinator or grievance roles. That's development rather than training, and it fixes the growth factor in QWL.", "id": "11.75"}, {"s": 11, "q": "How does succession planning apply to KeeTa?", "k": "succession planning, pipeline", "a": "For the new roles we propose, KeeTa should know who is ready to step in, using a replacement chart. It keeps trainers and grievance staff available as people leave.", "id": "11.76"}, {"s": 11, "q": "How does training link to retention at KeeTa?", "k": "training retention, keep couriers", "a": "Couriers who feel invested in, and who see a path to a better role, are more likely to stay. Lower turnover saves KeeTa the cost of constantly onboarding new, less safe riders.", "id": "11.77"}, {"s": 11, "q": "Why do organisations need SOPs, in the course's words?", "k": "why SOPs, purpose of SOP, benefits of SOP", "a": "SOPs remove ambiguity, reduce human error, keep quality consistent and enforce safety across a large workforce. KeeTa has thousands of couriers but no riding SOP, so each courier works out their own safety habits.", "id": "11.78"}, {"s": 11, "q": "How do the Airbus, Boeing or Tesla SOP examples relate to KeeTa?", "k": "Airbus Boeing SOP, Tesla SOP, manufacturing SOP example", "a": "Those companies use precise SOPs so thousands of workers do risky tasks safely and the same way. KeeTa also has a huge workforce doing a risky task, riding in traffic, so a simple standard procedure is just as important.", "id": "11.79"}, {"s": 11, "q": "How does the hotel kitchen SOP example relate to KeeTa?", "k": "kitchen SOP, knife handling example", "a": "Kitchens set SOPs for knives and hot equipment because the hazards are known and predictable. Couriers' hazards are also predictable, like phone use, rain and rushing, so they can be covered the same way.", "id": "11.80"}, {"s": 11, "q": "What can KeeTa learn from the Kenco case, where safety was written into the job description?", "k": "Kenco case, safety in job description", "a": "Kenco's job description says the worker \"practices safe work procedures and follows all safety rules at all times\". KeeTa could put the same line in a courier job description and link it to the riding SOP, making safety part of the job, not an optional extra.", "id": "11.81"}, {"s": 11, "q": "Can you give an example of explicit knowledge that would come from couriers' tacit knowledge?", "k": "tacit to explicit example, knowledge capture", "a": "An experienced courier knows which estates' lifts break and which back entrance is faster. Recorded in the app as building notes, that becomes explicit knowledge every courier can use, which saves time and reduces rushing.", "id": "11.82"}, {"s": 11, "q": "What is the main point of slide 11?", "k": "summarise slide 11, safety concepts point", "a": "Good HRM runs job analysis, then hazard identification, SOPs and training, and KeeTa skips every step. It fails QWL security and health and safety, and its insurance is reactive, not preventive.", "id": "11.83"}, {"s": 11, "q": "What if couriers refuse to do the safety training?", "k": "refuse training, compulsory training", "a": "Make the short module a condition of receiving orders, like document checks today. Keep it short, mobile and in couriers' languages so it's easy to complete, and reward completion with a safety badge.", "id": "11.84"}, {"s": 11, "q": "How would KeeTa support couriers who don't speak Chinese or English well?", "k": "language support, ethnic minority couriers, translation", "a": "Offer the SOP, training videos and appeal process in the main languages couriers use, with icons and short videos rather than long text. That's also an EEO issue: fair access to training and appeals.", "id": "11.85"}, {"id": "12.1", "s": 12, "q": "What exactly does the algorithm measure?", "a": "Route, pick-up speed, travel speed and punctuality, plus whether couriers accept the orders they're offered. It's all collected automatically through GPS and the app.", "k": "what algorithm tracks, measurements, metrics"}, {"id": "12.2", "s": 12, "q": "What are \"attendance points\"?", "a": "Our sources describe penalties like deductions, lost attendance points and lost punctuality bonuses. KeeTa doesn't publish the exact point rules, so we describe them in general terms rather than guessing the numbers.", "k": "attendance points, points system"}, {"id": "12.3", "s": 12, "q": "Is the broken-lift example real?", "a": "It's an illustrative case, built from couriers' complaints about delays they can't control, like slow kitchens and lifts. That's why the script calls it \"a typical case\".", "k": "lift example, illustrative case"}, {"id": "12.4", "s": 12, "q": "Is GPS tracking itself a bad thing?", "a": "No, the data is useful. The problem is using it only to punish, with no coaching and no review. Tracking every move also raises privacy concerns, so KeeTa should be clear about what it collects and why.", "k": "GPS tracking bad, surveillance"}, {"id": "12.5", "s": 12, "q": "Can couriers appeal a penalty today?", "a": "We found no evidence of a human review for algorithmic deductions. Couriers can contact in-app support, but that's not the same as someone reviewing whether a penalty was fair.", "k": "appeal now, current appeal, complain today"}, {"id": "12.6", "s": 12, "q": "Isn't automatic measurement more objective than a human manager?", "a": "It's more consistent, and we credit that. But consistent isn't the same as fair. If the measure blames couriers for kitchen delays, it's consistently wrong.", "k": "objective algorithm, automatic vs human"}, {"id": "12.7", "s": 12, "q": "How does K GO connect to performance management?", "a": "K GO turns accepting lower pay into a performance factor. Priority should depend on things couriers control, like reliability and safety, not on how much pay they give up.", "k": "K GO performance, priority performance"}, {"s": 12, "q": "What does \"software as the supervisor\" mean?", "k": "software supervisor meaning, slide 12 title", "a": "The app does the supervisor's job: it watches couriers through GPS, judges their speed and punctuality, and applies penalties. There's no human to talk to, coach them or hear their side.", "id": "12.8"}, {"s": 12, "q": "What is a punctuality bonus?", "k": "punctuality bonus, on-time bonus", "a": "Extra pay for delivering on time. Losing it is one of the automatic penalties our sources describe, so a late order can cost a courier more than one deduction.", "id": "12.9"}, {"s": 12, "q": "What happens to couriers with poor ratings?", "k": "low rating consequences, deactivation, lose priority, bad ratings, bad rating, courier gets bad rating", "a": "They can lose priority or bonuses, and platforms can deactivate accounts. KeeTa doesn't publish its exact rules, which is part of the \"unclear expectations\" problem.", "id": "12.10"}, {"s": 12, "q": "Do customers rate couriers?", "k": "customer ratings, reviews, feedback from customers", "a": "Delivery apps usually let customers rate the delivery. That's useful input, but it should be one source among several, not the only judgment, because customers may blame couriers for restaurant delays.", "id": "12.11"}, {"s": 12, "q": "Does GPS tracking raise privacy issues?", "k": "privacy, personal data, surveillance, PDPO", "a": "Yes. Hong Kong's Personal Data (Privacy) Ordinance requires data to be collected for a clear purpose and used fairly. KeeTa should tell couriers what it tracks and why, and use the data to help them, like in appeals, not only to punish.", "id": "12.12"}, {"s": 12, "q": "Why did you choose a broken lift as the example?", "k": "broken lift example, why lift", "a": "Because it's a very Hong Kong problem: many deliveries go to tall estates. It shows clearly how a delay can be completely outside the courier's control and still be penalised.", "id": "12.13"}, {"s": 12, "q": "Can the algorithm tell the difference between a lazy courier and a slow restaurant?", "k": "algorithm can't tell cause, slow restaurant vs courier", "a": "Not without extra data and judgment. It sees only that the order was late. That's why our grievance team checks restaurant prep times, traffic and weather before a penalty stands.", "id": "12.14"}, {"s": 12, "q": "Is KeeTa doing performance appraisal or performance management?", "k": "appraisal or management KeeTa", "a": "Neither fully. It doesn't hold periodic reviews, so it isn't really appraisal, and it lacks planning input, coaching and review, so it isn't full performance management. It's automated rating and discipline.", "id": "12.15"}, {"s": 12, "q": "What is the main point of slide 12?", "k": "summarise slide 12, software supervisor point", "a": "The algorithm tracks, rates and penalises couriers automatically, with no human review, so couriers are punished even for delays outside their control, and K GO links priority to accepting lower pay.", "id": "12.16"}, {"s": 12, "q": "Could couriers trick the Safe-Riding interface by stopping briefly?", "k": "cheat safe riding, game the system, workaround", "a": "They could pause to accept an order, and that's the goal: accepting while stopped is safe. Because orders queue instead of disappearing, there's no reason to rush back onto the road.", "id": "12.17"}, {"id": "13.1", "s": 13, "q": "What's the difference between performance appraisal and performance management? Which does KeeTa do?", "a": "Appraisal is a periodic review of past results. Performance management is a continuous cycle that looks forward. KeeTa only automates the rating step, so it has neither a full cycle nor a real appraisal conversation.", "k": "appraisal vs management, performance appraisal, performance management difference"}, {"id": "13.2", "s": 13, "q": "Walk us through the cycle for KeeTa.", "a": "Planning: targets set by the algorithm, no courier input. Monitoring: GPS, no coaching. Reviewing: missing. Rating: automatic penalties, few rewards.", "k": "PM cycle, performance management cycle, four stages"}, {"id": "13.3", "s": 13, "q": "Are KeeTa's targets SMART?", "a": "They're specific, measurable and time-bound, but often not achievable, because they ignore real conditions like traffic and kitchens. Couriers have no input, so they're arguably not relevant to their development either. They fail the A, and arguably the R.", "k": "SMART targets, are targets SMART"}, {"id": "13.4", "s": 13, "q": "Give an example of a SMART target for a courier.", "a": "\"Deliver 95% of orders within the buffered delivery time each week, excluding delays verified as outside the courier's control.\" It's specific, measurable, achievable with the buffer, relevant to service, and reviewed weekly.", "k": "SMART example, SMART goal courier"}, {"id": "13.5", "s": 13, "q": "Which appraisal errors does the algorithm avoid?", "a": "The human ones: halo effect, similarity error, first impression error, and inconsistent leniency between different managers. Everyone is measured by the same rule.", "k": "errors avoided, algorithm strengths appraisal"}, {"id": "13.6", "s": 13, "q": "Which appraisal errors does the algorithm still have?", "a": "Unclear expectations: couriers don't know how priority or penalties are calculated. It also behaves like a strictness error, because every late order is penalised whatever the cause. And it measures things outside the courier's control.", "k": "errors remaining, algorithm weaknesses appraisal"}, {"id": "13.7", "s": 13, "q": "You say the algorithm avoids the halo effect. Couldn't it create one?", "a": "Possibly. Under K GO, accepting lower pay boosts priority. One behaviour then lifts a courier's whole standing, which works like a digital halo effect.", "k": "halo effect algorithm, digital halo"}, {"id": "13.8", "s": 13, "q": "Is recency error relevant?", "a": "Possibly. If the algorithm weights recent acceptance rates heavily, one bad week could cut a courier's priority. KeeTa doesn't publish how it weights data, so we can't confirm it. That uncertainty is itself an \"unclear expectations\" problem.", "k": "recency error"}, {"id": "13.9", "s": 13, "q": "What about distribution errors like leniency and central tendency?", "a": "Those come from human raters. KeeTa's system leans the other way: it's strict by design, with no room for judgment. Our grievance team adds that judgment back.", "k": "leniency, central tendency, distribution errors"}, {"id": "13.10", "s": 13, "q": "You say the algorithm is unbiased but unfair. Isn't that a contradiction?", "a": "No. It's consistent: the same rule for everyone. But if the rule blames couriers for kitchen delays, it's consistently unfair. Consistency and fairness are different things.", "k": "unbiased but unfair, consistent but unfair"}, {"id": "13.11", "s": 13, "q": "Which appraisal method would suit couriers best?", "a": "A mix. Objective metrics like a graphic rating scale for on-time rate, critical incidents logged by the grievance team, and customer and restaurant ratings as extra input. Pure essays or checklists wouldn't scale to thousands of couriers.", "k": "best appraisal method, appraisal method recommendation"}, {"id": "13.12", "s": 13, "q": "Which appraisal method is KeeTa closest to?", "a": "An automated rating scale based only on output numbers. There's no written feedback, no critical incidents, no BARS and no 360-degree input. So couriers only get a score, never an explanation.", "k": "current appraisal method, KeeTa method"}, {"id": "13.13", "s": 13, "q": "Would 360-degree appraisal work for couriers?", "a": "Partly. Customers and restaurants already rate couriers, and the appeal channel adds the courier's own voice. A full 360 with peers and subordinates doesn't fit a job where couriers work alone.", "k": "360 degree, multi rater feedback"}, {"id": "13.14", "s": 13, "q": "Give a BARS example for couriers.", "a": "Safe riding: 1 = repeatedly uses the phone while moving. 3 = sometimes late, but no safety issues. 5 = consistently on time, never uses the phone while moving, and helps new couriers.", "k": "BARS, behaviourally anchored rating scale"}, {"id": "13.15", "s": 13, "q": "How would critical incidents be used?", "a": "The grievance team logs specific cases, good and bad, for example a courier who helped an injured customer, or a repeated safety breach. That gives evidence for fair reviews and for recognition.", "k": "critical incident method"}, {"id": "13.16", "s": 13, "q": "How does the strategic linkage model apply?", "a": "Environment: strong competition and rising regulation. Business strategy: fast growth and fast delivery. HR strategy: a low-cost, flexible fleet. Performance management: automatic penalties. Result: strikes and turnover. Our recommendations change the HR strategy to a stable, safe fleet, which better protects the bottom line.", "k": "strategic linkage, strategy link performance"}, {"id": "13.17", "s": 13, "q": "The rating stage should link to rewards. Does KeeTa reward good performance?", "a": "Mostly it penalises. We'd add positive recognition, like a safe-rider badge or a small bonus for a clean safety record. That makes the rating stage motivating, not just punishing.", "k": "rewards, recognition, rating stage"}, {"id": "13.18", "s": 13, "q": "What do you mean by equitable justice versus procedural justice?", "a": "Equitable justice is the QWL factor: rules applied fairly, consistently and transparently. Procedural justice is the research term for a fair process, including the right to explain and appeal. We use both to mean a fair process.", "k": "equitable justice, procedural justice difference"}, {"id": "13.19", "s": 13, "q": "How does scientific management relate to KeeTa?", "a": "KeeTa's algorithm is like digital scientific management: every step is measured and timed, and people adapt to the job. The course says modern service work should adapt the job to the person, and our recommendations move in that direction.", "k": "scientific management, Taylor, Taylorism"}, {"id": "13.20", "s": 13, "q": "What can KeeTa learn from the Google case study?", "a": "Google used data to find the behaviours of its best managers. KeeTa has huge amounts of data too. It could find the behaviours of its safest, most reliable couriers and build training around them.", "k": "Google case, Google study, Project Oxygen"}, {"s": 13, "q": "What happens in the planning stage of the cycle?", "k": "planning stage, set goals, performance planning", "a": "Goals and standards are agreed for the coming period, ideally SMART and with the worker's input. At KeeTa the algorithm sets targets alone, so couriers don't understand or accept them.", "id": "13.21"}, {"s": 13, "q": "What happens in the monitoring stage?", "k": "monitoring stage, check-ins, feedback during", "a": "Progress is tracked with regular feedback and coaching. KeeTa tracks everything by GPS but gives no coaching, so monitoring only produces data, not improvement.", "id": "13.22"}, {"s": 13, "q": "What happens in the reviewing stage?", "k": "reviewing stage, review meeting", "a": "Results are compared with goals, and the worker can explain the context. This stage is completely missing at KeeTa, which is what our grievance team restores.", "id": "13.23"}, {"s": 13, "q": "What happens in the rating stage?", "k": "rating stage, rewards and recognition", "a": "Performance is turned into consequences: rewards, recognition, or development needs. At KeeTa it's mostly automatic penalties, with few rewards for good performance.", "id": "13.24"}, {"s": 13, "q": "How would the checklist method work for couriers?", "k": "checklist method, yes no checklist", "a": "A simple yes or no list, like: phone mounted, helmet worn, delivered within the buffered time, followed weather rules. It's easy to use at scale but doesn't show how well something was done.", "id": "13.25"}, {"s": 13, "q": "Would written essays work for appraising couriers?", "k": "written essay method, narrative appraisal", "a": "Not at KeeTa's scale. Writing a description for thousands of couriers isn't practical. Short written explanations of appeal decisions are more realistic.", "id": "13.26"}, {"s": 13, "q": "What is a graphic rating scale, and how would KeeTa use it?", "k": "graphic rating scale, rating scale", "a": "A scale that rates traits or results, for example 1 to 5 on punctuality, safety and customer service. KeeTa already does a numeric version; the gap is that it ignores context and has no review.", "id": "13.27"}, {"s": 13, "q": "What is the compare-and-contrast error?", "k": "contrast error, comparison error", "a": "Rating someone against the people rated just before them instead of against the standard. An algorithm avoids it, because it scores every courier against the same rule.", "id": "13.28"}, {"s": 13, "q": "What is the first impression error, and does it apply?", "k": "first impression error", "a": "Letting an early judgment colour later ratings. The algorithm avoids it because it applies the same rules every time, but early bad weeks could still hurt priority if the data is weighted that way.", "id": "13.29"}, {"s": 13, "q": "What is the similarity error?", "k": "similarity error, similar to me", "a": "Rating people higher because they're like the rater. The algorithm avoids it, since there's no human rater, which is one strength we credit.", "id": "13.30"}, {"s": 13, "q": "What is strictness error, and how does it apply?", "k": "strictness error, harsh rating", "a": "Rating everyone too harshly. KeeTa's rule penalises every late order whatever the cause, which works like built-in strictness.", "id": "13.31"}, {"s": 13, "q": "What does \"unclear expectations\" mean as an appraisal error?", "k": "unclear expectations, unclear standards", "a": "Workers don't know exactly what is expected or how they're judged. Couriers don't know how priority or penalties are calculated, so they can't improve or challenge a rating.", "id": "13.32"}, {"s": 13, "q": "What is due process?", "k": "due process meaning, fair process", "a": "A fair procedure before a penalty: being told the reason, having a chance to explain, and having someone review the decision. KeeTa's automatic deductions skip all three.", "id": "13.33"}, {"s": 13, "q": "Why is feedback important in performance management?", "k": "feedback importance, two-way feedback", "a": "Feedback tells workers what to change and shows that the organisation cares about improvement, not just punishment. Two-way feedback also tells the company where its own system is wrong, like slow restaurants.", "id": "13.34"}, {"s": 13, "q": "What KPIs would you use for couriers?", "k": "KPIs, key performance indicators, measures for couriers", "a": "On-time rate within the buffered time, after removing delays outside the courier's control. Safety incidents. Customer rating. Order acceptance rate. That mix balances speed, safety and service.", "id": "13.35"}, {"s": 13, "q": "How would you redesign the planning stage?", "k": "fix planning, improve planning, courier input targets", "a": "Set realistic delivery times with the buffer, publish the rules clearly in the app, and ask a courier panel for input before changes. Then targets are achievable and understood.", "id": "13.36"}, {"s": 13, "q": "Could the algorithm be biased against some couriers?", "k": "algorithm bias, discrimination, unfair algorithm", "a": "Possibly, for example if some districts always have slower restaurants or more hills. We found no evidence of bias by background. A regular review of penalty data by district would catch it.", "id": "13.37"}, {"s": 13, "q": "Should performance be linked to pay for couriers?", "k": "performance related pay, pay for performance", "a": "Partly, yes. The per-order commission already rewards output, and we'd add rewards for safety, like a safe-rider bonus. What we remove is buying priority by accepting lower pay.", "id": "13.38"}, {"s": 13, "q": "What does \"consistent, instant records\" as a strength mean?", "k": "strength records, data strength", "a": "Every courier is measured the same way and the data is available at once. That's valuable evidence, and our grievance team uses it to decide appeals quickly.", "id": "13.39"}, {"s": 13, "q": "Is the algorithm a fair appraiser?", "k": "algorithm fair, algorithm objective, fairness of algorithm", "a": "It's consistent, which is fair in one sense. But it can't see context, so it blames couriers for delays they didn't cause. Fair appraisal needs both consistency and context, which is why we add human review.", "id": "13.40"}, {"s": 13, "q": "What is a performance appraisal interview, and does KeeTa have one?", "k": "appraisal interview, review meeting, one to one", "a": "A meeting where a manager and worker discuss performance, results and next steps. KeeTa has none for couriers. At scale, the appeal explanation and a monthly summary are a realistic substitute.", "id": "13.41"}, {"s": 13, "q": "The course says the purpose of appraisal is not to punish. How does KeeTa compare?", "k": "purpose of appraisal, not to punish, developmental purpose", "a": "KeeTa's system is almost entirely punitive: it catches lateness and deducts pay. The course says appraisal should align work with goals, find skill gaps, give feedback and support growth. Our recommendations shift it towards that purpose.", "id": "13.42"}, {"s": 13, "q": "Which of the outcomes of a good appraisal programme does KeeTa miss?", "k": "outcomes of appraisal, benefits of appraisal, eleven outcomes", "a": "It does assess past performance and affects rewards. It misses structured progress discussions, constructive feedback, spotting talent and future leaders, identifying development needs, career and succession planning, and using appraisal to retain good workers.", "id": "13.43"}, {"s": 13, "q": "Who should appraise couriers?", "k": "sources of appraisal, who appraises, supervisor peers self customers", "a": "A mix of sources. The algorithm provides objective data. Customers and restaurants give service feedback. The courier's own explanation comes through appeals. A human reviewer, the missing \"supervisor\", brings judgment. Peers and subordinates matter less in solo work.", "id": "13.44"}, {"s": 13, "q": "Should couriers do self-assessment?", "k": "self assessment, self appraisal, self rating", "a": "A light version, yes: the appeal is effectively the courier's own account of what happened. A short monthly self-check on safety habits would also build self-awareness at almost no cost.", "id": "13.45"}, {"s": 13, "q": "Could customers be a source of appraisal for couriers?", "k": "customer appraisal, customer feedback rating", "a": "Yes, customers see the service directly. But they can't see restaurant delays or broken lifts, so their ratings should be weighed together with data and reviewed when a courier appeals.", "id": "13.46"}, {"s": 13, "q": "What are the pros and cons of 360-degree feedback?", "k": "360 pros cons, multi-rater pros cons", "a": "Pros: a rounded view, more teamwork and employee empowerment. Cons: time-consuming, open to leniency or office politics, and it can make people defensive. For couriers, a light version, data plus customers plus self-explanation, keeps the benefits at low cost.", "id": "13.47"}, {"s": 13, "q": "What is the horn effect, and does it happen at KeeTa?", "k": "horn effect, single deficiency, reverse halo", "a": "The horn effect is judging someone by one weakness and ignoring their strengths. KeeTa's system can do this: one late order can cost bonuses and priority even if the courier's record is otherwise excellent.", "id": "13.48"}, {"s": 13, "q": "What does \"over-emphasising attitude\" mean as an appraisal error?", "k": "over-emphasising attitude, personality over results", "a": "Rating someone on enthusiasm or personality rather than actual work. The algorithm doesn't do this, which is a strength. The risk at KeeTa is the opposite: it ignores attitude and service entirely.", "id": "13.49"}, {"s": 13, "q": "What does treating reviews as an administrative formality mean, and does KeeTa do it?", "k": "annual review formality, tick box review", "a": "Treating appraisal as a box-ticking exercise instead of a real conversation. KeeTa goes further: there's no conversation at all, only automatic scores and deductions.", "id": "13.50"}, {"s": 13, "q": "What are the five steps of an appraisal interview, and how would they apply to couriers?", "k": "appraisal interview steps, prepare plan measure coach target", "a": "Prepare, plan, measure success, coach, and set target dates. At KeeTa's scale, a monthly in-app summary could do this: what went well, any penalties reversed, one tip to improve, and the next month's target.", "id": "13.51"}, {"s": 13, "q": "How should KeeTa give negative feedback to couriers?", "k": "negative feedback rules, constructive feedback, eight rules feedback", "a": "Follow the course's rules: be positive, give actionable advice, focus on
