the situation not the person, be specific with data, keep it private, give it promptly, make it two-way and follow up. Today a penalty is just a deduction with no explanation, which breaks almost every rule.", "id": "13.52"}, {"s": 13, "q": "Rewrite a KeeTa penalty notice using the feedback rules.", "k": "example feedback message, better penalty message", "a": "\"Your order on Tuesday arrived 6 minutes late. If this was caused by the restaurant, traffic or a lift, tap Appeal and we'll check. Tip: in this building the service lift is faster. Your on-time rate this month is 94%.\" It's specific, private, prompt, actionable and two-way.", "id": "13.53"}, {"s": 13, "q": "Performance management includes counselling, discipline and absence management. How does that apply?", "k": "performance management strategies, counselling, absence management", "a": "KeeTa only uses discipline, through automatic penalties. Counselling, like coaching repeat late couriers, and understanding absence, like couriers avoiding certain districts, are missing. The grievance team is the start of that human side.", "id": "13.54"}, {"s": 13, "q": "How does performance management link to KeeTa's bottom line?", "k": "bottom line, performance and profit", "a": "Clear, fair targets mean fewer late orders, fewer complaints and fewer couriers quitting. That keeps service reliable and recruitment costs down, which is the course's strategic linkage idea.", "id": "13.55"}, {"s": 13, "q": "Give an example of a measurable goal for couriers, like the \"two new clients a week\" example.", "k": "measurable goal example, M in SMART", "a": "\"Complete at least 95% of deliveries within the buffered time, with zero phone use while moving, over the next four weeks.\" It's measurable from GPS and app data.", "id": "13.56"}, {"s": 13, "q": "Is a 10-minute delivery target achievable?", "k": "achievable target, A in SMART, 10 minutes realistic", "a": "Often not, because it ignores kitchen wait times, lifts, traffic and weather. That's why we say KeeTa's targets fail the \"achievable\" part of SMART and recommend the 5 to 7 minute buffer.", "id": "13.57"}, {"s": 13, "q": "Why are KeeTa's targets time-bound but still not SMART?", "k": "time-bound SMART, T in SMART", "a": "They are time-bound and measurable, but they fail \"achievable\" because conditions vary, and arguably \"relevant\" because couriers have no input. A goal needs all five parts to be SMART.", "id": "13.58"}, {"s": 13, "q": "What is the main point of slide 13?", "k": "summarise slide 13, performance concepts point", "a": "KeeTa runs only the rating stage of the performance cycle. Its targets aren't SMART, it avoids human biases but blames couriers for external factors, and it has no due process. Its strength is consistent records.", "id": "13.59"}, {"s": 13, "q": "What is organisational justice?", "k": "organisational justice, distributive procedural interactional justice", "a": "Beyond our course list, but it has three parts: distributive justice, fair outcomes like pay; procedural justice, fair processes like appeals; and interactional justice, being treated with respect and given explanations. KeeTa is weak on all three, and our three recommendations map onto them.", "id": "13.60"}, {"s": 13, "q": "How does goal-setting theory apply to KeeTa?", "k": "goal setting theory, Locke, goals motivation", "a": "Beyond our course list, but it says specific, challenging but achievable goals with feedback motivate people. KeeTa's goals are specific but often unachievable and come with no feedback, so they create stress instead of motivation, which matches our SMART point.", "id": "13.61"}, {"s": 13, "q": "What is the job characteristics model, and how does it apply?", "k": "job characteristics model, Hackman Oldham, autonomy feedback", "a": "Beyond our course list, but it says jobs motivate when they offer skill variety, task identity, significance, autonomy and feedback. The courier job is low on autonomy and feedback. Parent-Rocheleau and Parker (2022) use this kind of thinking to show algorithms reshape jobs.", "id": "13.62"}, {"s": 13, "q": "Who would check that the grievance team is fair?", "k": "audit grievance team, who reviews reviewers, oversight", "a": "A regular audit of a sample of decisions by a senior manager, plus published statistics on reversals by district. If the team rejects almost every appeal or accepts almost every one, that's a warning sign.", "id": "13.63"}, {"id": "14.1", "s": 14, "q": "Name QWL's four principles and how KeeTa does on each.", "a": "Security: fails, on both physical safety and income security. Equity: fails, because of pay cuts and K GO's unequal rates. Individualism: partly met, since couriers choose their hours but have no say over how they work or how they grow. Democracy: fails, because couriers have no voice in decisions.", "k": "QWL principles, four principles, security equity individualism democracy"}, {"id": "14.2", "s": 14, "q": "Isn't 1 out of 8 too harsh?", "a": "Each score is tied to a finding we presented, for example, fair pay fails because of the fee cuts. We also credit strengths elsewhere: the insurance, fees shown upfront and consistent records. They just don't amount to a QWL factor being fully met.", "k": "1 of 8 harsh, scorecard too harsh, unfair score"}, {"id": "14.3", "s": 14, "q": "Why do you say flexible schedules is met, but individualism only partly?", "a": "Flexibility covers when couriers work. Individualism is broader: autonomy and personal development. The algorithm still controls how they work, and there's no growth path.", "k": "flexible schedules met, individualism partly"}, {"id": "14.4", "s": 14, "q": "Which QWL factor is most seriously breached?", "a": "Health and safety, under the security principle, because it can cost lives. Fair pay and equitable justice are close behind.", "k": "most serious QWL breach, worst factor"}, {"id": "14.5", "s": 14, "q": "Is QWL relevant to contractors, or only employees?", "a": "The principles are about people doing the work, not their contract. And poor QWL hurts KeeTa either way, through turnover, strikes and service quality.", "k": "QWL contractors"}, {"id": "14.6", "s": 14, "q": "Which QWL factors does each recommendation fix?", "a": "Recommendation 1: fair pay and job security. Recommendation 2: health and safety, and job design. Recommendation 3: equitable justice and participation. Growth isn't fully covered, so we'd add a development path next.", "k": "recommendations QWL, which factors fixed"}, {"id": "14.7", "s": 14, "q": "How could job design techniques improve the courier job?", "a": "Job enrichment: more autonomy, like seeing full order details and choosing routes. Job rotation: moving between zones or between peak and off-peak shifts to reduce fatigue. Job enlargement: adding tasks like mentoring new couriers. These help the job design and growth factors.", "k": "job design, job rotation, job enlargement, job enrichment"}, {"id": "14.8", "s": 14, "q": "What about business process reengineering?", "a": "Our Safe-Riding interface is a small redesign of the dispatch process: orders queue instead of popping up. That's process redesign to remove a hazard, not just a training fix.", "k": "BPR, business process reengineering"}, {"id": "14.9", "s": 14, "q": "How could KeeTa improve growth opportunities?", "a": "A simple career path: courier, senior courier, trainer, then hub coordinator. Experienced couriers could also join the grievance team.", "k": "growth path, career path"}, {"id": "14.10", "s": 14, "q": "Why should gig workers have growth opportunities?", "a": "Even flexible workers stay longer when there's a path forward, for example senior or mentor courier roles, safety-trainer roles, or moving into station operations. It lowers turnover.", "k": "growth for gig workers, career gig"}, {"id": "14.11", "s": 14, "q": "How could KeeTa improve employee participation?", "a": "A courier forum or representatives consulted before fee changes, plus a regular survey. The May 2025 cuts were announced without consultation, which helped trigger the strike.", "k": "participation, courier voice, consultation"}, {"s": 14, "q": "How did you decide whether each QWL factor was met?", "k": "QWL scoring method, how scored, criteria for met", "a": "Each factor is judged against one finding we presented. Met means couriers clearly have it, like flexible schedules. Not met means our evidence shows a gap, like no base pay for fair pay.", "id": "14.12"}, {"s": 14, "q": "Why does job security fail?", "k": "job security failed, why insecure", "a": "Couriers are contractors, accounts can be deactivated, priority can be lost, and pay can change overnight. None of that gives security.", "id": "14.13"}, {"s": 14, "q": "Why does growth fail?", "k": "growth opportunities failed, no career path", "a": "There's no progression path: no senior courier role, no training ladder, no route into operations. Every courier does the same job indefinitely.", "id": "14.14"}, {"s": 14, "q": "What's the difference between employee participation and the democracy principle?", "k": "participation vs democracy, democracy principle", "a": "Democracy is the broad principle that workers have a voice in decisions. Employee participation is the practical factor, the ways they actually take part. KeeTa fails both because couriers weren't consulted on pay changes.", "id": "14.15"}, {"s": 14, "q": "Which QWL factor would be easiest to fix first?", "k": "easiest fix, quick win QWL", "a": "Equitable justice, through the grievance team, because the data already exists and it doesn't change pay costs much. Health and safety is also quick through the app changes.", "id": "14.16"}, {"s": 14, "q": "How does job design fail at KeeTa?", "k": "job design failed, algorithm controls everything", "a": "Couriers have almost no control over how they work: the app assigns orders, routes, time limits and penalties. Good job design gives some autonomy and variety.", "id": "14.17"}, {"s": 14, "q": "Is QWL only for big companies?", "k": "QWL small companies, who should use QWL", "a": "No. It's a way to judge any job. It's especially useful for large platforms because small design choices affect thousands of workers at once.", "id": "14.18"}, {"s": 14, "q": "What would a better QWL score look like after your recommendations?", "k": "QWL after recommendations, improved score", "a": "Our three recommendations target fair pay, job security, health and safety, job design, equitable justice and participation. Growth still needs a development path, so it stays the next step.", "id": "14.19"}, {"s": 14, "q": "What is the individualism principle?", "k": "individualism principle meaning", "a": "Respecting each worker as a person with their own needs, giving them autonomy and the chance to develop. KeeTa partly meets it through free choice of hours but fails on autonomy and growth.", "id": "14.20"}, {"s": 14, "q": "What is the security principle?", "k": "security principle meaning", "a": "Workers should be safe physically and economically: safe working conditions and a reasonable, stable income. KeeTa fails both parts.", "id": "14.21"}, {"s": 14, "q": "What is the equity principle?", "k": "equity principle meaning", "a": "Fair, consistent treatment and pay. KeeTa fails because of the pay cuts without consultation and K GO's different rates for the same work.", "id": "14.22"}, {"s": 14, "q": "What is the main point of slide 14?", "k": "summarise slide 14, QWL scorecard point", "a": "Against the eight QWL factors, KeeTa meets only flexible schedules. It fails fair pay, health and safety, job security, growth, job design, equitable justice and participation. That's the gap our recommendations close.", "id": "14.23"}, {"s": 14, "q": "What is employee engagement, and how engaged are KeeTa's couriers?", "k": "employee engagement, engagement level, morale", "a": "Engagement means workers feel committed and put in extra effort. The strike and turnover suggest low engagement. Fair pay, fair review and a voice channel are the main levers to raise it.", "id": "14.24"}, {"s": 14, "q": "What is employee voice, and why does it matter here?", "k": "employee voice, courier voice, speak up", "a": "Ways workers can raise concerns and influence decisions. Couriers had no voice channel, so their concerns came out as a strike. A courier forum and the appeal button give them a voice before conflict.", "id": "14.25"}, {"id": "15.1", "s": 15, "q": "HK$40 an hour is below Hong Kong's HK$43.1 minimum wage. Isn't that a problem?", "a": "Couriers are contractors, so the Minimum Wage Ordinance doesn't apply. But we don't use that as an excuse. HK$40 is a floor, not total pay: with two orders an hour the courier earns HK$70, well above HK$43.1. If KeeTa wants to remove any doubt, it can set the floor at HK$44; the structure stays the same.", "k": "minimum wage, below minimum wage, 43.1, HK$40 too low"}, {"id": "15.2", "s": 15, "q": "Won't a base wage turn couriers into employees?", "a": "The Deliveroo ruling shows status depends mostly on control: freedom to reject orders, delegate and work for rivals. A pay floor alone doesn't decide it. KeeTa's real legal risk today comes from its tight control, so KeeTa should get legal advice before roll-out either way.", "k": "base wage employee status, base pay legal risk"}, {"id": "15.3", "s": 15, "q": "Would a hybrid pay floor create MPF or Employment Ordinance obligations?", "a": "Not automatically. Status depends mainly on control, not pay structure. But KeeTa should get legal advice before rolling it out.", "k": "MPF obligation, Employment Ordinance obligation"}, {"id": "15.4", "s": 15, "q": "Where do HK$40 and HK$15 come from?", "a": "They're illustrative, set close to current earnings so total cost stays manageable. Before the cuts couriers earned about HK$40–50 an order and asked for at least HK$45. Our mix gives similar pay in a normal hour but protects quiet hours; the pilot fine-tunes the rates.", "k": "where numbers come from, HK$40 HK$15 source"}, {"id": "15.5", "s": 15, "q": "Before the cuts, couriers earned around HK$38 an order. Isn't HK$15 a pay cut in busy hours?", "a": "Good catch. With three orders an hour, our example gives HK$85, less than before. The numbers are illustrative. In the pilot, KeeTa should set the commission so busy-hour pay doesn't fall, for example by adding a peak-hour commission. The base protects quiet hours; it shouldn't reduce busy ones.", "k": "HK$15 pay cut, busy hours pay, lower pay busy"}, {"id": "15.6", "s": 15, "q": "Can't couriers just log in and collect the base without delivering?", "a": "No. The base is only for active time: online in a delivery zone and accepting the orders offered. Rejecting orders or going offline stops the base.", "k": "abuse base, log in and do nothing, cheat base"}, {"id": "15.7", "s": 15, "q": "Won't couriers slow down once they have a base?", "a": "The commission still rewards each completed order, and acceptance and completion are tracked. That's why it's a hybrid, not a flat wage.", "k": "slow down, lazy, less effort"}, {"id": "15.8", "s": 15, "q": "Why not just raise the per-order rate instead?", "a": "A higher rate helps in busy hours but still leaves nothing in quiet hours, and it can be cut overnight, as May 2025 showed. The base layer is what makes income predictable.", "k": "raise per order rate, higher fee instead"}, {"id": "15.9", "s": 15, "q": "Why not pay by distance?", "a": "A distance element can sit inside the commission; Foodpanda already does this. Our key point is the floor underneath, which distance pay alone doesn't give.", "k": "distance pay, pay by distance"}, {"id": "15.10", "s": 15, "q": "Why scrap K GO completely instead of fixing it?", "a": "K GO pays different rates for the same work in exchange for priority, which breaks internal equity. Priority should depend on distance and reliability, not on who accepts less pay.", "k": "scrap K GO, fix K GO"}, {"id": "15.11", "s": 15, "q": "Won't scrapping K GO make dispatch less efficient?", "a": "No. Proximity dispatch sends the nearest courier, which is efficient by design. K GO is a pay policy, not an efficiency tool.", "k": "dispatch efficiency, efficiency without K GO"}, {"id": "15.12", "s": 15, "q": "What happens to peak-hour bonuses?", "a": "They can stay inside the incentive layer. The point is that bonuses sit on top of a floor, not instead of one.", "k": "peak bonus, peak hour bonus"}, {"id": "15.13", "s": 15, "q": "How much will this cost KeeTa?", "a": "We don't have KeeTa's internal data, so we don't invent a figure. The extra cost is mainly in quiet hours, when the base tops up low earnings. The pilot measures the real cost against savings from lower turnover and fewer strikes.", "k": "cost of pay floor, how much cost"}, {"id": "15.14", "s": 15, "q": "How do you know couriers want a base rather than higher per-order pay?", "a": "Their strike demands included \"stable income\", not just a higher rate. The pilot should still include a courier survey to check.", "k": "courier preference base, want base pay"}, {"id": "15.15", "s": 15, "q": "How does this fit the four-layer model?", "a": "It adds the missing base layer and keeps incentives. Insurance stays as the benefit, and perks could follow. Couriers move from one layer to three.", "k": "rec 1 four layer, base layer"}, {"id": "15.16", "s": 15, "q": "How does this link to forecasting from the course?", "a": "With a base, KeeTa pays for active time, so it must avoid having too many couriers online. Ratio analysis, like couriers needed per 1,000 orders per district, helps schedule the right number.", "k": "forecasting link, link forecasting"}, {"id": "15.17", "s": 15, "q": "How could KeeTa use demand forecasting?", "a": "Trend analysis: project order growth from past months. Ratio analysis: couriers needed per 1,000 orders in each district and hour. Scatter plot: orders against active couriers to find the average line. Then managerial judgment for typhoons, holidays and big events that numbers can't predict.", "k": "demand forecasting, trend ratio scatter"}, {"id": "15.18", "s": 15, "q": "Why use turnover rate as the main measure?", "a": "It directly shows whether couriers stay. It's the course formula: leavers divided by the average number of couriers, times 100. The pilot also tracks safety incidents, appeals and delivery times.", "k": "turnover measure, why turnover"}, {"id": "15.19", "s": 15, "q": "How do you calculate the turnover rate? Give an example.", "a": "Turnover % = couriers leaving in a period ÷ average number of couriers × 100. For example, if 300 leave in a year and the average is 1,500, turnover is 300 ÷ 1,500 × 100 = 20%. Those numbers are only an example, not KeeTa's.", "k": "turnover formula, calculate turnover"}, {"id": "15.20", "s": 15, "q": "What's the difference between planned and unplanned separations at KeeTa?", "a": "Unplanned: couriers quitting because of pay or safety. Planned: KeeTa deactivating an account. Deactivations should follow the same fair process as other discipline, with a reason and a chance to appeal.", "k": "planned unplanned separation, deactivation separation"}, {"id": "15.21", "s": 15, "q": "What exactly does the 2026 Policy Address propose?", "a": "The government is developing legislation to give food and goods delivery platform workers statutory compensation for work injuries. The details are still being worked out.", "k": "2026 Policy Address, government proposal"}, {"s": 15, "q": "How did you get HK$70?", "k": "calculate 70, HK$70 example, worked example", "a": "The HK$40 hourly base plus two orders at HK$15 each: 40 + 15 + 15 = HK$70 for one active hour. It's an illustrative example.", "id": "15.22"}, {"s": 15, "q": "What if no orders come in during an active hour?", "k": "quiet hour, no orders, zero orders", "a": "The courier still earns the HK$40 base, as long as they stay online in a zone and accept the orders offered. That's the point of the floor: it protects income in quiet hours.", "id": "15.23"}, {"s": 15, "q": "How is \"active time\" measured?", "k": "active time definition, how measure active, logged in time", "a": "From app data: the courier is online, inside a delivery zone, and accepts the orders offered. Going offline, leaving the zone or rejecting orders pauses the base.", "id": "15.24"}, {"s": 15, "q": "Won't a base attract too many couriers at quiet times?", "k": "too many couriers, oversupply, cost control base pay", "a": "KeeTa can control that with scheduling: limit how many couriers can be active per district at each hour, using demand forecasts. Couriers book active slots, and outside them they earn commission only.", "id": "15.25"}, {"s": 15, "q": "What about couriers' fuel and scooter costs?", "k": "running costs, fuel, vehicle costs", "a": "The commission is meant to cover running costs. If fuel costs rise, KeeTa could add a small distance element to the commission, like Foodpanda's distance matrix.", "id": "15.26"}, {"s": 15, "q": "What is proximity dispatch?", "k": "proximity dispatch meaning, nearest courier", "a": "Offering each order to the nearest suitable courier. It's fair and efficient, and it replaces K GO's rule of giving priority to couriers who accept lower pay.", "id": "15.27"}, {"s": 15, "q": "How does a pay floor reduce strikes?", "k": "why fewer strikes, pay floor strikes", "a": "The strike was about pay cuts and unstable income. A floor means income can't collapse overnight, so the main cause of the protest is removed.", "id": "15.28"}, {"s": 15, "q": "What KPIs would show recommendation one works?", "k": "measure rec 1, success measures pay floor", "a": "Courier turnover rate, strike or stoppage days, average hourly earnings in quiet hours, and order acceptance rate. If turnover falls without acceptance dropping, it's working.", "id": "15.29"}, {"s": 15, "q": "Wouldn't couriers prefer HK$45 per order, as they demanded?", "k": "HK$45 demand, why not 45 per order", "a": "Perhaps, but a higher per-order rate still leaves quiet hours unpaid and can be cut again. Our hybrid answers the demand for stable income. KeeTa can tune the commission in the pilot so normal earnings meet couriers' expectations.", "id": "15.30"}, {"s": 15, "q": "Does recommendation one cost more than it saves?", "k": "cost benefit rec 1, is pay floor worth it", "a": "We can't put exact numbers on it without KeeTa's data. The extra cost is mainly in quiet hours; the savings come from fewer strikes, lower turnover and recruiting costs. The pilot measures both.", "id": "15.31"}, {"s": 15, "q": "Does the pay floor help recruitment?", "k": "recruitment benefit, attract couriers", "a": "Yes. \"A guaranteed base for every active hour\" is a strong message in a market where couriers can choose apps, especially against Foodpanda's base fee.", "id": "15.32"}, {"s": 15, "q": "Why HK$40 rather than something higher?", "k": "why 40, base rate level", "a": "It's illustrative, chosen close to current pay so the total cost stays manageable. Job evaluation and the pilot would set the final rate, and KeeTa could move it to HK$44 to stay clearly above minimum wage.", "id": "15.33"}, {"s": 15, "q": "How does recommendation one help KeeTa's business, not just couriers?", "k": "business benefit rec 1, why good for KeeTa", "a": "Fewer peak-hour strikes protect revenue, lower turnover cuts recruiting and onboarding costs, and KeeTa is ready for the platform-worker protections in the 2026 Policy Address.", "id": "15.34"}, {"s": 15, "q": "What happens to K GO members under recommendation one?", "k": "K GO members, what happens to K GO couriers", "a": "K GO's pay-for-priority trade-off ends. Everyone gets the same base and commission, and orders go to the nearest suitable courier. Former members lose nothing they paid for: they simply go back to normal pay.", "id": "15.35"}, {"s": 15, "q": "How do you calculate the average number of couriers for the turnover formula?", "k": "average employees formula, beginning plus ending divided by two", "a": "Add the number at the start of the period and the number at the end, then divide by two. For example, 1,400 at the start and 1,600 at the end gives an average of 1,500. These are example numbers only.", "id": "15.36"}, {"s": 15, "q": "Why is high turnover so costly for KeeTa?", "k": "cost of turnover, high turnover cost", "a": "It means constant recruiting and onboarding, more inexperienced riders who are less safe, lost tacit knowledge about routes and buildings, and damage to KeeTa's reputation as a place to work.", "id": "15.37"}, {"s": 15, "q": "What can turnover data tell KeeTa about the root cause of problems?", "k": "turnover root cause, diagnose turnover", "a": "High turnover points to problems like below-market pay, poor job fit or high stress. If turnover rose after the May 2025 cuts, that suggests pay is the main cause, which supports recommendation one.", "id": "15.38"}, {"s": 15, "q": "What retention strategies would you suggest besides the pay floor?", "k": "retention strategies, keep couriers, reduce turnover", "a": "A fair appeal process, safety improvements, recognition like a safe-rider badge, low-cost perks, a career path to trainer or hub roles, and a courier forum for feedback. All of these address reasons couriers leave.", "id": "15.39"}, {"s": 15, "q": "What is the main point of slide 15?", "k": "summarise slide 15, rec 1 point", "a": "Recommendation one adds a hybrid pay floor: HK$40 per active hour plus HK$15 per order, scraps K GO's pay-for-priority, and measures success through the turnover rate.", "id": "15.40"}, {"s": 15, "q": "How would KeeTa handle remote areas or long-distance orders under the pay floor?", "k": "remote districts, Lantau, long distance orders", "a": "Add a distance element or zone multiplier to the commission for long or remote trips, like Foodpanda's distance matrix. The base stays the same everywhere.", "id": "15.41"}, {"s": 15, "q": "How would you communicate the pay changes to couriers?", "k": "communicate changes, communication plan, announce changes", "a": "Announce them in advance through the app, in couriers' languages, with clear examples of earnings, explain the pilot, and invite feedback through the courier forum. Sudden, unexplained changes are what caused the 2025 strike.", "id": "15.42"}, {"s": 15, "q": "How would you handle resistance from KeeTa's managers?", "k": "resistance to change, management resistance, change management", "a": "Show the business case with data from the pilot, start small in one district, involve finance and operations in setting the rates, and report results openly. A pilot lowers the risk of saying yes.", "id": "15.43"}, {"s": 15, "q": "What baseline data would you collect before the pilot?", "k": "baseline data, before data, measure before", "a": "Turnover, incidents per 10,000 deliveries, penalty and complaint rates, average quiet-hour earnings and delivery times for the pilot and control districts over the previous months. Without a baseline you can't show improvement.", "id": "15.44"}, {"s": 15, "q": "What if order demand falls?", "k": "demand falls, fewer orders, recession", "a": "The active-slot scheduling would reduce how many couriers can be active at a time, so KeeTa doesn't pay the base to too many people. The base protects those who are active rather than everyone who logs in.", "id": "15.45"}, {"s": 15, "q": "What if new technology like drones replaces couriers?", "k": "drones, robots, automation replace couriers", "a": "Automation may handle some routes in future, but couriers will deliver most orders for a long time, especially to Hong Kong's dense estates. The HR principles still matter for the workers who remain.", "id": "15.46"}, {"id": "16.1", "s": 16, "q": "Is a 15 km/h cut-off safe? Couriers could still use the phone at 14 km/h.", "a": "15 km/h is a starting threshold, about the speed of a slow roll. Below that, a courier is effectively stopped. The key is that orders queue instead of disappearing, so there's no reason to grab them while moving. The pilot tests the threshold, and KeeTa can lower it if incidents don't fall.", "k": "15 km/h, speed threshold, speed cut-off"}, {"id": "16.2", "s": 16, "q": "Why add 5 to 7 minutes?", "a": "It follows Yu and colleagues (2023), who studied conservative delivery times and rider behaviour. It's a starting range that the pilot would adjust by district.", "k": "5 to 7 minutes, buffer, why buffer"}, {"id": "16.3", "s": 16, "q": "What does ETA mean?", "a": "Estimated time of arrival: the delivery time the app promises the customer, which also becomes the courier's deadline.", "k": "ETA meaning, estimated time of arrival"}, {"id": "16.4", "s": 16, "q": "Won't longer delivery times upset customers and hurt market share?", "a": "Customers mainly want an honest time: a 25-minute promise kept is better than an 18-minute promise broken. Fewer late orders also means fewer customer coupons, which saves KeeTa money. The pilot tracks delivery times to check the effect.", "k": "customers upset, slower delivery, market share"}, {"id": "16.5", "s": 16, "q": "Couldn't couriers just accept orders by voice?", "a": "Voice could be a future option, but it's still a distraction. Queuing orders until the courier stops is simpler and safer.", "k": "voice orders, voice accept"}, {"id": "16.6", "s": 16, "q": "Won't couriers just ignore the SOP?", "a": "That's why we combine three things. The app design makes the safe choice automatic, training explains why, and recognition rewards safe riders. Rules alone rarely change behaviour.", "k": "ignore SOP, compliance"}, {"id": "16.7", "s": 16, "q": "How long would the SOP training be?", "a": "We suggest a short online module of about an hour, plus a quiz, before the first order, then a yearly refresher. It's quick, so it doesn't slow recruitment.", "k": "training length, how long training"}, {"id": "16.8", "s": 16, "q": "Can KeeTa measure speed accurately?", "a": "Yes. KeeTa already tracks couriers by GPS for routes and punctuality. The same data can pause pop-ups.", "k": "measure speed, GPS accuracy"}, {"id": "16.9", "s": 16, "q": "Isn't this mainly an IT change, not HRM?", "a": "The tool is software, but the decision is HRM: it's about job design, safety and workload. Our point is that at KeeTa, HR policy is written in code.", "k": "IT not HR, technology change"}, {"id": "16.10", "s": 16, "q": "Should HR or engineering own the dispatch changes?", "a": "Both. HR sets the standards for safety and fairness, and engineering builds them into the app. That's why we say the HR and engineering teams must work together.", "k": "HR or engineering, ownership"}, {"id": "16.11", "s": 16, "q": "How much does it cost?", "a": "Mostly software development and short in-app training modules. That's why we call it the cheapest recommendation to start with.", "k": "cost rec 2, how much rec 2"}, {"id": "16.12", "s": 16, "q": "What about bad weather?", "a": "A natural next step is a weather rule: during typhoon signals or heavy rainstorm warnings, delivery times are extended or dispatch is paused. We'd test it in the pilot.", "k": "weather, rain, typhoon rule"}, {"id": "16.13", "s": 16, "q": "How does this link to the HK$1 million insurance?", "a": "Insurance pays after an accident; this recommendation tries to prevent one. Fewer accidents also means fewer claims, which can keep insurance costs down.", "k": "insurance link rec 2"}, {"id": "16.14", "s": 16, "q": "Which course concepts does this recommendation apply?", "a": "Job analysis to find hazards, SOPs to standardise safe practice, training needs analysis for the course, and the QWL security principle. It's the OSH chain from slide 11, done properly.", "k": "course concepts rec 2"}, {"s": 16, "q": "How does the app know how fast the courier is moving?", "k": "GPS speed, measure speed, how detect speed", "a": "From the phone's GPS, which KeeTa already uses to track routes and punctuality. The same data can pause pop-ups above 15 km/h.", "id": "16.15"}, {"s": 16, "q": "What if the courier is walking or on a bicycle?", "k": "walking couriers, bicycle, cyclists", "a": "Walking is under 15 km/h, so pop-ups appear normally. A cyclist moving fast enough would see orders queue until they stop, which is the safe outcome.", "id": "16.16"}, {"s": 16, "q": "What is defensive riding?", "k": "defensive riding meaning", "a": "Riding as if others might make mistakes: keeping safe distances, watching blind spots, slowing at junctions and not rushing. It's a core part of our riding SOP.", "id": "16.17"}, {"s": 16, "q": "How does recommendation two fix the job analysis gap?", "k": "rec 2 job analysis, links to job analysis", "a": "It acts on the hazards a job analysis would find. Time pressure gets the ETA buffer, phone use gets the Safe-Riding UI, and the lack of an SOP gets the onboarding guide.", "id": "16.18"}, {"s": 16, "q": "What does litigation risk mean here?", "k": "litigation risk, lawsuits, legal claims", "a": "The risk of being sued or facing claims after accidents, including claims that couriers are really employees. Fewer accidents and clearer safety rules reduce that risk.", "id": "16.19"}, {"s": 16, "q": "How does safer dispatch repair KeeTa's public image?", "k": "public image, reputation, brand image", "a": "Couriers riding dangerously and striking hurt KeeTa's reputation. Visible safety steps show KeeTa cares about couriers and the public, which helps with customers, regulators and recruitment.", "id": "16.20"}, {"s": 16, "q": "Won't restaurants complain about longer delivery windows?", "k": "restaurants reaction, restaurant complaints", "a": "The buffer is on the delivery window, not the restaurant's prep time, and more realistic times mean fewer complaints about late food. The pilot would check restaurant feedback.", "id": "16.21"}, {"s": 16, "q": "What KPIs would show recommendation two works?", "k": "measure rec 2, safety KPIs", "a": "Safety incidents per 10,000 deliveries, insurance claims, on-time rate against the buffered ETA, and customer satisfaction. If incidents fall and satisfaction holds, it works.", "id": "16.22"}, {"s": 16, "q": "Why is recommendation two the cheapest?", "k": "cheapest recommendation, low cost rec 2", "a": "Two of its three parts are software changes to an app KeeTa already runs, and the third is a short online module. There's no ongoing extra pay cost like recommendation one.", "id": "16.23"}, {"s": 16, "q": "What are the three parts of recommendation two again?", "k": "rec 2 parts, summary rec 2", "a": "A conservative ETA with a 5 to 7 minute buffer, a Safe-Riding interface that pauses pop-ups above 15 km/h, and a short riding-safety SOP built into onboarding.", "id": "16.24"}, {"s": 16, "q": "What is the main point of slide 16?", "k": "summarise slide 16, rec 2 point", "a": "Recommendation two is safer dispatch: a 5 to 7 minute ETA buffer, a Safe-Riding interface that pauses pop-ups above 15 km/h, and a riding SOP built into onboarding. It's the cheapest fix.", "id": "16.25"}, {"s": 16, "q": "Isn't safety the couriers' own responsibility as contractors?", "k": "contractor safety responsibility, not KeeTa's job", "a": "Couriers are responsible for how they ride, but KeeTa designs the conditions: deadlines, pop-ups and penalties. When the system rewards risky riding, the designer shares responsibility. That's both ethical and good for business.", "id": "16.26"}, {"id": "17.1", "s": 17, "q": "A grievance team for thousands of couriers sounds expensive. Is it realistic?", "a": "Most appeals can be checked against data KeeTa already has: weather, restaurant prep times and traffic. So staff only review the unclear cases. KeeTa already runs customer service at scale, and the pilot shows the real number of appeals before hiring.", "k": "grievance team expensive, cost grievance, realistic grievance"}, {"id": "17.2", "s": 17, "q": "How many staff would it need?", "a": "We don't guess a number. The pilot in one district shows how many appeals come in, and KeeTa scales staff from that.", "k": "staff number, team size"}, {"id": "17.3", "s": 17, "q": "How fast should appeals be decided?", "a": "A clear target, for example within 48 hours, so couriers aren't left waiting for their pay. Simple cases with clear data could be decided faster.", "k": "appeal speed, 48 hours"}, {"id": "17.4", "s": 17, "q": "Won't couriers abuse the appeal button?", "a": "Every appeal is checked against data, so false claims are easy to spot. KeeTa can publish the rules and track couriers who repeatedly make false appeals. Fair rules, applied the same way for everyone.", "k": "abuse appeals, false appeals"}, {"id": "17.5", "s": 17, "q": "Why use humans and not AI to review appeals?", "a": "AI can sort cases and flag the obvious ones. But the final decision needs human judgment, which is exactly what's missing today. That's the course principle of equitable justice.", "k": "humans vs AI, AI review"}, {"id": "17.6", "s": 17, "q": "How does this restore the review and feedback stages?", "a": "Each decision is explained to the courier, and patterns go back as feedback. For example, a monthly summary showing which delays were outside their control.", "k": "review feedback stages, restore cycle"}, {"id": "17.7", "s": 17, "q": "Why should the team be based in Hong Kong?", "a": "Local staff understand local conditions: estate lifts, typhoon signals and specific districts. They can also speak Cantonese and English with couriers.", "k": "Hong Kong team, local team"}, {"id": "17.8", "s": 17, "q": "How does this help KeeTa's business, not just couriers?", "a": "It reveals restaurants that are always slow, which the algorithm currently blames on couriers. KeeTa can work with those restaurants to fix delays, which improves service for customers too.", "k": "business benefit grievance, helps KeeTa"}, {"id": "17.9", "s": 17, "q": "Who should be on the team: internal or external hires?", "a": "A mix. Experienced couriers bring job knowledge and credibility, and HR professionals bring fair-process skills. That also creates a growth path for couriers.", "k": "team members, who is on team"}, {"id": "17.10", "s": 17, "q": "Should the grievance team be recruited internally or externally?", "a": "Both. Internal hires, meaning experienced couriers, know the job and have credibility. External HR professionals bring fair-process skills and independence.", "k": "internal external grievance recruitment"}, {"id": "17.11", "s": 17, "q": "How does this relate to discipline in the course?", "a": "Good discipline lets the worker explain before a penalty, and penalties increase step by step. KeeTa's automatic deductions skip that, and the grievance team adds the missing step.", "k": "discipline course, discipline link"}, {"id": "17.12", "s": 17, "q": "How does employee discipline and ethics apply?", "a": "Automatic deductions are discipline without due process: no warning, no chance to explain, no appeal. Good discipline is transparent and step by step. Our grievance team adds that, and treating couriers fairly is also a matter of social responsibility.", "k": "discipline ethics, due process"}, {"id": "17.13", "s": 17, "q": "What would progressive discipline look like for couriers?", "a": "A reminder first, then coaching, then a small penalty, then suspension, with a chance to explain at each step. That replaces instant deductions.", "k": "progressive discipline, warnings"}, {"id": "17.14", "s": 17, "q": "Is algorithmic deactivation ethical?", "a": "Only with due process: notice, a reason, and a human review. Without them, it breaks the equitable justice principle.", "k": "deactivation ethical, account ban, firing couriers"}, {"s": 17, "q": "What data would the grievance team check?", "k": "evidence for appeals, what data, how decide appeals", "a": "Weather records, restaurant preparation times, traffic data, building issues like lift faults, and the courier's GPS trail. Much of this KeeTa already collects.", "id": "17.15"}, {"s": 17, "q": "What if the courier disagrees with the team's decision?", "k": "second appeal, escalate, disagree with decision", "a": "There should be a second level: a senior reviewer who checks the case once. That keeps the process fair without endless appeals.", "id": "17.16"}, {"s": 17, "q": "Is the grievance team like a trade union?", "k": "union, collective bargaining, worker representation", "a": "No. A union represents workers collectively and negotiates. The grievance team is KeeTa's own fair-review process for individual penalties. A separate courier forum, which we suggest for participation, is closer to a voice channel.", "id": "17.17"}, {"s": 17, "q": "How would couriers learn the outcome of an appeal?", "k": "appeal result, notification, feedback to courier", "a": "Through the app, with a short explanation of the decision and the evidence used. That explanation is the feedback the performance cycle is missing.", "id": "17.18"}, {"s": 17, "q": "Could the grievance data be used against restaurants?", "k": "restaurants slow, use data restaurants", "a": "Yes, constructively. If one restaurant keeps causing delays, KeeTa can work with it on preparation times or adjust its delivery windows. That improves service and stops couriers being blamed.", "id": "17.19"}, {"s": 17, "q": "What are the three steps of the grievance process?", "k": "appeal review reverse, steps of rec 3", "a": "Appeal: the courier taps a button to dispute a penalty. Review: a Hong Kong HR team checks weather, restaurant and traffic data. Reverse: the penalty is cancelled if the delay was beyond the courier's control.", "id": "17.20"}, {"s": 17, "q": "What does procedural justice mean?", "k": "procedural justice definition", "a": "Fairness of the process, not just the outcome: clear rules, a chance to explain, and a neutral review. People accept decisions more when the process is fair, even if they lose.", "id": "17.21"}, {"s": 17, "q": "How does the grievance team support the equitable justice factor?", "k": "equitable justice rec 3", "a": "Equitable justice needs rules applied fairly, consistently and transparently. The team adds the transparency and the chance to explain, while the algorithm keeps the consistency.", "id": "17.22"}, {"s": 17, "q": "What KPIs would show recommendation three works?", "k": "measure rec 3, grievance KPIs", "a": "Number of appeals, share of penalties reversed, average time to decide, and courier satisfaction. A falling reversal rate over time would show the algorithm is improving too.", "id": "17.23"}, {"s": 17, "q": "How does this make the workforce less hostile?", "k": "less hostile, morale, motivation", "a": "When couriers can explain and see unfair penalties reversed, they trust the system more. Trust lowers anger, protests and quitting.", "id": "17.24"}, {"s": 17, "q": "How many appeals do you expect?", "k": "number of appeals, appeal volume", "a": "We don't guess. The pilot shows the real volume. Clear data on weather, restaurants and traffic should let simple cases be decided quickly, so staff focus on unclear ones.", "id": "17.25"}, {"s": 17, "q": "Would the team be employees of KeeTa?", "k": "grievance team employees, who employs team", "a": "Yes. They'd be KeeTa's own Hong Kong staff, mixing experienced couriers and HR professionals, so they understand local conditions.", "id": "17.26"}, {"s": 17, "q": "What role should an ethical HR manager play at KeeTa?", "k": "ethical partner, HR integrity, HR ethics role", "a": "An objective coordinator who makes sure decisions are fair, transparent and legal, and who speaks up for workers' wellbeing as well as the business. At KeeTa that means checking that the app's rules are fair, not just efficient.", "id": "17.27"}, {"s": 17, "q": "Traditional discipline asks \"did we follow the procedure?\". What does modern HRM ask instead?", "k": "control vs sustainability, modern discipline view", "a": "It asks whether discipline helps the organisation perform responsibly and sustainably. KeeTa's automatic deductions are efficient, but they cause strikes and turnover, so they fail the modern test.", "id": "17.28"}, {"s": 17, "q": "Where does equitable justice come from in the QWL framework?", "k": "equitable justice origin, security and equity principles", "a": "It comes from the security principle, protection from unfair practices, and the equity principle, fair and transparent treatment. KeeTa's penalties with no appeal fail both.", "id": "17.29"}, {"s": 17, "q": "What are the three parts of equitable justice, and how does KeeTa score?", "k": "equitable justice components, transparent consistent no favouritism", "a": "Transparent rules: KeeTa's penalty rules aren't published, so it fails. Consistent standards: the algorithm is consistent, which is a strength. No favouritism or arbitrary bias: K GO gives priority to couriers who accept lower pay, which is a form of favouritism.", "id": "17.30"}, {"s": 17, "q": "What are the steps of progressive discipline?", "k": "progressive discipline steps, verbal warning, written warning, suspension, termination", "a": "A verbal warning, then a written warning, then suspension, demotion or a final warning, and finally termination. Each step gives the worker a chance to improve. KeeTa jumps straight to an automatic penalty.", "id": "17.31"}, {"s": 17, "q": "What should a written warning include, and what would the courier equivalent be?", "k": "warning letter contents, written warning example", "a": "The rule broken, the standard it refers to, the corrective action and timeline, and the consequences if nothing changes. For couriers: an in-app notice naming the issue, for example repeated phone use while moving, the SOP rule, a required short refresher, and what happens if it repeats.", "id": "17.32"}, {"s": 17, "q": "When is immediate termination justified?", "k": "gross misconduct, immediate dismissal, instant termination", "a": "For serious misconduct, like theft, violence or dangerous behaviour, a company can skip steps. For ordinary problems like lateness, progressive steps are fairer. KeeTa should separate those two kinds of cases clearly.", "id": "17.33"}, {"s": 17, "q": "Why is documentation important in discipline?", "k": "documentation discipline, HRIS records, evidence for discipline", "a": "Decisions need evidence to be fair and legally defensible. KeeTa has excellent data, but it uses it only to penalise. The grievance team would use the same records to check penalties before they stand.", "id": "17.34"}, {"s": 17, "q": "Why is protecting couriers' data an ethical issue?", "k": "data privacy ethics, confidentiality, employee records access", "a": "KeeTa holds detailed GPS, performance and penalty records. The course says access to such records should be limited by authorisation. Only staff who need the data, like the grievance team on a specific case, should see it.", "id": "17.35"}, {"s": 17, "q": "What is corporate social responsibility in HR terms, for KeeTa?", "k": "CSR, social responsibility HR, sustainable operations", "a": "Treating couriers as human capital, not replaceable costs, and balancing profit with safety, fair pay and a voice for workers. For KeeTa, it also covers public road safety.", "id": "17.36"}, {"s": 17, "q": "How would you handle a courier who repeatedly breaks the riding SOP?", "k": "repeat offender, discipline example courier", "a": "Use progressive steps: an in-app reminder, then a short refresher module, then a temporary priority reduction, and only then suspension, with a chance to explain at each step through the grievance team.", "id": "17.37"}, {"s": 17, "q": "What is the main point of slide 17?", "k": "summarise slide 17, rec 3 point", "a": "Recommendation three is a Hong Kong-based human grievance team: couriers appeal, staff review the data, and penalties outside the courier's control are reversed. It restores the review and feedback stages.", "id": "17.38"}, {"s": 17, "q": "What is HR analytics, and how could KeeTa use it?", "k": "HR analytics, people analytics, data driven HR", "a": "Using workforce data to make better HR decisions. KeeTa has huge amounts of data; it could analyse turnover by district, penalty patterns and incident hotspots to target pay, training and appeals.", "id": "17.39"}, {"s": 17, "q": "What is an HRIS, and how does it relate to KeeTa?", "k": "HRIS, HR information system", "a": "A system that stores and manages workforce data. KeeTa's app works like an HRIS for couriers, holding records of work and penalties. The course stresses using such records fairly and keeping them secure.", "id": "17.40"}, {"id": "18.1", "s": 18, "q": "Who pays for all this?", "a": "KeeTa, mainly. Part of the cost comes back through lower turnover and recruitment, fewer accident claims, fewer late-order coupons and fewer strike disruptions.", "k": "who pays, funding"}, {"id": "18.2", "s": 18, "q": "Delivery margins are thin. Can KeeTa afford this?", "a": "Strikes, accidents, turnover and legal risk also cost money. The phased roll-out lets KeeTa compare costs and savings before committing.", "k": "afford, margins, thin margins"}, {"id": "18.3", "s": 18, "q": "Won't your recommendations make delivery more expensive for customers?", "a": "Possibly a little, but KeeTa also saves money through fewer strikes, lower turnover, fewer claims and fewer late-order coupons. The pilot shows the real balance before any price decision.", "k": "customer price, more expensive delivery"}, {"id": "18.4", "s": 18, "q": "Your recommendations raise costs. Couldn't KeeTa respond by raising prices or using fewer couriers?", "a": "That's a real risk. That's why we propose a pilot: it shows the actual cost before KeeTa commits. Some costs are also offset by fewer strikes, accidents, late-order coupons and recruitment costs.", "k": "raise prices, fewer couriers response"}, {"id": "18.5", "s": 18, "q": "Why would a profit-making company adopt these voluntarily?", "a": "Because doing nothing also costs money: peak-hour strikes, brand damage, legal risk, and new platform-worker law on the way. Acting early lets KeeTa design the change on its own terms.", "k": "why voluntary, why would KeeTa do this"}, {"id": "18.6", "s": 18, "q": "If the government will legislate anyway, why should KeeTa act first?", "a": "Acting early lets KeeTa design the change itself, test it and control the cost. Waiting means following rules written by others, possibly with less flexibility.", "k": "act before law, legislation coming"}, {"id": "18.7", "s": 18, "q": "Why pilot in one district first?", "a": "It limits cost and risk. KeeTa can compare the pilot district with a similar district that hasn't changed, so it sees the real effect before spending across Hong Kong.", "k": "why pilot, one district"}, {"id": "18.8", "s": 18, "q": "Which district would you choose?", "a": "Tsuen Wan, where the strike started. It would rebuild trust where it was damaged most, and there's a clear \"before\" to compare with.", "k": "which district, Tsuen Wan pilot"}, {"id": "18.9", "s": 18, "q": "How long should the pilot run?", "a": "About three to six months: long enough to see changes in turnover and incidents, short enough to decide quickly.", "k": "pilot length, how long pilot"}, {"id": "18.10", "s": 18, "q": "What else would you measure in the pilot?", "a": "Four things: courier turnover, safety incidents per 10,000 deliveries, appeal outcomes (how many penalties are reversed), and on-time delivery rate. A short courier satisfaction survey would add the couriers' view.", "k": "pilot measures, what to measure"}, {"id": "18.11", "s": 18, "q": "What if the pilot fails?", "a": "KeeTa adjusts the details, like pay rates, the speed threshold or the time buffer, and tests again. It only scales up what works, which is the point of a pilot.", "k": "pilot fails, failure"}, {"id": "18.12", "s": 18, "q": "Which recommendation should come first?", "a": "Recommendation 2 is fastest and cheapest, because it's mostly software. Recommendation 1 matters most, because pay triggered the strike. In the pilot we'd test all three together, since they support each other.", "k": "which first, priority recommendation, order of recommendations"}, {"id": "18.13", "s": 18, "q": "Are your recommendations realistic for a company like KeeTa?", "a": "Yes. Each uses tools KeeTa already has: GPS data, the app and customer service. Foodpanda already uses a base fee in the same market, so the pay model isn't untested.", "k": "realistic, feasible, practical"}, {"id": "18.14", "s": 18, "q": "What's the biggest risk to your recommendations?", "a": "Cost, and the legal question of courier status. We manage both with a pilot first and legal advice before full roll-out.", "k": "biggest risk, main risk"}, {"s": 18, "q": "What is a control district?", "k": "control group, comparison district", "a": "A similar district where nothing changes during the pilot. Comparing the pilot district with it shows whether the changes, not something else like the weather or season, caused the results.", "id": "18.15"}, {"s": 18, "q": "How would you measure safety incidents?", "k": "measure incidents, safety measure, incidents per deliveries", "a": "Incidents reported through the app and insurance claims, per 10,000 deliveries, so busy and quiet districts can be compared fairly.", "id": "18.16"}, {"s": 18, "q": "What are the risks of the pilot itself?", "k": "pilot risks, problems with pilot", "a": "Couriers might move into the pilot district for the base pay, results could be affected by season, and three months may be short. A control district and clear eligibility rules reduce those risks.", "id": "18.17"}, {"s": 18, "q": "Who at KeeTa would need to approve these changes?", "k": "approval, decision maker, senior management", "a": "Senior management in Hong Kong, with operations, engineering, finance and HR involved. That's why we present the business case, not just fairness.", "id": "18.18"}, {"s": 18, "q": "What is the overall timeline?", "k": "timeline, how long to implement, schedule", "a": "Roughly: plan and build the app changes, run a three to six month pilot, review the four measures, then scale up district by district if results hold.", "id": "18.19"}, {"s": 18, "q": "Short-term cost versus long-term value: can you summarise?", "k": "costs vs value summary, cost benefit summary", "a": "Short term: higher base labour cost, app engineering and local HR staff. Long term: fewer strikes and standstills, fewer accidents and claims, lower turnover and recruitment cost, and readiness for new platform-worker law.", "id": "18.20"}, {"s": 18, "q": "How can you claim long-term value without numbers?", "k": "no numbers, evidence of value, prove benefits", "a": "Each benefit links to a cost KeeTa already faces: strikes stop deliveries, accidents bring claims, turnover means constant recruiting. We don't invent figures; the pilot is designed to measure them.", "id": "18.21"}, {"s": 18, "q": "What does \"scale up\" mean here?", "k": "scale up meaning, expand", "a": "Extending the changes from the pilot district across Hong Kong, step by step, only if the four measures improve.", "id": "18.22"}, {"s": 18, "q": "What are the four measures in the pilot?", "k": "four measures, pilot KPIs", "a": "Courier turnover, safety incidents, appeal outcomes and delivery times.", "id": "18.23"}, {"s": 18, "q": "Is a three to six month pilot long enough?", "k": "pilot length, too short", "a": "It's long enough to see turnover and incident trends and short enough to decide quickly. If results are unclear, KeeTa can extend the pilot rather than scale up.", "id": "18.24"}, {"s": 18, "q": "What would make you stop the pilot?", "k": "stop criteria, failure criteria", "a": "If costs rise without any improvement in turnover, incidents or appeal outcomes, or if delivery times worsen sharply. Then KeeTa adjusts the details and tests again.", "id": "18.25"}, {"s": 18, "q": "What is the main point of slide 18?", "k": "summarise slide 18, feasibility point", "a": "The recommendations cost money in the short term, but they bring long-term value through fewer strikes, accidents and turnover. A pilot in one district tests them before scaling up.", "id": "18.26"}, {"s": 18, "q": "Should customers pay more so couriers get fair pay?", "k": "customers pay more, delivery fee increase", "a": "Possibly a little, but KeeTa can also fund it from savings in turnover, claims and late-order coupons. The pilot shows how much, if any, needs to come from customers.", "id": "18.27"}, {"id": "19.1", "s": 19, "q": "What's the single root cause behind all three issues?", "a": "The combination of the contractor model and algorithmic control. KeeTa controls the work like an employer but carries the responsibilities of a client. Each issue comes from that gap.", "k": "root cause, main cause"}, {"id": "19.2", "s": 19, "q": "Are you saying algorithmic management is bad?", "a": "No. It's efficient and consistent, and we keep it. Our point is that it needs a human layer for fairness, feedback and safety.", "k": "algorithm bad, against technology"}, {"id": "19.3", "s": 19, "q": "If KeeTa could only do one recommendation, which one?", "a": "The pay floor, because pay was what triggered the strike. But if KeeTa wants a quick win first, the safer dispatch design is the fastest and cheapest to launch.", "k": "only one recommendation, most important recommendation"}, {"id": "19.4", "s": 19, "q": "What's the main lesson for other platforms?", "a": "If an app does HR's job, it needs HR's principles: a pay floor, safe job design and a fair review process. The same applies to Foodpanda and ride-hailing apps.", "k": "lesson other platforms, generalise"}, {"id": "19.5", "s": 19, "q": "How do your recommendations support Meituan's own values?", "a": "They make \"win-win cooperation\" true for couriers, support \"integrity\" through transparent rules, and still deliver \"customer-centric\" service through honest, reliable delivery times.", "k": "Meituan values recommendations"}, {"id": "19.6", "s": 19, "q": "Isn't \"win-win cooperation\" new information in the conclusion?", "a": "No, it's a callback. We introduced Meituan's values on slide 3 and said we'd test them.", "k": "win-win new information"}, {"id": "19.7", "s": 19, "q": "What is KeeTa's social responsibility here?", "a": "Road safety affects pedestrians and drivers, not just couriers. Fair income affects families. Meituan's own value of integrity says long-term trust matters more than short-term savings.", "k": "social responsibility, CSR"}, {"id": "19.8", "s": 19, "q": "Why does your conclusion mention the audience's KeeTa orders?", "a": "To bring the topic back to everyday life: almost everyone uses these apps. It shows the HR issue affects real people we see daily, not just theory. It adds no new information, as the brief requires for a conclusion.", "k": "conclusion KeeTa orders, callback"}, {"s": 19, "q": "Can you summarise your presentation in one sentence?", "k": "summary, one sentence, main message, key takeaway", "a": "KeeTa replaced human HR with an algorithm, which caused unfair pay, unsafe dispatch and no justice, and a pay floor, safer dispatch and a grievance team can fix that while keeping KeeTa's growth.", "id": "19.9"}, {"s": 19, "q": "How do the three recommendations support each other?", "k": "link between recommendations, work together, package", "a": "The pay floor reduces the need to rush, which helps safety. Safer dispatch reduces penalties for lateness. The grievance team catches unfair penalties that remain. Together they fix the whole system, not one symptom.", "id": "19.10"}, {"s": 19, "q": "What is the most important takeaway for HR managers?", "k": "lesson for HR, implication for HRM", "a": "If software makes HR decisions, HR principles still apply. Someone has to design the pay, safety and appraisal rules inside the app fairly.", "id": "19.11"}, {"s": 19, "q": "Does the conclusion introduce any new information?", "k": "new information conclusion, brief requirement conclusion", "a": "No. It repeats the three failures and three fixes from the presentation, and links back to Meituan's value from slide 3 and the opening question about KeeTa orders.", "id": "19.12"}, {"s": 19, "q": "What is the main point of slide 19?", "k": "summarise slide 19, conclusion point", "a": "Three failures, three fixes: unfair pay gets a pay floor, unsafe dispatch gets safer design, automatic penalties get a grievance team. The goal is QWL and a complete performance cycle, so win-win is true for couriers.", "id": "19.13"}, {"s": 19, "q": "Is gig work good or bad for society?", "k": "gig work good or bad, society, opinion gig economy", "a": "It brings flexibility and income opportunities, and easy entry for people who need work. It also brings insecurity and safety risks. Our view is that platforms can keep the benefits while reducing the risks through better HR design.", "id": "19.14"}, {"s": 19, "q": "Did KeeTa do anything right?", "k": "KeeTa strengths, positives, what did KeeTa do well", "a": "Yes: very fast growth, flexible hours, fees shown before accepting, consistent records, and the HK$1 million insurance upgrade. Our recommendations keep all of these.", "id": "19.15"}, {"id": "20.1", "s": 20, "q": "Are your references in APA style?", "a": "Yes. The slide shows our main references, and the full APA list, with in-text citations, is in our written report.", "k": "APA style, referencing"}, {"id": "20.2", "s": 20, "q": "Why are only seven references on the slide?", "a": "Space. We showed the key academic sources; the full list of 15 papers plus news and legal sources is in the report.", "k": "seven references, few references"}, {"s": 20, "q": "What did Wood and colleagues (2019) find?", "k": "Wood 2019, good gig bad gig", "a": "Their study \"Good gig, bad gig\" found that platform work gives flexibility and autonomy, but algorithmic control also brings low pay, overwork, isolation and insecurity. We use it to show KeeTa's mix of flexibility and precarity.", "id": "20.3"}, {"s": 20, "q": "What did Parent-Rocheleau and Parker (2022) argue?", "k": "Parent-Rocheleau Parker, algorithms as work designers", "a": "That algorithms act as work designers: they shape job characteristics like autonomy, workload and feedback. We use it to argue that KeeTa's app makes HR and job design decisions.", "id": "20.4"}, {"s": 20, "q": "What did Chen (2023) find?", "k": "Chen 2023, job stress risky driving", "a": "That job stress among food delivery riders leads to distraction and risky driving. It supports our point that time pressure and penalties create safety hazards.", "id": "20.5"}, {"s": 20, "q": "What did Christie and Ward (2023) find?", "k": "Christie Ward, delivering hot food on motorcycles", "a": "They studied food delivery riders on motorcycles and found the platform business model, like pay per delivery and time pressure, affects rider safety. It supports treating safety as a design issue.", "id": "20.6"}, {"s": 20, "q": "What is Au-Yeung and colleagues (2024) about?", "k": "Au-Yeung 2024, gig economy social policy", "a": "It discusses the gig economy, platform work and social policy, with attention to Hong Kong delivery workers. We use it for local context on couriers' protection gaps.", "id": "20.7"}, {"s": 20, "q": "What is Chan (2025) about?", "k": "Chan 2025, platform architecture labor unrest", "a": "It studies how platform design relates to labour unrest, including Hong Kong delivery couriers' strikes. We use it for the Foodpanda strike history and the link between app design and protest.", "id": "20.8"}, {"s": 20, "q": "Which reference is the most important?", "k": "key reference, main source", "a": "For the analysis, Parent-Rocheleau and Parker (2022), because it frames algorithms as HR decision-makers. For the recommendations, Yu and colleagues (2023), because it supports the conservative ETA.", "id": "20.9"}, {"s": 20, "q": "What is APA style?", "k": "APA meaning, APA 7, referencing style", "a": "The American Psychological Association referencing style: author and year in the text, and a full reference list in alphabetical order. The brief requires it.", "id": "20.10"}, {"s": 20, "q": "Where are your in-text citations?", "k": "in-text citations, citing on slides", "a": "On the slides where facts appear, like Measurable AI for the 43% and Yu et al., 2023 for the ETA buffer, and in full in the written report.", "id": "20.11"}, {"s": 20, "q": "What is the main point of slide 20?", "k": "summarise slide 20, references point", "a": "It shows our key academic sources in APA style; the full list, including news and legal sources, is in the written report.", "id": "20.12"}, {"id": "21.1", "s": 21, "q": "Isn't your analysis one-sided against KeeTa?", "a": "We tried to be balanced. Every issue includes a strength: the insurance, fees shown upfront, flexible hours and consistent records. We also presented the Deliveroo ruling, which supports platforms. Our recommendations keep the algorithm; they don't replace it.", "k": "one-sided, biased against KeeTa, unfair to KeeTa"}, {"id": "21.2", "s": 21, "q": "Couriers chose this job. If they don't like it, can't they just leave?", "a": "Many do, and that's the problem for KeeTa: turnover means constant recruiting and less experienced, less safe couriers. Strikes also disrupt service at peak hours. Good HRM is about keeping good workers, not just replacing them.", "k": "just leave, choose job, quit if unhappy"}, {"id": "21.3", "s": 21, "q": "Your recommendations sound generic. How are they specific to KeeTa?", "a": "They target KeeTa's own features: scrapping K GO, linking to its HK$1 million insurance, fixing its order-grabbing pop-ups, its punctuality coupons, and a pilot in Tsuen Wan, where its strike started.", "k": "generic, specific to KeeTa"}, {"id": "21.4", "s": 21, "q": "Wouldn't couriers prefer to keep things as they are, with total flexibility?", "a": "Our recommendations keep the flexibility. Couriers still choose when to log in. What changes is a pay floor, safer dispatch and a way to appeal, which couriers asked for in their strike demands.", "k": "prefer flexibility, keep status quo"}, {"id": "21.5", "s": 21, "q": "What if KeeTa simply refuses to change?", "a": "Then the risks grow: more strikes, higher turnover, possible legal reclassification and new legislation. Our job as HR advisers is to show the business case, and we believe the pilot makes it low-risk to try.", "k": "refuses to change, KeeTa says no"}, {"id": "21.6", "s": 21, "q": "Which of your findings are you least sure about?", "a": "The exact delivery time limits and pay figures, because they come from couriers' accounts and KeeTa doesn't publish them. That's why we label them as reported and suggest measuring them in the pilot.", "k": "least sure, uncertain findings, weakest finding"}, {"id": "21.7", "s": 21, "q": "What's the biggest weakness in your own recommendations?", "a": "The pay numbers need calibration. As 15.5 shows, our example could lower busy-hour pay, so KeeTa must test the rates. There's also legal uncertainty about worker status, and we couldn't estimate total cost without courier numbers. The pilot is designed to fix all three.", "k": "weakness recommendations, limitations recommendations"}, {"id": "21.8", "s": 21, "q": "You're students. How do you know your recommendations would work?", "a": "We don't claim certainty. Each recommendation is based on something that already exists: Foodpanda's base fee, published research on ETAs and safety, and standard HR practice for appeals. And we recommend testing them in a pilot first.", "k": "students, how do you know it works"}, {"id": "21.9", "s": 21, "q": "What did you learn from this project?", "a": "That course concepts like QWL and the performance management cycle still work even when there's no human HR team. They actually help explain why a high-tech system ended in a strike.", "k": "what you learned, learning"}, {"id": "21.10", "s": 21, "q": "What would you do differently if you redid this project?", "a": "Add primary research, for example a short survey of couriers about pay, safety and penalties. That would confirm the secondary evidence with our own data.", "k": "redo project, do differently"}, {"s": 21, "q": "Can you give an example?", "k": "example please, for instance, give me an example", "a": "Use the broken-lift case: a courier waits at a slow restaurant, then finds the lift broken. The order is late, a deduction is applied automatically, and there's no one to explain it to. It shows all three issues at once: pay, pressure to rush, and no review.", "id": "21.11"}, {"s": 21, "q": "Why is that important?", "k": "so what, why does it matter, significance", "a": "Link back to the business: unfair pay, unsafe riding and unfair penalties lead to strikes, accidents and turnover, which cost KeeTa money and reputation. Then link to couriers' wellbeing.", "id": "21.12"}, {"s": 21, "q": "Can you explain that more simply?", "k": "simpler, explain again, I don't understand, clarify", "a": "Restate in one sentence using the three-part frame: what the problem is, what causes it, and what we'd change. For example: \"Couriers' pay can drop overnight because there's no base, so we add a small guaranteed base.\"", "id": "21.13"}, {"s": 21, "q": "What evidence do you have for that?", "k": "evidence, proof, source for that, how do you know", "a": "Name the source type: news reports of the May 2025 strike, Hong Kong Labour Rights Monitor findings, court rulings, KeeTa's own statements, or the academic study. If it's a courier report, say so plainly.", "id": "21.14"}, {"s": 21, "q": "If you were KeeTa's HR manager, what would you do tomorrow?", "k": "first step, tomorrow, HR manager first action", "a": "Launch the Safe-Riding pop-up pause and the appeal button in one district, because they're quick software changes. Then start planning the pay floor pilot with finance.", "id": "21.15"}, {"s": 21, "q": "Does this apply to other platforms like Uber or Lalamove?", "k": "other platforms, Uber, Lalamove, ride hailing, other industries", "a": "Yes. Any app that assigns work, sets pay and rates workers is doing HR through software. The same three questions apply: is pay fair, is the work safe, and is there a fair review?", "id": "21.16"}, {"s": 21, "q": "Is algorithmic management the future of HRM?", "k": "future of HR, AI in HR, will AI replace HR", "a": "It's already part of it, and it brings real efficiency. The lesson from KeeTa is that algorithms should support human HR judgment, not replace it.", "id": "21.17"}, {"s": 21, "q": "What ethical issues does this case raise?", "k": "ethics, ethical problems, morality", "a": "Shifting risk onto workers who have little power, penalising people for things they can't control, and safety risks to couriers and the public. Treating workers fairly is part of a company's social responsibility.", "id": "21.18"}, {"s": 21, "q": "What should the government do?", "k": "government role, regulation, policy recommendation", "a": "Our recommendations are for KeeTa, but the 2026 Policy Address already plans work-injury protection for delivery platform workers. KeeTa acting first puts it ahead of that law.", "id": "21.19"}, {"s": 21, "q": "Did your project meet all the brief's requirements?", "k": "brief requirements, meet brief, assessment criteria", "a": "Yes: a Mainland organisation operating in Hong Kong, three course topics, an introduction with background, mission, values, business and location, a research method, strengths and weaknesses linked to theory, specific recommendations with problems and benefits, a conclusion with no new information, and APA references.", "id": "21.20"}, {"s": 21, "q": "How does your project link to the rest of the course?", "k": "link to course, learning outcomes, course concepts used", "a": "We applied concepts from almost every topic: job analysis and QWL, recruitment and labour grids, performance management and appraisal errors, training and onboarding, compensation, OSH and SOPs, and discipline and equitable justice.", "id": "21.21"}, {"s": 21, "q": "What was the hardest part of this project?", "k": "hardest part, challenge, difficult", "a": "Answer from your experience. A strong honest answer: \"Finding reliable data, because KeeTa doesn't publish courier information. We had to cross-check news, court rulings and research carefully.\"", "id": "21.22"}, {"s": 21, "q": "What would KeeTa's management say about your presentation?", "k": "KeeTa response, management view, company perspective", "a": "They'd probably point to the insurance upgrade, flexible hours and fast growth, which we credit. We'd answer that our recommendations protect that growth by reducing strikes, accidents and turnover.", "id": "21.23"}, {"s": 21, "q": "Would you personally work as a KeeTa courier?", "k": "personal opinion, would you work there", "a": "Give a short honest personal answer, then link it to the analysis: \"The flexibility is attractive, but the unpredictable pay and penalties would worry me, which is exactly what our recommendations address.\"", "id": "21.24"}, {"s": 21, "q": "What role do trade unions play in this situation?", "k": "unions, labour groups, collective action", "a": "Couriers organised the strike without a formal employer-recognised union. Labour groups like Hong Kong Labour Rights Monitor raise their issues publicly. Our courier forum idea gives couriers a voice without needing a union.", "id": "21.25"}, {"s": 21, "q": "What about employee discipline and ethics as a course topic?", "k": "discipline topic, ethics topic, employee discipline", "a": "It's built into our third issue. Automatic deductions are discipline without due process, and our grievance team adds the fair, step-by-step process the course recommends.", "id": "21.26"}, {"s": 21, "q": "You didn't define the theories. Why?", "k": "no definitions, why not define, explain theory", "a": "The brief asks us not to define theories but to apply them, so we focused on how each concept shows up at KeeTa. Happy to explain any concept if you'd like.", "id": "21.27"}, {"s": 21, "q": "What if the lecturer asks something we didn't prepare for?", "k": "unprepared, don't know answer, no answer, unexpected question", "a": "Pause, repeat the question in your own words, and answer from the closest finding: pay, safety or performance. Say what you know, then what you'd check: \"We didn't find data on that, but we'd measure it in the pilot.\" Never guess a number.", "id": "21.28"}, {"s": 21, "q": "How is your analysis different from just criticising KeeTa?", "k": "just criticism, negative, constructive", "a": "Every issue includes KeeTa's strengths, and every recommendation keeps them: the algorithm, flexible hours, insurance and consistent records. We add a human layer to fix the gaps, with business benefits for KeeTa.", "id": "21.29"}, {"s": 21, "q": "What's the business case in one line?", "k": "business case, why should KeeTa care", "a": "Fewer strikes, fewer accidents and lower turnover protect KeeTa's service at peak hours, and acting early prepares it for new platform-worker law.", "id": "21.30"}, {"s": 21, "q": "If you could add one more recommendation, what would it be?", "k": "fourth recommendation, extra recommendation, additional", "a": "A development path for couriers: senior courier, trainer, then hub or grievance-team roles. It would fix the growth factor, the one QWL gap our three recommendations don't fully cover.", "id": "21.31"}, {"s": 21, "q": "What did your group learn about HRM from this case?", "k": "learning, lessons learned, takeaway for students", "a": "That HR principles don't disappear when software takes over. Fair pay, safe job design and fair review still decide whether workers stay, stay safe and trust the company.", "id": "21.32"}, {"s": 21, "q": "Isn't this really a legal problem rather than HR?", "k": "legal not HR, law problem", "a": "The law sets the minimum, but couriers' problems happened inside the law. HRM decides what a company does above the legal minimum, and that's where KeeTa can improve.", "id": "21.33"}, {"s": 21, "q": "Are you being unrealistic about what a profit-making company will do?", "k": "unrealistic, idealistic, too ambitious", "a": "Every recommendation has a business benefit, starts with a small pilot, and uses tools KeeTa already has. That's what makes it realistic for a profit-making company.", "id": "21.34"}, {"s": 21, "q": "Can you compare your recommendations by cost and impact?", "k": "rank recommendations, cost impact comparison, prioritise", "a": "Recommendation two is lowest cost and quickest. Recommendation three is medium cost with high fairness impact. Recommendation one costs most but has the biggest impact, because pay caused the strike.", "id": "21.35"}, {"s": 21, "q": "Where in your presentation do you use job analysis?", "k": "where job analysis, which slide job analysis", "a": "On slide 11, where we show KeeTa skips job analysis, hazard identification, SOPs and training for couriers, and on slide 16, where recommendation two adds the missing riding SOP and training.", "id": "21.36"}, {"s": 21, "q": "Where in your presentation do you use recruitment and selection?", "k": "where recruitment, which slide recruitment", "a": "On slide 9, the labour-surplus grid and the strength that flexible hours help recruitment, and on slide 15, where lower turnover cuts recruiting costs. It isn't one of our three main topics, but we apply its tools.", "id": "21.37"}, {"s": 21, "q": "Where in your presentation do you use performance management?", "k": "where performance management, which slide performance", "a": "Slides 12 and 13 analyse it, with the cycle, SMART, appraisal errors and equitable justice, and slide 17 fixes it with the grievance team.", "id": "21.38"}, {"s": 21, "q": "Where in your presentation do you use training and development?", "k": "where training, which slide training", "a": "Slide 11 shows the missing safety training and the training needs analysis. Slide 16 adds a riding-safety module to onboarding.", "id": "21.39"}, {"s": 21, "q": "Where in your presentation do you use compensation and benefits?", "k": "where compensation, which slide pay", "a": "Slides 7 to 9 analyse pay with the four-layer model, the surplus grid and QWL fair pay. Slide 15 is the hybrid compensation floor.", "id": "21.40"}, {"s": 21, "q": "Where in your presentation do you use OSH?", "k": "where safety, which slide OSH", "a": "Slides 10 and 11 analyse hazards and the missing safety steps. Slide 16 is the safer dispatch design.", "id": "21.41"}, {"s": 21, "q": "Where in your presentation do you use discipline and ethics?", "k": "where discipline, which slide ethics", "a": "Slide 13 on equitable justice and due process, slide 17's grievance team as a fair disciplinary process, and slide 19 on social responsibility.", "id": "21.42"}, {"s": 21, "q": "Where in your presentation do you use QWL?", "k": "where QWL, which slide QWL", "a": "Throughout: fair pay on slide 9, security and health and safety on slide 11, equitable justice on slide 13, and the full eight-factor scorecard on slide 14.", "id": "21.43"}, {"s": 21, "q": "Which course concept is most important to your analysis?", "k": "most important concept, key theory", "a": "The Quality of Work Life framework, because it ties all three issues together in one scorecard and shows exactly which gaps our recommendations close.", "id": "21.44"}, {"s": 21, "q": "Which course topics did you not use, and why?", "k": "topics not used, missing topics", "a": "We used tools from every topic, but our three main topics are compensation, OSH and performance management. Recruitment, training and discipline appear as supporting tools, because the brief asks for two or three main topics.", "id":
