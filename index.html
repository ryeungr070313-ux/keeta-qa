<script type="application/json" id="data">{"slides": [{"n": 1, "t": "Title", "x": "deck design, photos, colours", "sp": "Roy", "bk": "Hussain"}, {"n": 2, "t": "Today's Roadmap", "x": "", "sp": "Roy", "bk": "Hussain"}, {"n": 3, "t": "KeeTa at a Glance", "x": "", "sp": "Joshua", "bk": "Roy"}, {"n": 4, "t": "Why Study KeeTa's HRM?", "x": "", "sp": "Joshua", "bk": "Roy"}, {"n": 5, "t": "How We Collected Information", "x": "", "sp": "Joshua", "bk": "Roy"}, {"n": 6, "t": "Couriers Are Contractors", "x": "", "sp": "Morris", "bk": "Maxton"}, {"n": 7, "t": "What Happened in May 2025", "x": "", "sp": "Morris", "bk": "Maxton"}, {"n": 8, "t": "KeeTa vs Foodpanda", "x": "", "sp": "Maxton", "bk": "Roy"}, {"n": 9, "t": "Compensation: Course Concepts", "x": "also recruitment, AIDA, selection", "sp": "Maxton", "bk": "Roy"}, {"n": 10, "t": "Hazards Built into Dispatch", "x": "", "sp": "Sunny", "bk": "Hussain"}, {"n": 11, "t": "Safety: Course Concepts", "x": "also training, ADDIE, onboarding", "sp": "Hussain", "bk": "Roy"}, {"n": 12, "t": "Software as the Supervisor", "x": "", "sp": "Sunny", "bk": "Roy"}, {"n": 13, "t": "Performance: Course Concepts", "x": "", "sp": "Roy", "bk": "Hussain"}, {"n": 14, "t": "QWL Scorecard", "x": "", "sp": "Hussain", "bk": "Roy"}, {"n": 15, "t": "Rec 1: Hybrid Compensation Floor", "x": "", "sp": "Hussain", "bk": "Roy"}, {"n": 16, "t": "Rec 2: Safer Dispatch Design", "x": "", "sp": "Maxton", "bk": "Roy"}, {"n": 17, "t": "Rec 3: Human Grievance Team", "x": "", "sp": "Oscar", "bk": "Hussain"}, {"n": 18, "t": "Costs vs Value", "x": "", "sp": "Oscar", "bk": "Hussain"}, {"n": 19, "t": "Conclusion", "x": "", "sp": "Roy", "bk": "Hussain"}, {"n": 20, "t": "References", "x": "", "sp": "Roy", "bk": "Hussain"}, {"n": 21, "t": "Thank You", "x": "big-picture challenges", "sp": "Roy or Hussain", "bk": "Maxton"}], "items": [{"id": "1.1", "s": 1, "q": "What does \"algorithmic precarity\" mean?", "a": "Precarity means insecure, unpredictable work and income. \"Algorithmic\" means the insecurity comes from the app's rules rather than from a human manager. That's why it's our title.", "k": "title meaning, what does your title mean, explain the title, precarity meaning"}, {"id": "1.2", "s": 1, "q": "Isn't precarity just another word for low pay?", "a": "No. Precarity also covers unpredictable income, no protection when injured, and an insecure status. A courier can earn decently one month and lose it the next because of a rule change.", "k": "precarity vs low pay, is it only about money"}, {"id": "1.3", "s": 1, "q": "Where did your photos come from?", "a": "They're AI-generated illustrations of Hong Kong delivery scenes, used only as visuals. They don't show real KeeTa couriers or use KeeTa's logo.", "k": "images, pictures, AI images, are the photos real, source of photos"}, {"id": "1.4", "s": 1, "q": "Why did you choose yellow and green on a dark background?", "a": "Yellow and green are KeeTa's official brand colours, from its visual identity guidelines. The dark background keeps the slides easy to read and makes the key numbers stand out.", "k": "colour scheme, design choice, dark mode, why yellow"}, {"id": "1.5", "s": 1, "q": "Why is there no chart or graph of data?", "a": "KeeTa doesn't publish courier data like pay over time or accident rates, and we didn't want to invent numbers. So we used real figures as big callouts, and diagrams for the theory.", "k": "no graphs, no data visualisation, why no statistics"}, {"id": "1.6", "s": 1, "q": "Did you use AI tools to make this presentation?", "a": "Answer this honestly, based on what your group actually used. If AI helped with design, images or checking, say so plainly, and that the analysis and decisions are the group's own. Check HKMU's AI-use rules before the presentation.", "k": "ChatGPT, artificial intelligence used, AI generated, AI help"}, {"s": 1, "q": "What is algorithmic management?", "k": "define algorithmic management, managed by an app, management by algorithm, what does algorithm mean here", "a": "It means software does the jobs a manager normally does: giving out work, setting deadlines, tracking performance and applying rewards or penalties. At KeeTa the app decides which courier gets which order, how long they have, and what happens if they're late. That's why we treat the app as KeeTa's HR system.", "id": "1.7"}, {"s": 1, "q": "What is the gig economy, and is KeeTa part of it?", "k": "platform economy, gig work, gig workers, platform work, sharing economy", "a": "The gig economy is work done task by task through an app, usually by people treated as independent contractors, not employees. KeeTa is a clear example: couriers log in when they want and are paid per order. That flexibility is real, but so is the insecurity, which is what our title calls precarity.", "id": "1.8"}, {"s": 1, "q": "How does HRM apply to a company that doesn't treat couriers as employees?", "k": "HRM for contractors, why HRM if not employees, no HR department for couriers, is it really HRM", "a": "The HR functions still happen; they're just done by the app. Someone still sets pay, assigns work, judges performance and decides on penalties. Those are compensation, job design and performance management decisions, so course concepts apply even without an employment contract.", "id": "1.9"}, {"s": 1, "q": "Who is the audience for your recommendations?", "k": "who are you advising, who would read this, who is the target, KeeTa management", "a": "KeeTa's Hong Kong management, especially the people running operations and HR. We wrote the recommendations as an HR consultant would: each one names the problem, the action and the business benefit for KeeTa.", "id": "1.10"}, {"s": 1, "q": "Why did you start with a show of hands?", "k": "opening question, audience interaction, hook, why ask who ordered KeeTa", "a": "To connect the topic to everyday life. Most people in the room have ordered food from KeeTa, so the couriers we discuss are the people who bring their food. It makes the HR issue feel real rather than abstract.", "id": "1.11"}, {"s": 1, "q": "Did you use KeeTa's logo or brand materials? Is that allowed?", "k": "copyright, brand guidelines, logo permission, KeeTa colours trademark", "a": "We used KeeTa's brand colours for the design, from its public brand guidelines, but our photos don't show KeeTa's logo or real couriers. This is an academic presentation, not a commercial use, and we don't claim any link with KeeTa.", "id": "1.12"}, {"s": 1, "q": "How did your group divide the work?", "k": "teamwork, group roles, who did what, collaboration, contribution", "a": "Answer with what your group actually did. A simple honest version: each speaker researched and drafted the slide they present, one or two members checked facts and references, and we rehearsed together to keep the timing under 20 minutes.", "id": "1.13"}, {"s": 1, "q": "Did you have any disagreements as a group, and how did you solve them?", "k": "group conflict, teamwork problems, disagreement, decision making in group", "a": "Answer honestly from your group's experience. A good structure: name one real disagreement (for example, which three topics to choose or how harsh the QWL score should be), say how you settled it (evidence first, then a vote), and what you learned.", "id": "1.14"}, {"s": 1, "q": "How long is your presentation?", "k": "timing, 20 minutes, time limit, did you go over time", "a": "About 19 minutes, inside the brief's 20-minute limit, which doesn't include Q&A. We timed each speaker's part during rehearsal.", "id": "1.15"}, {"s": 1, "q": "What does precarious work look like for a courier day to day?", "k": "insecure work example, daily life of courier, precarity example", "a": "Not knowing what you'll earn today, because fees and priority can change overnight. Paying for your own scooter and phone. Having no paid leave or sick pay, and no clear protection if you're injured. And being penalised by the app with no one to explain the penalty to.", "id": "1.16"}, {"s": 1, "q": "Why did you choose this topic instead of a more traditional company like a hotel?", "k": "why not hotel, why not McDonald's, why platform company, unusual choice", "a": "Because it's a live, well-documented HR problem with a strike, court cases and new government policy. It also tests the course in a new setting: we wanted to show that HR concepts still matter when the manager is an app.", "id": "1.17"}, {"s": 1, "q": "What is the main point of slide 1?", "k": "summarise slide 1, slide 1 main point, explain title slide", "a": "It names our topic: KeeTa manages couriers through an algorithm, and that has made their work precarious. It also sets the course link: we analyse it with Human Resources Management concepts.", "id": "1.18"}, {"id": "2.1", "s": 2, "q": "Why does one person open and close?", "a": "It gives the presentation a clear frame. The conclusion repeats the opening message, so no new information appears at the end.", "k": "same speaker opening and closing, why speaker 1 twice, why Roy twice, why does Sunny speak twice, why do speakers alternate"}, {"id": "2.2", "s": 2, "q": "Is a 20-minute presentation enough to cover all this properly?", "a": "We focused on three issues with the strongest evidence and kept each to the key points. The full detail and references are in our written report.", "k": "enough time, too short, time limit, 20 minutes enough"}, {"s": 2, "q": "Why are there seven speakers?", "k": "number of speakers, group size, everyone speaks", "a": "The brief asks for groups of six to seven and a group presentation, so every member presents. We matched each part to one speaker so each person owns their section and its questions.", "id": "2.3"}, {"s": 2, "q": "Why do some speakers talk longer than others?", "k": "uneven time, speaker time split, why does speaker 6 talk more, why does Hussain talk more, why does Roy talk more, why does Maxton talk more", "a": "We gave the hardest theory and recommendation slides, which carry the most analysis marks, to the members most confident in English. Everyone still has a real section of about two minutes or more, and every speaker covers at least one complete slide.", "id": "2.4"}, {"s": 2, "q": "Is there a written report as well?", "k": "report, word count, 2000 words, written submission", "a": "Yes. The brief asks for a written report of up to 2,000 words with full APA references, due later in the term. The presentation covers the same structure: introduction, method, findings, recommendations and conclusion.", "id": "2.5"}, {"s": 2, "q": "Why is the presentation in this order?", "k": "structure, flow, order of slides, why this sequence", "a": "It follows the brief: introduction, research method, findings, recommendations, conclusion. Within the findings we go pay, safety, then performance, and each recommendation answers one finding in the same order, so it's easy to follow.", "id": "2.6"}, {"s": 2, "q": "What is the main point of slide 2?", "k": "summarise slide 2, roadmap point", "a": "It shows the structure and who presents what: introduction, method and worker status, three issues, QWL and three recommendations, feasibility and conclusion.", "id": "2.7"}, {"id": "3.1", "s": 3, "q": "Why did you choose KeeTa?", "a": "It fits the brief exactly: a Mainland China organisation, Meituan, running a profit-making business in Hong Kong. It also has a live, well-documented HRM problem, the May 2025 strike. And it's an unusual case, because the app does the jobs an HR department normally does.", "k": "why this company, why KeeTa, choice of organisation, pick company"}, {"id": "3.2", "s": 3, "q": "Is KeeTa really a profit-making organisation?", "a": "Yes. KeeTa is owned by Meituan, which is listed on the Hong Kong stock exchange and runs KeeTa as a commercial business. It used heavy subsidies to win customers, but it's a for-profit operation, not a charity or public body.", "k": "for-profit, commercial, profit-making requirement"}, {"id": "3.3", "s": 3, "q": "Is KeeTa really a Mainland organisation? It operates in Hong Kong.", "a": "Yes. KeeTa is the international delivery brand of Meituan, a Beijing-headquartered group listed in Hong Kong. That's the brief's second option: a Mainland organisation operating in Hong Kong.", "k": "Mainland or Hong Kong company, Chinese company, meet brief organisation"}, {"id": "3.4", "s": 3, "q": "What is KeeTa's vision?", "a": "Meituan publishes a mission, \"We help people eat better, live better\", and four values. We didn't find a separate published vision, so we used the mission as the guiding statement. We didn't want to invent one.", "k": "vision statement, no vision, mission instead of vision"}, {"id": "3.5", "s": 3, "q": "How do Meituan's values connect to your analysis?", "a": "\"Win-win cooperation\" is the clearest link: the strike shows couriers don't feel they're winning. \"Integrity\" connects to pay changes made without consultation. And \"customer-centric\" explains the punctuality guarantee, which passes time pressure onto couriers.", "k": "values link, company values analysis, win-win"}, {"id": "3.6", "s": 3, "q": "How many couriers does KeeTa have in Hong Kong?", "a": "We didn't find a reliable official figure, so we didn't put one on the slides. What we know is the scale of the business: about 43% of food delivery orders in Q1 2024.", "k": "number of couriers, how many riders, fleet size, workforce size"}, {"id": "3.7", "s": 3, "q": "Is the 43% figure still accurate?", "a": "It's a snapshot of order share in Q1 2024, from Measurable AI. Since then Deliveroo has left Hong Kong, so the market is now mainly KeeTa and Foodpanda. If anything, KeeTa's position is stronger.", "k": "market share accuracy, outdated figure, 43 percent"}, {"id": "3.8", "s": 3, "q": "Why mention Deliveroo's exit?", "a": "With one fewer platform, couriers have fewer places to work. That lowers their bargaining power. It also explains why Foodpanda is our comparison.", "k": "Deliveroo left, Deliveroo exit, why mention Deliveroo"}, {"s": 3, "q": "When did KeeTa launch in Hong Kong?", "k": "launch date, start, founded, how long has KeeTa been in Hong Kong, May 2023", "a": "May 2023. By the first quarter of 2024, less than a year later, it handled about 43% of Hong Kong food delivery orders, according to Measurable AI.", "id": "3.9"}, {"s": 3, "q": "What is Measurable AI?", "k": "source of 43%, who measured market share, data company", "a": "A market-data company that estimates platforms' order shares from consumer transaction data. We used its figure for KeeTa's order share in Q1 2024 and labelled the date on the slide.", "id": "3.10"}, {"s": 3, "q": "What is KeeTa's nature of business?", "k": "what does KeeTa do, business model, nature of business, industry", "a": "An online food and goods delivery platform. It connects three groups: customers who order, restaurants and shops that sell, and couriers who deliver. Its business depends on all three, which is why courier problems become business problems.", "id": "3.11"}, {"s": 3, "q": "How does KeeTa make money?", "k": "revenue model, profit, commission, delivery fee, business model income", "a": "Like other delivery platforms, it earns from commissions charged to restaurants and fees paid by customers. Courier pay is one of its biggest costs, which explains the pressure to cut fees, and why we show that our recommendations also save money.", "id": "3.12"}, {"s": 3, "q": "Where is KeeTa located?", "k": "location, headquarters, where based, Meituan headquarters", "a": "KeeTa operates across Hong Kong, delivering in districts throughout the city. Its parent, Meituan, is headquartered in Beijing and listed on the Hong Kong stock exchange.", "id": "3.13"}, {"s": 3, "q": "Who are KeeTa's main stakeholders?", "k": "stakeholders, who is affected, parties involved", "a": "Customers, restaurants and shops, couriers, Meituan's shareholders, and the Hong Kong government as regulator. The public is a stakeholder too, because courier safety affects other road users and pedestrians.", "id": "3.14"}, {"s": 3, "q": "Why did KeeTa grow so fast?", "k": "rapid growth, reasons for growth, subsidies, discounts, how did it gain market share", "a": "Heavy discounts and subsidies for customers, Meituan's strong technology, and a large flexible courier fleet recruited quickly through the app. That growth model is also why HR was handed to the algorithm.", "id": "3.15"}, {"s": 3, "q": "What's the difference between a mission and a vision?", "k": "mission vs vision, define mission, define vision", "a": "A mission says what the organisation does and why now; a vision describes where it wants to be in the future. Meituan publishes a mission, \"We help people eat better, live better\", and we didn't find a separate vision, so we used the mission rather than invent one.", "id": "3.16"}, {"s": 3, "q": "What do Meituan's values mean in HR terms?", "k": "customer-centric, win-win cooperation, integrity, striving for excellence, company values HR", "a": "Customer-centric means fast, reliable service. Win-win cooperation means partners, including couriers, should benefit too. Integrity means honest, transparent rules. Striving for excellence means always improving. Our analysis shows the first is met, while the courier side of the other three is weak.", "id": "3.17"}, {"s": 3, "q": "Is KeeTa profitable?", "k": "profit, making money, losses, financial performance", "a": "KeeTa doesn't publish separate Hong Kong accounts, so we don't claim a figure. It's a commercial business owned by a listed company, and it spent heavily on subsidies to grow, so controlling costs, including courier pay, matters to it.", "id": "3.18"}, {"s": 3, "q": "Does KeeTa only deliver food?", "k": "groceries, goods delivery, what products, food only", "a": "Mainly food, but it also delivers groceries and other goods from shops. Our analysis focuses on courier management, which is the same whatever is delivered.", "id": "3.19"}, {"s": 3, "q": "Who competes with KeeTa now?", "k": "competitors, rivals, market, Foodpanda, Deliveroo left", "a": "Mainly Foodpanda, since Deliveroo left Hong Kong in April 2025. That's why Foodpanda is our comparison on slide 8.", "id": "3.20"}, {"s": 3, "q": "Why does market share matter for an HR analysis?", "k": "why 43 percent, relevance of market share", "a": "It shows scale. With about 43% of orders, KeeTa's courier policies affect a large share of Hong Kong's delivery workers, so its HR choices shape the whole industry.", "id": "3.21"}, {"s": 3, "q": "What is the main point of slide 3?", "k": "summarise slide 3, glance point", "a": "Who KeeTa is: Meituan's Hong Kong delivery brand, launched in 2023, with about 43% of orders by Q1 2024, its mission and values, and Foodpanda as its main rival. It shows KeeTa fits the brief.", "id": "3.22"}, {"s": 3, "q": "Does KeeTa operate outside Hong Kong?", "k": "KeeTa overseas, international, other countries, Middle East", "a": "Meituan has started expanding the KeeTa brand beyond Hong Kong, including into the Middle East. Our analysis covers Hong Kong only, because laws and labour markets differ.", "id": "3.23"}, {"s": 3, "q": "What's the difference between Meituan and KeeTa?", "k": "Meituan vs KeeTa, parent company, brand", "a": "Meituan is the Mainland Chinese parent group, with its own delivery business in Mainland China. KeeTa is the brand it uses for food delivery in Hong Kong and some overseas markets.", "id": "3.24"}, {"s": 3, "q": "Have Meituan's couriers in Mainland China faced similar problems?", "k": "Mainland riders, trapped in the system, Meituan riders China", "a": "Yes. In 2020 a widely read Mainland report described delivery riders as \"trapped in the system\" by algorithms that kept cutting delivery times. The platforms responded by adding more time flexibility. It suggests KeeTa's issues come from the model, not just Hong Kong conditions.", "id": "3.25"}, {"s": 3, "q": "Who are KeeTa's couriers?", "k": "courier profile, demographics, who works as couriers, students, ethnic minorities", "a": "A mix of full-time riders, part-timers and students, including many ethnic minority workers. KeeTa doesn't publish a breakdown, so we don't give percentages.", "id": "3.26"}, {"s": 3, "q": "Can students or part-timers work as KeeTa couriers?", "k": "part-time couriers, students couriers", "a": "Generally yes, if they meet the sign-up requirements, which is part of the flexibility that helps KeeTa recruit. That's also why fair pay in quiet hours matters: many couriers work short, irregular sessions.", "id": "3.27"}, {"id": "4.1", "s": 4, "q": "Is this really an HR issue, or a business and technology issue?", "a": "Both, and that's our main argument. The algorithm sets pay, workload, deadlines and penalties. Those are HR decisions, so the app is effectively KeeTa's HR department.", "k": "HR or technology, business problem, is it HRM"}, {"id": "4.2", "s": 4, "q": "Why these three topics and not others from the list?", "a": "Each one matches a strike grievance. Pay cuts link to compensation, order-grabbing accidents link to safety, and deductions for lateness link to performance management. The brief asks for two or three topics, so we chose the three with the strongest evidence.", "k": "topic choice, why compensation safety performance, why three topics"}, {"id": "4.3", "s": 4, "q": "Why didn't you cover recruitment and selection?", "a": "KeeTa's recruitment is actually a strength: easy app sign-up and flexible hours bring in couriers quickly. The problems start after hiring, in pay, safety and performance, so that's where we focused.", "k": "recruitment not covered, why not recruitment"}, {"id": "4.4", "s": 4, "q": "Why is this relevant to us as HRM students?", "a": "More and more workers are managed by apps, not people. This case shows that course concepts like QWL and the performance management cycle still apply, even when there's no human HR team.", "k": "relevance to students, why should we care"}, {"id": "4.5", "s": 4, "q": "KeeTa has huge amounts of data. Why does managerial judgment still matter?", "a": "Data shows the past. It can't see a competitor leaving, a new law or a strike coming. That's the same reason we recommend human review: numbers need judgment.", "k": "big data, data driven, managerial judgement, numbers not enough"}, {"s": 4, "q": "What does \"KeeTa replaced human HR with an algorithm\" actually mean?", "k": "replaced HR, algorithm instead of managers, no human managers", "a": "For couriers, there's no supervisor who assigns shifts, coaches or reviews performance. The app does all of that automatically. KeeTa still has corporate staff, but couriers deal almost only with software.", "id": "4.6"}, {"s": 4, "q": "Does KeeTa have an HR department?", "k": "HR department, human resources team, HR staff", "a": "Yes, for its own employees, such as office and operations staff. Couriers are contractors, so they're managed through the app rather than by an HR team. That gap is what our third recommendation fills.", "id": "4.7"}, {"s": 4, "q": "Why did the strike happen in Tsuen Wan?", "k": "Tsuen Wan strike, where was the strike, why that district", "a": "Tsuen Wan is where the peak-hour incentive of HK$10 was removed completely, so couriers there were hit hardest. The strike on 10 May 2025 started there during the lunch and dinner rush.", "id": "4.8"}, {"s": 4, "q": "How many couriers went on strike?", "k": "size of strike, number of strikers, how big", "a": "Reports vary, so we don't quote a number. What matters for HRM is that it happened during peak hours and was organised around pay, safety and stable income.", "id": "4.9"}, {"s": 4, "q": "You also use job analysis and training. Aren't those extra topics beyond the three?", "k": "more than three topics, extra topics, job analysis training discipline topics", "a": "Our three topics are compensation, OSH and performance management. We use job analysis and training as tools inside the safety analysis, and discipline ideas inside performance management, because the course links them. They support the three topics rather than add new ones.", "id": "4.10"}, {"s": 4, "q": "What is the aim of your project?", "k": "purpose, objective, research question, what are you trying to find", "a": "To find the weaknesses in how KeeTa manages couriers through its app, using course concepts, and to recommend practical fixes that are good for couriers and for KeeTa's business.", "id": "4.11"}, {"s": 4, "q": "Why is performance management relevant if couriers are contractors?", "k": "performance management contractors, appraisal for contractors", "a": "Because KeeTa still measures, rates and penalises couriers every day. If you measure people and act on the results, you're doing performance management, whatever the contract says.", "id": "4.12"}, {"s": 4, "q": "What is the main point of slide 4?", "k": "summarise slide 4, why study point", "a": "KeeTa replaced human HR with an algorithm, which caused precarity and the May 2025 strike. We analyse three HRM issues, pay, safety and performance, to find weaknesses and practical fixes.", "id": "4.13"}, {"s": 4, "q": "What's special about the Hong Kong context?", "k": "Hong Kong context, local factors, why Hong Kong different", "a": "Very dense streets, tall estates where lifts can fail, frequent typhoons and rainstorms, hot summers, and a legal system where contractor status is still being tested in court. All of these make the courier job harder than in many cities.", "id": "4.14"}, {"id": "5.1", "s": 5, "q": "Why didn't you do primary research, like interviews?", "a": "KeeTa management was very unlikely to give students an interview, and interviewing couriers raises consent and safety issues during a labour dispute. There was also a lot of good public evidence: news reports, court rulings and academic studies. So secondary research gave us more reliable coverage in the time we had.", "k": "no interviews, no surveys, primary research missing"}, {"id": "5.2", "s": 5, "q": "Can you name some of the 15 papers?", "a": "Wood and colleagues (2019) on algorithmic control in gig work, Parent-Rocheleau and Parker (2022) on algorithms as work designers, Chen (2023) on job stress and risky riding, and Yu and colleagues (2023) on conservative delivery times. The full list is in our report.", "k": "name papers, which studies, academic sources examples"}, {"id": "5.3", "s": 5, "q": "Many studies are from Mainland China or overseas. Do they apply to Hong Kong?", "a": "We used overseas studies for the mechanism, for example, how time pressure leads to risky riding. For Hong Kong facts we used local sources: strike reports, the Labour Rights Monitor, Hong Kong court rulings, and Au-Yeung and colleagues (2024) on Hong Kong delivery workers.", "k": "overseas studies, international research, apply to Hong Kong, generalise"}, {"id": "5.4", "s": 5, "q": "How reliable are couriers' own claims?", "a": "That's our main limitation, so we cross-checked them. Courier accounts match news reports, Labour Rights Monitor findings and KeeTa's own public response. Where we only had couriers' reports, we say so, like the 10-minute delivery time.", "k": "courier claims reliable, trust couriers, one-sided sources"}, {"id": "5.5", "s": 5, "q": "How did you avoid being biased towards couriers?", "a": "We included KeeTa's side and its strengths: the HK$1 million insurance, fees shown before accepting, flexible hours and consistent records. We also presented the Deliveroo ruling, which supports platforms, not just the Zeek ruling.", "k": "bias, objective, balanced, neutral"}, {"id": "5.6", "s": 5, "q": "What would you do differently with more time?", "a": "A short anonymous survey of couriers at pick-up points, and a comparison with Foodpanda couriers. We'd also ask KeeTa for its HR view.", "k": "more time, future research, improve research"}, {"id": "5.7", "s": 5, "q": "What is Hong Kong Labour Rights Monitor?", "a": "An independent group that reports on workers' rights in Hong Kong. We used its report on the May 2025 KeeTa strike for the pay figures and couriers' demands.", "k": "Labour Rights Monitor, who is HKLRM, labour group"}, {"id": "5.8", "s": 5, "q": "Isn't Hong Kong Labour Rights Monitor biased towards workers?", "a": "It is a worker-rights group, so we didn't rely on it alone. We checked its claims against news reports, court rulings and KeeTa's own public response.", "k": "biased source, labour group bias"}, {"id": "5.9", "s": 5, "q": "How did you decide which facts to put on the slides?", "a": "Only facts we could find in at least one named source. When a number wasn't reliable, like the total number of couriers, we left it out.", "k": "choose facts, what to include"}, {"id": "5.10", "s": 5, "q": "Why cite an SSRN working paper?", "a": "Yu et al. (2023) hasn't been peer reviewed yet, so we treat it carefully. Its direction is supported by peer-reviewed studies on time pressure and risky riding, such as Chen (2023) and Zheng et al. (2022).", "k": "working paper, not peer reviewed, SSRN, Yu et al reliability"}, {"s": 5, "q": "What is the difference between primary and secondary research?", "k": "primary vs secondary, research types, define secondary research", "a": "Primary research collects new data yourself, like interviews or surveys. Secondary research uses data others have published, like studies, news and court rulings. Ours is secondary, which the brief allows.", "id": "5.11"}, {"s": 5, "q": "How did you choose the 15 papers?", "k": "selection of sources, literature search, criteria for papers, how many sources", "a": "We looked for empirical studies, meaning studies with real data, on platform work, algorithmic management, piece-rate pay and courier safety. We preferred recent, peer-reviewed work and kept papers that matched KeeTa's situation. Adjust this to the search tools your group actually used.", "id": "5.12"}, {"s": 5, "q": "What are the limitations of your research?", "k": "limitations, weaknesses of method, gaps in data", "a": "We couldn't interview KeeTa management or survey couriers ourselves, KeeTa doesn't publish courier data, and some figures come from couriers' reports. We reduced this by cross-checking sources and labelling reported figures clearly.", "id": "5.13"}, {"s": 5, "q": "Why didn't you use KeeTa's annual report?", "k": "annual report, company report, Meituan annual report, official data", "a": "KeeTa doesn't publish a separate Hong Kong annual report, and Meituan's group report doesn't cover Hong Kong courier pay or safety. So we used news, court rulings, labour-rights findings and academic studies instead.", "id": "5.14"}, {"s": 5, "q": "Did you contact KeeTa?", "k": "contact company, ask KeeTa, company response", "a": "Answer what your group actually did. If you didn't, say: \"We relied on KeeTa's public statements, like its response to the strike, because getting an interview with management during a labour dispute was unlikely in our timeframe.\"", "id": "5.15"}, {"s": 5, "q": "How do you know your news sources are reliable?", "k": "news reliability, media bias, trust news, credibility of sources, how did you make sure research is reliable, research reliability, are your sources reliable", "a": "We used established Hong Kong outlets and didn't rely on a single report. Where news, labour-rights findings and KeeTa's own statements agreed, we treated the fact as reliable. Where only couriers reported something, we said so.", "id": "5.16"}, {"s": 5, "q": "What does cross-checking mean in your research?", "k": "triangulation, verify, cross check, compare sources", "a": "Comparing the same fact across different kinds of sources. For example, the pay cuts appear in news reports, in the labour-rights findings and indirectly in KeeTa's own response, so we can trust them more than one courier's account.", "id": "5.17"}, {"s": 5, "q": "How recent are your sources?", "k": "dates of sources, old sources, up to date, outdated", "a": "The academic papers are mostly from 2019 to 2025, the strike reporting is from 2025, and the policy point comes from the 2026 Policy Address. The 43% market share is from Q1 2024, which we label on the slide.", "id": "5.18"}, {"s": 5, "q": "What was your research question?", "k": "research question, main question, what did you investigate", "a": "How does KeeTa's algorithm-based management affect couriers' pay, safety and performance management, and what practical HR changes would improve it?", "id": "5.19"}, {"s": 5, "q": "Why compare with only one other platform?", "k": "only Foodpanda, limited comparison, more competitors", "a": "Foodpanda is the only other major food delivery platform still in Hong Kong. Comparing with overseas platforms would mix in different laws and markets, so one local comparison is cleaner.", "id": "5.20"}, {"s": 5, "q": "What did the court rulings add to your research?", "k": "why legal sources, use of court cases", "a": "They show how Hong Kong courts actually judge courier status, so our point about legal risk rests on real decisions, not opinion. They also give both sides: one ruling for employees and one for contractors.", "id": "5.21"}, {"s": 5, "q": "What is the main point of slide 5?", "k": "summarise slide 5, method point", "a": "Our research is secondary, using five kinds of source: academic studies, news, labour-rights findings, court rulings and a platform comparison. Cross-checking them makes our findings more reliable.", "id": "5.22"}, {"s": 5, "q": "What assumptions did you make?", "k": "assumptions, realistic assumptions, assume", "a": "The brief allows realistic assumptions. Ours: courier reports in several sources are accurate; the HK$40 and HK$15 figures are illustrative; one active hour has about two orders in our example; and KeeTa could build the app changes with its existing technology.", "id": "5.23"}, {"s": 5, "q": "What's the source for each number on your slides?", "k": "sources for numbers, where figures come from, citations for numbers", "a": "43%: Measurable AI, Q1 2024. Pay cuts, HK$45 demand and the 10 May strike: news reports and Hong Kong Labour Rights Monitor. 20 to 30% K GO cut and 10-minute times: couriers' accounts in 2025 reporting. HK$1 million insurance: KeeTa's April 2025 announcement as reported. HK$43.1: Hong Kong's statutory minimum wage. ETA buffer: Yu et al. (2023).", "id": "5.24"}, {"s": 5, "q": "Where does the HK$1 million insurance figure come from?", "k": "source insurance, HK$1 million source", "a": "From KeeTa's April 2025 announcement that it upgraded courier accident insurance cover to HK$1 million, as reported in the news and repeated in its strike response.", "id": "5.25"}, {"s": 5, "q": "Where does the 20 to 30% figure for K GO come from?", "k": "source K GO percentage, 20-30 percent source", "a": "From couriers' accounts reported in 2025 coverage of the pay changes. We present it as a reported range, not an official KeeTa figure.", "id": "5.26"}, {"id": "6.1", "s": 6, "q": "Why are KeeTa couriers treated as contractors?", "a": "KeeTa's agreements treat couriers as independent service providers. They choose when to log in, use their own scooters and phones, and pay their own running costs. That's the usual platform model in Hong Kong.", "k": "contractor reason, why not employees, independent contractors"}, {"id": "6.2", "s": 6, "q": "What exactly do couriers lose by not being employees?", "a": "Under the Employment Ordinance, Cap. 57, they miss out on things like the statutory minimum wage, paid annual leave, sick pay and statutory holidays. They also get no employer MPF contributions. And work-injury cover under the Employees' Compensation Ordinance doesn't clearly apply, which is why KeeTa's own insurance matters.", "k": "lose rights, no benefits, missing protections, what they miss"}, {"id": "6.3", "s": 6, "q": "Do contractors really get no MPF?", "a": "Self-employed people in Hong Kong must join MPF, but they pay it themselves. What couriers miss is the employer's 5% contribution. That's what \"no MPF\" on the slide means.", "k": "MPF contractors, self-employed MPF"}, {"id": "6.4", "s": 6, "q": "Can you explain the Zeek ruling?", "a": "In 2023, the Labour Tribunal found six Zeek couriers were employees. The reasons were that the platform's software was central to the business, Zeek controlled how they worked, they couldn't pass work to someone else, and their pay depended on how much work they did.", "k": "Zeek case, Labour Tribunal 2023"}, {"id": "6.5", "s": 6, "q": "Can you explain the Deliveroo ruling?", "a": "In 2024, the District Court found a Deliveroo rider was a contractor (Gurung v Deliveroo). He could accept or reject orders, delegate deliveries, work for competitors, used his own vehicle and bore his own costs.", "k": "Deliveroo case, District Court 2024, Gurung"}, {"id": "6.6", "s": 6, "q": "So are KeeTa couriers employees or contractors?", "a": "No court has ruled on KeeTa. Our view is that KeeTa's dispatch control, penalties and K GO priority look closer to the control in the Zeek case, so the risk is real. We don't claim they are employees, only that KeeTa's model carries legal risk.", "k": "employee or contractor, legal status, worker status, are couriers employees, are they employees, are couriers employees, employees or not"}, {"id": "6.7", "s": 6, "q": "How do Hong Kong courts decide employee or contractor?", "a": "They look at the whole picture: who controls the work, whether the worker can delegate, who owns the equipment, who takes the financial risk, and how integrated the worker is in the business. No single factor decides it.", "k": "legal test, control test, how courts decide, multiple factors"}, {"id": "6.8", "s": 6, "q": "The District Court is higher than the Labour Tribunal. Doesn't the Deliveroo ruling win?", "a": "The District Court ruling is the stronger precedent, but each case depends on its facts. Deliveroo riders could delegate and reject orders freely. KeeTa's priority system and penalties show more control, so a court could see it differently. That uncertainty is the legal risk.", "k": "higher court, precedent, which ruling wins"}, {"id": "6.9", "s": 6, "q": "Should KeeTa just make all couriers employees?", "a": "We don't recommend that. Many couriers value flexible hours, and full employment would raise costs sharply. Our pay floor is a middle path: it adds protection without turning couriers into hourly employees.", "k": "make them employees, hire as staff, employment"}, {"id": "6.10", "s": 6, "q": "Couldn't KeeTa just give couriers more freedom so they stay contractors?", "a": "Yes, that's one way to lower legal risk: let couriers decline orders without penalty and see full order details first. It would also improve their autonomy. That fits well with our recommendations.", "k": "more freedom, autonomy, stay contractors"}, {"id": "6.11", "s": 6, "q": "What is the government doing about platform workers?", "a": "The 2026 Policy Address says the government is preparing legislation to give food and goods delivery platform workers statutory work-injury compensation. The details are still being developed, so we only say it's coming, not exactly what it will require.", "k": "government action, regulation, legislation, policy address"}, {"id": "6.12", "s": 6, "q": "Why is the court disagreement important for HRM, not just law?", "a": "Employment status decides which HR duties a company has. If a court reclassified couriers, KeeTa would suddenly owe minimum wage, MPF and leave. Good HRM plans for that risk instead of waiting.", "k": "why court matters HR, legal status HR impact"}, {"id": "6.13", "s": 6, "q": "Is there an EEO or discrimination issue?", "a": "We didn't find evidence of discrimination, so we don't claim one. K GO is an equity issue, different pay for the same work, rather than discrimination by background. Many couriers are ethnic minorities, so KeeTa should make sure training and appeals are available in the languages they use.", "k": "discrimination, ethnic minority, equal opportunity, EEO"}, {"id": "6.14", "s": 6, "q": "Why did you place \"Couriers Are Contractors\" before the compensation issue?", "a": "Contractor status is the background to all three issues: it explains why there's no minimum wage or MPF, no clear safety duty and no formal appraisal. It isn't one of the brief's topic areas, so we used it as context, not a fourth issue.", "k": "slide order, background slide, why contractors first"}, {"id": "6.15", "s": 6, "q": "What happens to MPF if couriers are reclassified as employees?", "a": "KeeTa could owe MPF contributions, and possibly back-payments. That's a big hidden financial risk in the current model.", "k": "reclassification MPF, back pay, financial risk"}, {"s": 6, "q": "What is the Employment Ordinance?", "k": "Cap. 57, employment law, Hong Kong employment law, what is Cap 57", "a": "Hong Kong's main employment law. It gives employees rights like statutory holidays, paid annual leave, sick pay and protection against unfair dismissal, and the Minimum Wage Ordinance sets the wage floor. Because KeeTa treats couriers as contractors, they fall outside it.", "id": "6.16"}, {"s": 6, "q": "What is the MPF?", "k": "Mandatory Provident Fund, retirement fund, pension, what is MPF, explain MPF", "a": "Hong Kong's Mandatory Provident Fund, a compulsory retirement savings scheme. For employees, both employer and employee contribute 5% of relevant income, up to a monthly cap. Self-employed people must contribute too, but there's no employer share, and that's what couriers miss.", "id": "6.17"}, {"s": 6, "q": "What is the Employees' Compensation Ordinance?", "k": "Cap. 282, work injury compensation, injury law", "a": "The law that makes employers compensate employees injured at work. Contractors aren't clearly covered, which is why KeeTa's own accident insurance, and the planned work-injury legislation for platform workers, matter.", "id": "6.18"}, {"s": 6, "q": "What is Zeek?", "k": "Zeek company, Zeek platform, who is Zeek", "a": "A Hong Kong delivery and logistics platform. In 2023 the Labour Tribunal found six of its couriers were employees, because the platform controlled their work and pay. It's the ruling closest to KeeTa's level of control.", "id": "6.19"}, {"s": 6, "q": "What is bogus self-employment?", "k": "false self-employment, disguised employment, misclassification", "a": "When a company treats workers as self-employed even though, in practice, it controls them like employees. That avoids employer duties like MPF and leave. We don't say KeeTa is doing this; we say its level of control creates that legal risk.", "id": "6.20"}, {"s": 6, "q": "Why do platforms prefer to use contractors?", "k": "why contractors, benefits for platform, cost saving, flexibility for company, freelancers, why use freelancers, companies use contractors", "a": "It's cheaper and more flexible. There's no MPF contribution, paid leave or minimum wage duty, and the platform can grow or shrink its fleet instantly. The trade-off is that couriers carry the risk, which leads to the problems we found.", "id": "6.21"}, {"s": 6, "q": "Do couriers prefer being contractors?", "k": "courier preference, want flexibility, want to be employees", "a": "Many value the flexibility to choose their hours and work for more than one app. What they asked for in the strike was stable income and safety, not necessarily employment. Our recommendations keep the flexibility and add protection.", "id": "6.22"}, {"s": 6, "q": "Can KeeTa couriers work for Foodpanda at the same time?", "k": "multi-apping, work for rivals, two apps", "a": "Many couriers reportedly use more than one app. That freedom is one factor courts see as pointing towards contractor status, as in the Deliveroo case. It's also why fair pay matters: couriers can easily switch platforms.", "id": "6.23"}, {"s": 6, "q": "Won't your recommendations, like training and appeals, give KeeTa more control and make couriers look like employees?", "k": "legal risk of recommendations, more control employee status, training makes them employees, SOP control", "a": "It's a fair concern. Safety rules and a fair appeal process are like conditions any client sets, and they reduce arbitrary control rather than add it. Couriers would still choose their hours and could still work for rivals. KeeTa should still take legal advice, and new platform-worker rules are coming anyway.", "id": "6.24"}, {"s": 6, "q": "Could KeeTa couriers take KeeTa to court?", "k": "lawsuit, sue KeeTa, legal action", "a": "In principle, yes: a courier could claim employee status at the Labour Tribunal, like the Zeek couriers did. That's the legal risk we highlight. The outcome would depend on how much control the court found.", "id": "6.25"}, {"s": 6, "q": "What does \"Cap.\" mean, like Cap. 57?", "k": "chapter number, Cap meaning", "a": "It stands for \"Chapter\", the number of the law in Hong Kong's official list of legislation. Cap. 57 is the Employment Ordinance.", "id": "6.26"}, {"s": 6, "q": "What are the main differences between an employee and a contractor?", "k": "employee vs contractor, differences, rights of employees", "a": "An employee works under the employer's control and gets statutory rights like minimum wage, MPF contributions and paid leave. A contractor runs their own business, controls how they work, can usually delegate or work for others, and carries their own costs and risks.", "id": "6.27"}, {"s": 6, "q": "Why did the Zeek and Deliveroo cases end differently?", "k": "different rulings, why courts disagree, Zeek vs Deliveroo", "a": "Different facts. Zeek controlled couriers' routes and pay, and they couldn't pass work to others. The Deliveroo rider could reject orders, delegate deliveries and work for rivals. Courts weigh the whole picture, so control decides it.", "id": "6.28"}, {"s": 6, "q": "Which ruling is KeeTa closer to, and why?", "k": "KeeTa closer to Zeek, which case applies", "a": "Closer to Zeek, in our view, because KeeTa controls dispatch, deadlines, priority and penalties. But couriers can also work for other apps, which points the other way. That mix is why we call it a legal risk, not a certainty.", "id": "6.29"}, {"s": 6, "q": "What is the main point of slide 6?", "k": "summarise slide 6, contractors point", "a": "KeeTa couriers are contractors, so they miss employee protections like minimum wage, MPF and paid leave. Courts disagree on platform workers' status, and KeeTa's control looks more like Zeek, which creates legal risk.", "id": "6.30"}, {"s": 6, "q": "What if KeeTa made all couriers employees tomorrow?", "k": "employees tomorrow, convert to employees, hypothetical employment", "a": "Costs would jump through MPF, leave and minimum wage, and KeeTa would likely cut flexibility and the number of couriers. Many part-timers could lose work. That's why we prefer a middle path: protection without full employment.", "id": "6.31"}, {"s": 6, "q": "What if the government passes a law setting minimum pay for platform workers?", "k": "platform minimum pay law, legislation pay", "a": "Then KeeTa would already have the structure in place. Our pay floor makes it easier to comply with any new rule, which is one of the benefits we list.", "id": "6.32"}, {"id": "7.1", "s": 7, "q": "What exactly happened in the May 2025 strike?", "a": "On 10 May 2025, couriers in Tsuen Wan stopped deliveries during the lunch and dinner rush. They protested pay cuts, scrapped peak bonuses and the order-grabbing system, and asked for at least HK$45 an order. KeeTa said service continued, it respected peaceful expression, and it had upgraded insurance to HK$1 million.", "k": "strike details, what happened, 10 May strike, Tsuen Wan strike"}, {"id": "7.2", "s": 7, "q": "What were the exact pay cuts?", "a": "Reports say per-order fees fell from about HK$40–50 to the low HK$30s off-peak, double orders fell below HK$60, and the HK$10 peak bonus was removed in Tsuen Wan. One courier said he lost nearly HK$4,000 in a month.", "k": "pay cut amounts, how much cut, fee cut figures"}, {"id": "7.3", "s": 7, "q": "Why does the pay-cut slide say \"below HK$38\" instead of an exact number?", "a": "Fees vary by distance and time, and sources report ranges, so \"below\" is the accurate way to show it.", "k": "below HK$38, exact number, why ranges"}, {"id": "7.4", "s": 7, "q": "What is K GO?", "a": "A KeeTa scheme where couriers accept about 20–30% lower pay per order in exchange for getting orders first. Couriers who don't join get lower priority, especially for the longer, better-paid jobs.", "k": "K GO meaning, what is KGO, priority scheme"}, {"id": "7.5", "s": 7, "q": "Why do you call it a downward spiral?", "a": "Each courier feels pushed to join to keep getting orders. But as more join, the priority advantage shrinks, so everyone ends up on lower pay. It's a race to the bottom.", "k": "downward spiral, race to the bottom"}, {"id": "7.6", "s": 7, "q": "Isn't joining K GO voluntary?", "a": "On paper, yes. In practice, refusing means fewer and worse orders, so the choice isn't really free. That's why we treat it as a pay cut, not a perk.", "k": "K GO choice, optional, voluntary, forced"}, {"id": "7.7", "s": 7, "q": "Why did KeeTa cut pay?", "a": "KeeTa hasn't fully explained it. Our inference is cost: subsidies are expensive, and with Deliveroo leaving there was less competition for couriers, so KeeTa had more bargaining power. We present that as our reading, not a fact.", "k": "reason for pay cut, why reduce pay"}, {"id": "7.8", "s": 7, "q": "Did KeeTa admit cutting pay?", "a": "Not directly. KeeTa said pay varies with distance and other factors, and that it respects peaceful expression of opinions. So the cuts come from couriers' reports, which several sources agree on.", "k": "KeeTa response, admit, KeeTa statement"}, {"id": "7.9", "s": 7, "q": "Maybe the pay cuts were temporary, after subsidies ended. Why does it matter?", "a": "Even if temporary, cutting pay without consultation damaged trust and triggered a strike. The course point is about how pay changes are made, not only the amount.", "k": "temporary cut, subsidies ended"}, {"id": "7.10", "s": 7, "q": "How do you know the strike was about pay and not something else?", "a": "The couriers' own demands were a minimum of HK$45 per order, stable income and better safety. Pay came first, but safety was part of it too, which is why we cover both.", "k": "strike reason, cause of strike"}, {"id": "7.11", "s": 7, "q": "What did KeeTa do after the strike?", "a": "KeeTa said it respected peaceful expression and that services continued. It had upgraded courier insurance to HK$1 million the month before. We didn't find evidence that it reversed the pay changes, so we don't claim it did.", "k": "after strike, KeeTa reaction, response to strike"}, {"id": "7.12", "s": 7, "q": "Do couriers earn more than minimum wage anyway?", "a": "In busy hours, often yes. In quiet hours they can earn far less, and they pay for fuel, phone and their scooter. The problem is unpredictability, not just the average.", "k": "above minimum wage, earn enough, income level"}, {"id": "7.13", "s": 7, "q": "How do the pay cuts link to turnover?", "a": "Lower and unpredictable pay pushes couriers to quit or switch to Foodpanda. KeeTa can track this with the turnover formula: leavers ÷ average number of couriers × 100.", "k": "pay and turnover, couriers quit"}, {"s": 7, "q": "What were couriers earning before the cuts?", "k": "pay before, old rate, previous fee", "a": "Reports say about HK$40 to 50 per order. After the cuts, off-peak fees fell to the low HK$30s and below HK$38, double orders fell below HK$60, and the HK$10 peak bonus in Tsuen Wan was removed.", "id": "7.14"}, {"s": 7, "q": "What is a double order?", "k": "two orders, stacked orders, double delivery", "a": "Two orders delivered by the same courier in one trip. Its fee fell below HK$60, so couriers do more work in one trip for less than two separate orders used to pay.", "id": "7.15"}, {"s": 7, "q": "What is the peak-hour incentive?", "k": "peak bonus, HK$10 bonus, rush hour incentive", "a": "An extra HK$10 per order during busy lunch and dinner hours. In Tsuen Wan it was removed entirely, which made couriers there the first to strike.", "id": "7.16"}, {"s": 7, "q": "What does dispatch priority mean?", "k": "priority, who gets orders first, order allocation", "a": "It decides which courier the app offers an order to first. Higher priority means more orders and better ones, like longer-distance jobs that pay more. Under K GO, couriers bought priority by accepting lower pay.", "id": "7.17"}, {"s": 7, "q": "What exactly did the striking couriers demand?", "k": "strike demands, what couriers wanted, HK$45, what did strikers want, what did couriers ask for, strikers demands", "a": "At least HK$45 per order, a stable income, and better safety. They also protested the order-grabbing system. Those demands map directly onto our three issues.", "id": "7.18"}, {"s": 7, "q": "Were the pay cuts legal?", "k": "legal pay cut, can KeeTa change pay, contract change", "a": "Yes, as far as we know. Contractors aren't covered by the Minimum Wage Ordinance, and the platform sets its own fee terms. That's exactly why it's an HRM problem: the law didn't stop it, but the pay design still caused a strike.", "id": "7.19"}, {"s": 7, "q": "Is K GO still running today?", "k": "K GO now, current status of K GO", "a": "We report the scheme as described in 2025 sources. We didn't find a public announcement that it was scrapped, but we don't claim its current details.", "id": "7.20"}, {"s": 7, "q": "What is income precarity?", "k": "unstable income, unpredictable pay, income insecurity", "a": "Not knowing what you'll earn from one day to the next. For couriers it comes from piece-rate pay with no base, fees that change without notice, and priority that can be lost.", "id": "7.21"}, {"s": 7, "q": "How did the strike affect customers?", "k": "impact on customers, service disruption, strike effect business", "a": "Strikes at lunch and dinner peaks risk slower deliveries and cancelled orders. KeeTa said service continued, but even short disruptions show the business risk of poor courier relations.", "id": "7.22"}, {"s": 7, "q": "Why does it matter that couriers work longer hours?", "k": "longer hours, overwork, fatigue from pay cut", "a": "Longer hours mean more fatigue, and fatigue raises accident risk. So the pay issue feeds directly into the safety issue. That link is why our recommendations work as a package.", "id": "7.23"}, {"s": 7, "q": "What does K GO actually stand for?", "k": "K GO name, meaning of K GO", "a": "Our sources just call the scheme K GO, and we didn't find an official explanation of the name, so we describe what it does: lower pay per order in exchange for dispatch priority.", "id": "7.24"}, {"s": 7, "q": "Why is K GO described as \"pay-for-priority\"?", "k": "pay for priority meaning", "a": "Couriers effectively pay for priority by accepting 20 to 30% less per order. Priority, which should depend on location and reliability, is sold for lower pay.", "id": "7.25"}, {"s": 7, "q": "What is the main point of slide 7?", "k": "summarise slide 7, pay cuts point", "a": "In May 2025 KeeTa cut fees and removed peak incentives, and K GO traded lower pay for priority. The result is a downward spiral where couriers work longer just to cover costs.", "id": "7.26"}, {"s": 7, "q": "Were the strikers justified?", "k": "strike justified, was the strike right", "a": "We don't take sides on the strike itself. As HR analysts, our point is that it was predictable: sudden pay cuts without consultation are a high-suffering option that often leads to conflict.", "id": "7.27"}, {"s": 7, "q": "What if couriers strike again?", "k": "another strike, future strikes", "a": "That's exactly the risk our recommendations reduce. Without a pay floor and a fair process, repeated peak-hour strikes are likely, which hurts customers, restaurants and KeeTa's revenue.", "id": "7.28"}, {"s": 7, "q": "Are KeeTa couriers being exploited?", "k": "exploitation, exploited workers", "a": "We avoid that word because it's a moral judgment. We can say clearly that the current design shifts most income and safety risk onto couriers, and that our recommendations share that risk more fairly.", "id": "7.29"}, {"id": "8.1", "s": 8, "q": "How do you know Foodpanda's pay model?", "a": "From public descriptions of its distance-based fee with a fixed base. Foodpanda isn't perfect: its couriers also struck in 2021–22 (Chan, 2025). Our point is only that its model gives couriers more predictable earnings.", "k": "Foodpanda pay, source Foodpanda"}, {"id": "8.2", "s": 8, "q": "Why compare with Foodpanda and not another company?", "a": "Foodpanda is the only other major food delivery platform left in Hong Kong. It hires couriers in the same market, so it's the fairest comparison.", "k": "why Foodpanda, comparison choice"}, {"id": "8.3", "s": 8, "q": "What are a distance matrix and zone demand multipliers?", "a": "A distance matrix sets pay by distance bands, so longer trips pay more. Zone demand multipliers raise pay in busy areas or times. Both let couriers predict earnings before accepting.", "k": "distance matrix, zone multiplier, how Foodpanda pays"}, {"id": "8.4", "s": 8, "q": "Foodpanda couriers also went on strike in 2021. Isn't Foodpanda just as bad?", "a": "Foodpanda isn't perfect, and Chan (2025) studied those strikes. But after them, Foodpanda reached an agreement with couriers. Our point is narrower: its pay design gives couriers a predictable minimum. That shows a fairer design is possible in this market.", "k": "Foodpanda strike, Foodpanda bad too"}, {"s": 8, "q": "Does Foodpanda treat its riders as employees?", "k": "Foodpanda employees, Foodpanda contractors, Foodpanda status", "a": "No, Foodpanda riders are also treated as contractors. That's why the comparison is useful: same legal status, same market, but a pay design that gives riders a predictable minimum.", "id": "8.5"}, {"s": 8, "q": "Foodpanda has a lower market share. Doesn't that mean its model is worse?", "k": "Foodpanda losing, market share comparison, is Foodpanda worse business", "a": "Market share is driven mainly by customer prices and subsidies, not courier pay. We compare HR design, not business success. Foodpanda shows a fairer pay design can survive in the same market.", "id": "8.6"}, {"s": 8, "q": "What is batching?", "k": "batch orders, combining orders", "a": "Combining several orders into one trip, so a courier carries more than one delivery. Foodpanda uses batching with zone demand multipliers that raise pay in busy areas.", "id": "8.7"}, {"s": 8, "q": "Why does being able to predict minimum earnings matter so much?", "k": "predictability, why predictable pay matters, income certainty", "a": "Couriers can plan their hours and budget when they know the minimum they'll earn. Unpredictable pay pushes people into longer hours and riskier riding to be safe, and it makes them more likely to leave or strike.", "id": "8.8"}, {"s": 8, "q": "Doesn't Foodpanda also have problems with its couriers?", "k": "Foodpanda problems, Foodpanda not perfect, Foodpanda criticism", "a": "Yes, and we say so: its couriers struck in 2021, studied by Chan (2025). We don't present Foodpanda as perfect, only as proof that a predictable minimum is possible in this market.", "id": "8.9"}, {"s": 8, "q": "What does the slide mean by \"income precarity, turnover, strikes\" for KeeTa?", "k": "outcome row, KeeTa outcome, comparison outcome", "a": "It's the chain of results from KeeTa's pay design: unpredictable income leads couriers to leave or switch apps, and those who stay are more likely to protest, as in May 2025.", "id": "8.10"}, {"s": 8, "q": "What is the main point of slide 8?", "k": "summarise slide 8, Foodpanda point", "a": "Foodpanda, in the same market, gives couriers a predictable minimum through a distance matrix and base fee. KeeTa's pure piece-rate plus K GO doesn't, so the problem is KeeTa's design, not the industry.", "id": "8.11"}, {"s": 8, "q": "Does your analysis also apply to Foodpanda?", "k": "apply to Foodpanda, Foodpanda problems same", "a": "Partly. Foodpanda also uses algorithms and contractors, so safety and appraisal issues could apply. We focused on KeeTa because of its size, the May 2025 strike and its pure piece-rate model.", "id": "8.12"}, {"s": 8, "q": "What if Foodpanda copies your recommendations?", "k": "competitor copies, Foodpanda copies", "a": "That would raise standards across the industry, which is good for couriers. For KeeTa, moving first gives it the reputation advantage and helps it attract the best couriers.", "id": "8.13"}, {"id": "9.1", "s": 9, "q": "Explain the four-layer compensation model using KeeTa.", "a": "Base pay: none. Incentives: only the per-order fee. Benefits: only accident insurance. Perks: none. So KeeTa uses one and a half layers out of four.", "k": "four layer model, compensation layers, base incentive benefit perk"}, {"id": "9.2", "s": 9, "q": "Why does relying on one layer matter?", "a": "There's no buffer. Every fee cut goes straight into the courier's income, so pay feels unstable. That leads to dissatisfaction, turnover and, in May 2025, a strike.", "k": "one layer, no buffer, why layers matter"}, {"id": "9.3", "s": 9, "q": "Does KeeTa give any benefits at all?", "a": "Accident insurance, upgraded to HK$1 million in April 2025. There's no MPF, paid leave or sick pay.", "k": "benefits, insurance only, any benefits"}, {"id": "9.4", "s": 9, "q": "What perks could KeeTa realistically offer?", "a": "Low-cost ones: rest points with toilets and phone charging, discounted meals at partner restaurants, rain gear, or a mobile data subsidy. Perks are cheap but show couriers they're valued.", "k": "perks ideas, examples of perks"}, {"id": "9.5", "s": 9, "q": "Isn't piece-rate fair? You get paid for what you do.", "a": "Piece-rate is fine in principle because it rewards output. The problem is pure piece-rate, with KeeTa setting the rate alone and nothing underneath. All the risk of quiet hours, waiting and bad weather falls on the courier.", "k": "piece rate fair, paid per order fair"}, {"id": "9.6", "s": 9, "q": "What's the difference between piece-rate and salaried pay, and where does your hybrid fit?", "a": "Piece-rate pays per unit of output; salaried pay is fixed for time worked. Our hybrid sits between them: the hourly base gives security like a salary, and the per-order commission keeps the productivity of piece-rate.", "k": "piece rate vs salary, hybrid pay"}, {"id": "9.7", "s": 9, "q": "Which option from the labour-surplus grid should KeeTa have used instead?", "a": "KeeTa didn't have a surplus, so it didn't need any of them. If it had to cut costs, slower options like a hiring freeze or natural attrition cause far less suffering than pay reduction.", "k": "surplus grid, labour surplus options, pay reduction alternative"}, {"id": "9.8", "s": 9, "q": "After Deliveroo left, wasn't there actually a labour surplus?", "a": "That's a fair point, and it may explain why KeeTa felt able to cut pay. But even with a surplus, the grid shows pay cuts cause the most suffering. Gentler options, like a hiring freeze or natural attrition, would have avoided a strike.", "k": "labour surplus after Deliveroo, too many couriers"}, {"id": "9.9", "s": 9, "q": "Is the labour-shortage grid relevant too?", "a": "Yes. If pay cuts make couriers quit, KeeTa faces a shortage at peak hours. On the shortage grid, turnover reduction is the long-term option, and that's exactly what our pay floor aims for.", "k": "shortage grid, labour shortage"}, {"id": "9.10", "s": 9, "q": "How would job evaluation help KeeTa set a fair base rate?", "a": "Using a point method, KeeTa could score the courier job on skill, physical effort, responsibility and working conditions, like weather and traffic risk. Then it compares with similar jobs, such as logistics couriers, to set a fair rate.", "k": "job evaluation, fair base rate, point method"}, {"id": "9.11", "s": 9, "q": "How does market-rate alignment apply?", "a": "The course says pay below market leads to dissatisfaction and turnover. Couriers asked for at least HK$45 an order, and Foodpanda pays a base fee, so KeeTa's cuts pushed it below the market.", "k": "market rate, below market pay"}, {"id": "9.12", "s": 9, "q": "Is the problem external equity or internal equity?", "a": "Both. External: pay is less predictable than at Foodpanda. Internal: K GO creates two pay levels for the same work, depending on whether a courier joins.", "k": "equity type, internal external equity"}, {"id": "9.13", "s": 9, "q": "Which QWL principle do the pay cuts breach?", "a": "The equity principle and the fair pay factor. K GO also pays different rates for the same job, which breaks internal equity between couriers.", "k": "QWL pay, fair pay factor, equity principle pay"}, {"id": "9.14", "s": 9, "q": "You list \"fee shown before accepting\" as a strength. Why?", "a": "Couriers know what they'll earn for each order before they say yes. That transparency is good practice and we'd keep it.", "k": "strength pay, transparency, fee before accepting"}, {"id": "9.15", "s": 9, "q": "Describe KeeTa's recruitment using the five-step process.", "a": "1. Planning: forecast couriers needed by district and hour.\n2. Candidate pool: mostly online and through word of mouth.\n3. Screening: licence, identity and document checks in the app.\n4. Selection tools: very light, with no riding test.\n5. Offer: instant activation.\n\nWe'd add a short riding test at step 4 for safety.", "k": "recruitment process, five steps, how KeeTa recruits"}, {"id": "9.16", "s": 9, "q": "How could KeeTa use a replacement chart or skills inventory?", "a": "A skills inventory could record each courier's safety record, districts known and languages. A replacement chart could spot experienced couriers ready now to become trainers or join the grievance team.", "k": "replacement chart, skills inventory, succession"}, {"id": "9.17", "s": 9, "q": "KeeTa has a labour shortage at peak hours. Which shortage options fit?", "a": "Short term, incentives at peak work like overtime. Long term, turnover reduction is better, because keeping trained couriers is cheaper and safer than constantly recruiting new ones. That's what our recommendations aim for.", "k": "peak shortage, shortage options"}, {"id": "9.18", "s": 9, "q": "Use the AIDA model to write a recruitment message for KeeTa.", "a": "Attention: \"A guaranteed base for every active hour.\" Interest: \"Choose your own hours.\" Desire: \"Free safety training and HK$1 million insurance.\" Action: \"Sign up in the app today.\"", "k": "AIDA, job ad, recruitment advert"}, {"id": "9.19", "s": 9, "q": "How do the selection criteria apply to couriers?", "a": "A riding test and a short safety quiz would be valid, because they predict safe performance. They're reliable if scored the same way every time, low cost, and fair because they relate directly to the job.", "k": "selection criteria, selection test, riding test"}, {"s": 9, "q": "What's the difference between benefits and perks?", "k": "benefits vs perks, define perks, define benefits", "a": "Benefits are formal, usually costly protections like insurance, MPF or paid leave. Perks are smaller extras that make work easier or nicer, like rest areas or meal discounts. KeeTa has one benefit, accident insurance, and no perks.", "id": "9.20"}, {"s": 9, "q": "What's the difference between base pay and incentives?", "k": "base pay vs incentive, fixed vs variable pay, bonus vs salary", "a": "Base pay is guaranteed for time or the job itself. Incentives depend on output or results, like per-order fees and bonuses. KeeTa couriers get only incentives, so their income has no floor.", "id": "9.21"}, {"s": 9, "q": "What does \"one and a half layers\" mean?", "k": "one and a half layers, how many layers, layers KeeTa uses", "a": "Incentives are the one full layer: the per-order fee. Accident insurance is a partial benefits layer, because there's no MPF, leave or sick pay. Base pay and perks are missing.", "id": "9.22"}, {"s": 9, "q": "What is total rewards?", "k": "total rewards, total compensation, overall reward package", "a": "Everything a worker gets in return for their work: base pay, incentives, benefits and perks together, the four layers in our course. Looking at total rewards shows how thin KeeTa's package is.", "id": "9.23"}, {"s": 9, "q": "What is a labour surplus and a labour shortage?", "k": "define labour surplus, define labour shortage, too many workers, too few workers", "a": "A surplus means more workers than the work needs; a shortage means fewer. The course gives a grid of options for each. KeeTa used a surplus option, pay reduction, without having a surplus.", "id": "9.24"}, {"s": 9, "q": "Which surplus options are fast, and which cause the least suffering?", "k": "surplus grid speed suffering, downsizing, hiring freeze, attrition, early retirement", "a": "Downsizing and pay reduction are fast but cause high suffering. Demotion and transfer are in the middle. Hiring freeze, natural attrition, early retirement and retraining are slow but cause little suffering. KeeTa chose the fast, painful option.", "id": "9.25"}, {"s": 9, "q": "Why is pay reduction a high-suffering option?", "k": "pay cut suffering, why pay cuts hurt", "a": "Everyone loses income at once, with no choice, and people feel the deal has changed under them. That damages trust and motivation, which is why it often leads to conflict, as it did in May 2025.", "id": "9.26"}, {"s": 9, "q": "Could KeeTa have used work sharing or retraining instead?", "k": "work sharing, retraining, other surplus options", "a": "If there really were too many couriers, KeeTa could have capped active couriers per district at quiet times, like work sharing, or used natural attrition. Both protect pay per order while matching supply to demand.", "id": "9.27"}, {"s": 9, "q": "Which shortage options could KeeTa use at peak hours?", "k": "overtime, temp workers, outsourcing, external hires, tech innovation, shortage grid options", "a": "Overtime-style peak incentives are fast. External hires add couriers. Technology, like better batching, raises output per courier. Turnover reduction is the best long-term choice, because trained couriers are safer and cheaper to keep.", "id": "9.28"}, {"s": 9, "q": "Is KeeTa's algorithm an example of \"technological innovation\" on the shortage grid?", "k": "tech innovation, technology replaces staff, automation shortage", "a": "Yes, in a way. The algorithm lets KeeTa run a huge fleet with very few managers. Our point is that the technology replaced the human HR work too, including the parts that keep work fair and safe.", "id": "9.29"}, {"s": 9, "q": "Should KeeTa recruit couriers internally or externally?", "k": "internal vs external recruitment, courier recruitment source", "a": "Couriers are mostly external hires, recruited through the app and word of mouth. Internal recruitment fits the new roles we propose, like trainers or grievance team members, chosen from experienced couriers.", "id": "9.30"}, {"s": 9, "q": "What are reliability and validity in selection?", "k": "reliability, validity, selection criteria, define validity", "a": "Reliability means a test gives consistent results; validity means it actually predicts job performance. A short riding test is valid for couriers because it predicts safe riding, and reliable if everyone is scored the same way.", "id": "9.31"}, {"s": 9, "q": "What selection tools does KeeTa use now?", "k": "current selection, how KeeTa hires, screening couriers", "a": "Mainly document and identity checks in the app, with instant activation. That's fast and cheap, which helps recruitment, but there's no test of riding skill or safety knowledge.", "id": "9.32"}, {"s": 9, "q": "How does equity theory apply to KeeTa?", "k": "equity theory, Adams, fairness comparison, motivation theory pay", "a": "It's slightly beyond our course list, but it fits: people compare what they put in and get out with others. Under K GO two couriers doing the same delivery get different pay, so the one paid less feels unfairly treated and loses motivation.", "id": "9.33"}, {"s": 9, "q": "How does Herzberg's two-factor theory apply?", "k": "Herzberg, hygiene factors, motivators, motivation theory", "a": "Outside our main course concepts, but in short: pay and working conditions are hygiene factors. They don't motivate much when good, but cause strong dissatisfaction when poor. KeeTa's pay cuts and penalties are hygiene failures, which fits the strike.", "id": "9.34"}, {"s": 9, "q": "How does Maslow's hierarchy apply?", "k": "Maslow, hierarchy of needs, safety needs", "a": "Not one of our main concepts, but couriers' basic needs, stable income and physical safety, aren't secure. Until those lower levels are met, higher motivators like growth or recognition have little effect.", "id": "9.35"}, {"s": 9, "q": "What are the advantages of piece-rate pay?", "k": "piece rate advantages, pros of piece rate, pros and cons of piece rate, piece rate pros and cons", "a": "It rewards effort and output, it's simple to understand, and the company only pays for completed work. That's why we keep a per-order commission in our hybrid.", "id": "9.36"}, {"s": 9, "q": "What are the disadvantages of piece-rate pay?", "k": "piece rate disadvantages, cons of piece rate, risks of piece rate, pros and cons of piece rate, piece rate pros and cons", "a": "All the income risk falls on the worker: waiting time, quiet hours and bad weather earn nothing. It can push people to rush, which hurts safety, and the rate can be cut at any time.", "id": "9.37"}, {"s": 9, "q": "Is KeeTa breaking any law by paying this way?", "k": "legal compliance pay, statutory compliance, illegal pay", "a": "Not as far as we know, because couriers are treated as contractors. The course covers statutory compliance, and the risk is that if couriers were found to be employees, KeeTa could owe minimum wage gaps and MPF.", "id": "9.38"}, {"s": 9, "q": "What's the difference between the point method and factor comparison?", "k": "job evaluation methods, point method, factor comparison", "a": "The point method gives points to each job for set factors, like skill, effort, responsibility and conditions, and turns the total into a pay grade. Factor comparison ranks jobs factor by factor against benchmark jobs. The point method is simpler for setting a courier base rate.", "id": "9.39"}, {"s": 9, "q": "What is market-rate pay?", "k": "market rate, pay benchmark, competitive pay", "a": "Pay set in line with what similar jobs pay in the same market. If pay falls below it, people leave for better offers. For couriers, the benchmark is Foodpanda and similar delivery jobs.", "id": "9.40"}, {"s": 9, "q": "Why is \"flexible hours aid recruitment\" a strength?", "k": "flexibility recruitment strength, why flexible hours help hiring", "a": "Students, part-timers and people with other jobs can all join easily. That gave KeeTa a fast-growing fleet, which is a real advantage we keep in our recommendations.", "id": "9.41"}, {"s": 9, "q": "What's the difference between a hiring freeze and natural attrition?", "k": "hiring freeze vs attrition, define attrition", "a": "A hiring freeze stops new hiring. Natural attrition lets the workforce shrink as people leave on their own. Both are slow, low-suffering ways to reduce a surplus.", "id": "9.42"}, {"s": 9, "q": "How does the four-layer model help KeeTa compete for couriers?", "k": "compete for couriers, retention four layers", "a": "Couriers can switch apps easily. A package with a base, incentives, benefits and a few perks is more attractive than fees alone, so it helps KeeTa keep trained couriers.", "id": "9.43"}, {"s": 9, "q": "What is the difference between internal and external equity?", "k": "internal equity, external equity, define", "a": "Internal equity means fair pay between people doing similar work inside the company. External equity means pay that matches the outside market. K GO breaks internal equity; falling fees hurt external equity.", "id": "9.44"}, {"s": 9, "q": "What is HR planning, and how would KeeTa use it?", "k": "workforce planning, human resource planning, plan couriers", "a": "Comparing labour demand with labour supply to spot a shortage, surplus or balance. KeeTa should forecast courier demand by district and hour, compare it with active couriers, and plan pay and recruitment accordingly instead of cutting pay.", "id": "9.45"}, {"s": 9, "q": "What is a balanced workforce?", "k": "balanced workforce, supply equals demand", "a": "When labour supply roughly matches demand. For KeeTa, that means enough active couriers at peak hours without too many idle couriers at quiet times. Our scheduling of active slots under the pay floor aims for that balance.", "id": "9.46"}, {"s": 9, "q": "What external factors should KeeTa scan in workforce planning?", "k": "environmental scanning, external factors, PEST, labour market", "a": "The economy and unemployment, which affect how many people want courier work. Competitors like Foodpanda and Deliveroo's exit. Technology. Demographics. And government policy, like the platform-worker plans in the 2026 Policy Address.", "id": "9.47"}, {"s": 9, "q": "What internal factors should KeeTa scan?", "k": "internal factors, internal scanning", "a": "Its growth strategy, current number of active couriers, turnover rate, how couriers move between districts and hours, and how pay changes affect supply. Turnover data is the most important one it currently ignores.", "id": "9.48"}, {"s": 9, "q": "How is the Boeing case from class similar to KeeTa?", "k": "Boeing case, surplus to shortage, labour swing", "a": "Boeing went from a surplus of pilots during COVID to a sharp shortage after travel rebounded. KeeTa's courier market can swing too: Deliveroo's exit added available couriers, but pay cuts and strikes can quickly turn that into a shortage. Planning should look ahead, not just at today.", "id": "9.49"}, {"s": 9, "q": "What are the pros and cons of internal recruitment for KeeTa?", "k": "internal recruitment pros cons, promote from within", "a": "For roles like trainers or grievance staff, internal recruitment rewards good couriers, uses known performance and costs less. The risks are fewer fresh ideas and disappointed couriers who aren't chosen, so the selection must be transparent.", "id": "9.50"}, {"s": 9, "q": "What are the pros and cons of external recruitment for KeeTa?", "k": "external recruitment pros cons, hire from outside", "a": "External hires bring new skills, like HR professionals for the grievance team, and more diversity. But they cost more to train and may not understand couriers' daily reality. That's why we suggest a mix.", "id": "9.51"}, {"s": 9, "q": "What recruitment channels does KeeTa use, and which would you add?", "k": "recruitment channels, sourcing, social media recruitment, referral", "a": "Mainly the app, online ads and word of mouth. We'd add an employee referral bonus for couriers who bring safe, reliable riders, since referrals tend to stay longer, and targeted social media ads in the languages couriers use.", "id": "9.52"}, {"s": 9, "q": "What is the \"can do / will do\" model, and how does it apply to couriers?", "k": "can do will do, ability and motivation, job performance formula", "a": "Job performance depends on ability, what someone can do, and motivation, what they will do. A riding test checks \"can do\". Fair pay, recognition and a fair appeal process build \"will do\". KeeTa ignores both: no skills test, and pay cuts that kill motivation.", "id": "9.53"}, {"s": 9, "q": "Explain reliability and validity using the dartboard metaphor
